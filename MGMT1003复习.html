    {"q": "A founder asks: \"If demand doubled overnight, could we serve twice the customers without doubling staff?\" This question tests whether the business is:", "options": ["Profitable", "Scalable", "Socially responsible", "Bootstrapped"], "answer": 1, "exp": "需求翻倍而人手不用翻倍，考的是可扩张性（scalable）；能不能赚钱、有没有社会责任都不是这个问题问的。"},
    {"q": "After being made redundant, Tom becomes a sole trader mainly so that he has some income. Using the growth-intent typology, Tom is a:", "options": ["Survival entrepreneur", "Lifestyle entrepreneur", "Serial entrepreneur", "Growth entrepreneur"], "answer": 0, "exp": "Tom 开始接活只是为了有点收入，因为不这样做就没有收入，这正是生存型（Survival）创业者。"},
    {"q": "In the survey of what owners find most rewarding, which group values work–life balance most?", "options": ["Idealists", "Optimisers", "Jugglers", "Sustainers"], "answer": 3, "exp": "Sustainers（15%）最看重工作与生活平衡；Idealists 重新颖创造，Optimisers 重个人满足。"},
    {"q": "Canva began as Fusion Books, an online yearbook design tool for schools. What lesson does the lecture draw from this?", "options": ["Start with a general product for everyone", "Avoid investors at all costs", "Pivot randomly until something works", "Start with a specific first customer, learn, then expand to a general scalable product"], "answer": 3, "exp": "Canva 先为学校这一个具体顾客做年册工具，从顾客身上学习，再扩展成人人可用、可扩张的产品；不是一开始就做通用产品。"},
    {"q": "Atlassian priced its software so developers could buy it without complex approval and launched using credit cards. What does the lecture say external capital later bought?", "options": ["Growth rather than survival", "Survival", "Board control for founders", "Government grants"], "answer": 0, "exp": "Atlassian 先用自己的钱证明产品和分销模式能跑通，模式成熟后再拿外部资本，所以外部资本买的是增长，不是生存。"},
    {"q": "A student notices rising interest in fitness tracking and says, \"Health is a huge trend, so I have an opportunity.\" What is the key weakness in this reasoning?", "options": ["Trends are never useful for entrepreneurs", "Health is not a growing market", "A trend becomes an opportunity only with a specific need, a value-creating product and a named first customer", "Opportunities require venture capital first"], "answer": 2, "exp": "趋势不等于机会：要说得出具体需求、具体的第一位顾客，以及产品给买家创造什么价值，否则「健康」只是一个主题。"},
    {"q": "According to the lecture, what fundamentally changed entrepreneurial logic when comparing 2005 with 2026?", "options": ["The cost of being wrong has fallen", "Distribution has become easier than building", "Bank loans have become more accessible", "Founders now need larger engineering teams"], "answer": 0, "exp": "根本变化是犯错的成本下降了：试错更便宜更快，所以应该多做小规模测试，而不是把省下的钱押在更大的未验证赌注上。"},
    {"q": "Which of the following is NOT one of the four advantages that remain scarce in the AI era?", "options": ["Distribution", "Proprietary data and relationships", "Trust and accountability", "Ability to write code quickly"], "answer": 3, "exp": "AI 时代仍然稀缺的是分销、专有数据和关系、信任和问责、品味和判断力；写代码快恰恰是被 AI 压低成本的那一项。"},
    {"q": "A six-person AI start-up lets each employee decide whether to paste customer records into public AI tools. Which AI-era management rule is most directly violated?", "options": ["Re-plan more often", "Write data rules before the first customer", "Protect the human part of the job", "Fund small bets"], "answer": 1, "exp": "违反的是「在第一个客户之前写好数据规则」：要先规定什么数据能进模型、什么绝不能，以及谁能批准例外。"},
    {"q": "A social enterprise grows rapidly by shifting toward wealthier, more profitable customers and away from the communities it was founded to serve. This illustrates:", "options": ["Mission needs margin", "Bootstrapping", "Margin can eat mission (mission drift)", "Positive synergy"], "answer": 2, "exp": "增长压力把企业拉向更赚钱的顾客、离开本来要服务的社区，这就是使命漂移，也就是「利润吃掉使命」。"},
    {"q": "Why does the lecture describe Grameen Bank as more than an act of kindness?", "options": ["It relied entirely on donations", "It redesigned lending so customers labelled \"unlendable\" could become reliable borrowers", "It charged the highest interest rates in Bangladesh", "It required collateral from all borrowers"], "answer": 1, "exp": "Grameen Bank 重新设计放贷方式，让银行眼里「不能贷」的人成了可靠借款人；这是重新理解风险，不只是善心。"},
    {"q": "When interviewing potential customers before building, which question is LEAST useful according to the lecture?", "options": ["How do you currently solve this problem?", "How much time or money does it cost you?", "What would make you switch solutions?", "Do you like my idea?"], "answer": 3, "exp": "「你喜欢我的点子吗」只会换来礼貌的客套，不是购买证据；该问的是对方现在怎么解决、花多少钱、什么情况下会换方案。"},
    {"q": "A founder with no revenue yet needs funds for a product with high growth potential. Which financing approach does the lecture suggest is generally more suitable?", "options": ["Equity financing, because there is no fixed repayment obligation", "A large bank loan, because interest rates are low", "Debt, because founders keep all ownership", "Personal credit cards indefinitely"], "answer": 0, "exp": "借债要有可预测的收入才还得起本息，还没收入的高成长公司更适合股权融资，因为没有固定还款压力。"},
    {"q": "A founder gives up 20% of the company in each of four funding rounds (simplified assumption). What share of the original holding remains?", "options": ["20%", "40.96%", "51.2%", "60%"], "answer": 1, "exp": "每轮让出 20%，就剩下 80%，四轮连乘：0.8 的四次方是 0.4096，也就是剩 40.96%。"},
    {"q": "A venture-backed company closes, reporting that it \"ran out of capital\". The lecture suggests the deeper cause is often:", "options": ["Too much equity financing", "Choosing a company structure", "Poor product-market fit", "Hiring professional managers"], "answer": 2, "exp": "资金耗尽往往只是故事结束的地方，是近因；钱为什么会烧光，深层原因常常是产品和市场不匹配。"},
    {"q": "A firm is profitable and stable; its leaders are debating whether to slow down or push on. Which Churchill and Lewis stage is it in?", "options": ["Existence", "Survival", "Success", "Resource maturity"], "answer": 2, "exp": "盈利又稳定、在纠结要不要继续冲，这是 Success 阶段的问题；融资和请职业经理人是 Take-off 阶段才问的。"},
    {"q": "A large, mature firm finds that every manager rationally protects existing products and new ideas stall. Which practice would the lecture recommend?", "options": ["One large committee-approved innovation bet", "Unallocated time, small bets, a route to implementation and survivable failure", "Removing all small teams", "Waiting for a crisis to force change"], "answer": 1, "exp": "大公司要营造内部创业的气候：给员工不分配任务的时间、资助小额押注、给点子一条实施路径，并让失败可以承受。"}

  "essay": [
    {"q": "Case: Two ANU students plan an app helping international students manage cross-border payments. They have spent three months building a polished version, funded by a family loan with no written terms. They have not spoken to any customers but say \"everyone we know thinks it's a great idea\". They now want to approach venture capitalists. Using Week 5 concepts, evaluate their approach and recommend next steps.",
     "points": ["Distinguish idea/trend from opportunity; name a specific first customer and buyer value", "Explain validate before you build: customer interviews, MVP, pre-sell; stated interest is weak evidence", "Discuss financing: family loans should be written like bank loans; equity/VC suits proven scalable models; each stage priced on risk removed", "Note poor product-market fit as the deep cause of running out of capital", "Recommend cheap-to-fail tests, possible pivot, and appropriate legal structure (company needed for VC)"],
     "model": "Diagnosis: The students have an idea, not yet a validated opportunity. An opportunity requires a specific customer, timely need and a product that creates value for the buyer; they have not named a first customer or tested what problem international students actually face. Friends saying the idea is great is only stated interest, which is weak evidence compared with deposits, signed letters of intent or crowdfunding pledges. By spending three months building before testing, they ignored the principle of validate before you build, and risk poor product-market fit — the deep cause behind many ventures that eventually run out of capital.\n\nFinancing: The family loan without written terms is fast but hardest to renegotiate; it should be documented like a bank loan. Approaching VCs now is premature: each funding stage is priced on the risk removed since the last one, and VC is expensive capital that comes with a board and suits models already showing rapid scalability. VCs would also normally require a company structure so they can buy shares.\n\nRecommendations: Interview target students about how they currently pay, what it costs and what would make them switch; release a minimum viable product to real users; seek pre-sales or pledges; and pivot deliberately if evidence demands. Once they have evidence someone will pay, pre-seed or angel funding becomes appropriate."},
    {"q": "Case: A software start-up has grown from 6 to 60 staff in two years. The founder still approves every hire, reviews all customer-facing AI outputs personally and makes most product decisions; decisions now wait weeks. Staff increasingly use AI tools with no agreed rules, and a recent error in an AI-generated customer report became public. Investors are pushing for faster growth. Using Week 5 concepts, diagnose the issues and advise the founder.",
     "points": ["Identify stage of growth (take-off) and that questions change across stages", "Explain founder-to-manager transition: do → direct → build people who direct; delegation is the bottleneck", "Identify AI governance gaps: state norms, decide who verifies, data rules, protect human judgment; speed without a check", "Discuss professional managers as not a failure; first hires set culture", "Recommend explicit accountability, delegation and norms; consider investor exit expectations"],
     "model": "Diagnosis: The firm is approaching the take-off stage in Churchill and Lewis's model, where the key questions are how to finance growth and whether to hand over to professional managers. Managing with earlier-stage habits causes stagnation. The founder has not completed the transition from doing the work to directing it and then to building the people who direct the work. Because every decision routes through the founder, delegation has become the bottleneck that prevents scaling.\n\nThe AI problems reflect missing governance. In the AI era, production is cheap but trust and accountability remain scarce. The firm never stated AI norms, decided who verifies customer-facing outputs, or wrote data rules. As the lecture warns, speed without a check is how small errors become public ones.\n\nRecommendations: The founder should delegate decisions by naming accountable owners for product areas and for verifying AI outputs, and should write explicit rules on what data can enter models and who approves exceptions. Norms must be stated out loud because new hires will otherwise infer them. Hiring professional managers is not a failure but a response to problems that have outgrown the founder's role. Finally, before accepting more investor money, the founder should clarify exit expectations, since investors need an exit while the founder may not want one."}
  ]
},

  "concepts": [
    {"term": "Cross-cultural management", "zh": "跨文化管理", "def": "Identifying similarities and differences across cultural backgrounds and adjusting communication, decision-making and leadership so collaboration works.", "defZh": "descriptive、practical、two-directional 三个特点。", "one": "识别不同文化背景的异同，调整沟通、决策和领导方式，让合作顺利。", "eg": "经理发现员工会后才发邮件提担忧，不把它当成不配合，而是问对方在哪种场合更好开口。", "like": "像双向翻译：既要读懂对方，也要明白自己的习惯不是标准答案。"},
    {"term": "Culture", "zh": "文化", "def": "The shared assumptions, values and practices a group learns and passes on; shared, learned and largely invisible.", "defZh": "像群体学会的操作系统，不是基因里的出厂设置。", "one": "一个群体共享、后天学来、大多看不见的假设、价值观和做法。", "eg": "新员工慢慢学会「先私下提问题，再在会上确认」，这条规矩员工手册里根本没写。", "like": "像冰山：露出水面的是行为，水下更大的那块是没说出口的假设。"},
    {"term": "Power distance", "zh": "权力距离", "def": "The extent to which less powerful members accept an unequal distribution of power.", "defZh": "不是上级多想掌权，而是下属认为台阶应有多高。", "one": "权力小的那一方有多接受权力分得不平等，台阶多高由下面的人说了算。", "eg": "韩国员工开会时附和经理、会后才发邮件反馈，澳大利亚经理却误以为他们很被动。", "like": "像上下级之间的台阶：有多高，由下面的人觉得正常的高度决定。"},
    {"term": "Individualism–collectivism", "zh": "个人主义—集体主义", "def": "Whether people prioritise themselves and immediate family, or loyalty to a tight in-group in exchange for protection.", "defZh": "个人主义下个人态度更能预测行为；集体主义下感知规范更能预测。", "one": "人们更顾自己和小家庭，还是忠于紧密的内群体来换取保护。", "eg": "Eom 等人（2016）发现，集体主义样本里，感知到的社会规范更能预测绿色消费。", "like": "像两个开关：一个接「我自己的理由」，另一个接「团队的信号」。"},
    {"term": "Masculinity–femininity", "zh": "成就—关怀取向", "def": "The relative importance of competition, achievement and material reward versus cooperation, modesty, caring and quality of life.", "defZh": "不是生理性别；标签有争议，替代说法 achievement orientation。", "one": "社会更看重竞争和成就，还是合作、谦逊和生活质量；与生理性别无关。", "eg": "同样是项目成功，一组更看重个人业绩奖金，另一组更看重大家商量着来和生活质量。", "like": "像比赛更看重拿冠军，还是大家都踢得开心。"},
    {"term": "Uncertainty avoidance", "zh": "不确定性规避", "def": "How threatening members find ambiguity and the unknown, and how much they rely on rules to cope.", "defZh": "高者需要规则、详细说明、工作保障。", "one": "人们对模糊和未知有多不安，有多依赖规则来应付。", "eg": "经理只说「大胆创新」，一位员工因为不知道标准和失败的后果，迟迟不敢动手。", "like": "像走夜路：有人要有路灯和地图才敢走，有人摸黑也自在。"},
    {"term": "Long-term vs short-term orientation", "zh": "长期—短期导向", "def": "Long-term emphasises perseverance, thrift and adaptation; short-term emphasises tradition, face, current social obligations and quick results.", "defZh": "1991 年加入；证据比前四维薄。", "one": "社会看重坚持、节俭和长远适应，还是传统、面子和尽快见效。", "eg": "长期导向的团队愿意持续投入培训和改进，短期导向的团队更在意这个阶段的结果。", "like": "像种树和种菜：一个等多年成林，一个想下个月就收获。"},
    {"term": "Indulgence–restraint", "zh": "享乐—克制", "def": "Whether gratification of natural desires and enjoyment of life is relatively free or regulated by strict social norms.", "defZh": "2010 年加入；管理研究使用较少。", "one": "社会对享受生活、满足欲望是比较放开，还是用严格的规范管着。", "eg": "一组员工自在地聊假期和爱好，另一组担心公开说自己爱玩会显得不符合团队期待。", "like": "像家里的零食规矩：有的随便吃，有的要等考完试才许吃。"},
    {"term": "Low vs high context", "zh": "低语境—高语境", "def": "Low context puts meaning mainly in explicit words; high context relies also on relationship, setting, shared history and what is unsaid.", "defZh": "Hall；例：「That will be difficult」可能是婉拒。", "one": "意思主要靠说出口的字句，还是也藏在关系、场合和没说的话里。", "eg": "供应商说「That will be difficult」是在婉拒，买方却听成了会做。", "like": "像发短信和老夫妻对眼神：一个全靠字面，一个看一眼就懂。"},
    {"term": "Monochronic vs polychronic time", "zh": "单时制—多时制", "def": "Monochronic treats time as a schedule of one thing at a time; polychronic allows parallel tasks and adjusts plans around people and situations.", "defZh": "单时制：日程是承诺；多时制：关系可优先于日程。", "one": "时间是一次只做一件事的日程表，还是可以多事并行、按人和情况调整。", "eg": "单时制的同事把准时到会当成尊重，多时制的同事会先把眼前这个人的事处理完。", "like": "像红绿灯路口和环岛：一个按顺序放行，一个多个方向灵活穿行。"},
    {"term": "GLOBE practices vs values", "zh": "GLOBE 实践与价值", "def": "Distinguishes how things are actually done (practices) from how people think they should be done (values).", "defZh": "约 17,300 名中层经理、951 组织、62 个社会；服从现状不等于赞同现状。", "one": "区分实际怎么做（practices）和应该怎么做（values）。", "eg": "员工每天服从严格的层级，问卷里却希望层级弱一点：服从不等于赞同。", "like": "像天天穿的校服和心里想穿的衣服：穿着不等于喜欢。"},
    {"term": "Universalism–particularism", "zh": "普遍主义—特殊主义", "def": "Universalism applies the same rules equally to all; particularism lets specific relationships and obligations shape how rules apply.", "defZh": "Trompenaars & Hampden-Turner；43 国 8,841 人，7 个维度。", "one": "规则对所有人一视同仁，还是可以看具体关系和义务灵活适用。", "eg": "供应商迟交，一位经理坚持对谁都按合同罚，另一位先考虑长期合作关系。", "like": "像裁判执法：一个对谁都用同一把尺，一个会看是不是老队友。"},
    {"term": "Ecological fallacy", "zh": "生态谬误", "def": "Using a group average to draw conclusions about an individual member of that group.", "defZh": "国家均值高集体主义 ≠ 该国每个同事都喜欢团队奖励。", "one": "拿群体的平均值，去给群体里的某一个人下结论。", "eg": "看到某国集体主义均值高，就断定来自那个国家的新同事一定喜欢团队奖励。", "like": "像看到全班平均身高 170，就断定每个同学都是 170。"},
    {"term": "Cultural intelligence (CQ)", "zh": "文化智力", "def": "An individual's capability to function and manage effectively in culturally diverse settings; can be developed.", "defZh": "不只是储存国家知识，而是适应能力。", "one": "在多元文化环境里有效工作和管理的能力，可以后天培养。", "eg": "外派经理不只是背国家资料，还会观察、核实，并调整自己的沟通方式。", "like": "像会实时改道的导航：不只是存着地图，还会按路况重新规划。"},
    {"term": "Metacognitive CQ", "zh": "元认知文化智力", "def": "Planning before, checking during and revising after interactions one's own cultural assumptions.", "defZh": "例：意识到「我把沉默当同意了」并核实。", "one": "在互动前先计划、互动中检查、互动后修正自己的文化假设。", "eg": "Jake 开会时意识到「我一直把沉默当成同意」，于是会后私下逐个核实。", "like": "像开车时看后视镜：随时检查自己的盲区。"},
    {"term": "Cognitive CQ", "zh": "认知文化智力", "def": "Knowledge of cultural norms, practices and the ways cultures commonly differ.", "defZh": "知道差异（知识地图），区别于检查自己假设的元认知。", "one": "知道各种文化的规范和惯例，以及文化通常在哪些方面不同。", "eg": "出差前先了解对方习惯用头衔还是直呼名字、开会时怎么表达不同意见。", "like": "像出发前带的地图：知道路在哪，但不保证你会走。"},
    {"term": "Motivational CQ", "zh": "动机文化智力", "def": "Interest and confidence in engaging across differences and persisting through awkwardness.", "defZh": "续航电池：第一次不顺仍愿继续。", "one": "对跨文化交往有兴趣、有信心，遇到尴尬也愿意坚持下去。", "eg": "第一次和海外同事开会冷了场，之后仍然主动约对方再聊一次。", "like": "像手机电池：电量足，才撑得过一路信号不好的地段。"},
    {"term": "Behavioural CQ", "zh": "行为文化智力", "def": "Actually adapting language, tone, pace, body language and directness.", "defZh": "真正改变行为；知道为什么不同 ≠ 已做出调整。", "one": "真的调整自己的用词、语气、语速、肢体语言和直接程度。", "eg": "Priya 懂很多国家的规范，却从不放慢语速或收敛直率风格，行为 CQ 就弱。", "like": "像看懂菜谱和真的下厨：会说不等于会做。"},
    {"term": "IAMS vs NOOS", "zh": "利己最大化—不冒犯他人", "def": "IAMS: negotiating to maximise self-interest, competitive, direct, fixed-pie; NOOS: prioritising role obligations, not offending others and relational capital.", "defZh": "课件称 IAMS 较常见于西方样本、NOOS 较常见于东亚样本，但随情境变化。", "one": "IAMS 谈判只求自己利益最大；NOOS 优先不冒犯对方、维护关系。", "eg": "IAMS 买方只盯着最低价，还假定对方也会压价；NOOS 谈判者会避免让对方丢面子。", "like": "像打牌和合伙做饭：一个要赢走筹码，一个要大家都吃得下去。"},
    {"term": "Destroyers / Equalisers / Creators", "zh": "破坏型／抹平型／创造型团队", "def": "Destroyers suppress differences and stereotype; Equalisers smooth differences to avoid conflict; Creators surface and use differences for better outcomes.", "defZh": "Creators 通过 Map → Bridge → Integrate 利用差异。", "one": "破坏型压制差异，抹平型为了避免冲突磨平差异，创造型把差异摆出来用好。", "eg": "团队先说清各自怎么提异议，再约定先书面后讨论，最后把不同的风险判断融进计划。", "like": "像对待不同的乐器：砸掉、全调成同一个音，或者编成一首交响乐。"}
  ],
  "tf": [
    {"q": "According to the lecture, cross-cultural management is two-directional: a manager's own habits are not a neutral standard.", "a": true, "exp": "跨文化管理是双向的，经理自己的习惯也不是中立标准；它还有描述性和实用性两个特点。"},
    {"q": "Hofhuis et al. (2015) found that perceived benefits and perceived threats of diversity are opposite ends of a single scale.", "a": false, "exp": "两种感知大体上是独立的，一名员工可以同时看到多样性的好处，又担心它的成本。"},
    {"q": "Culture is described as shared, learned and largely invisible.", "a": true, "exp": "文化是群体共享、后天学来、大部分看不见的，这正是它的三个特点。"},
    {"q": "Hofstede's dimension scores describe the personality of individual citizens of each country.", "a": false, "exp": "Hofstede 的分数是国家层面的指数，不是每个国民的性格分数，也不是人数的百分比。"},
    {"q": "Power distance measures how much leaders want to hold power.", "a": false, "exp": "权力距离衡量的是权力较少的人有多接受权力分配不平等，不是领导多想掌权。"},
    {"q": "In more collectivist contexts, perceived social norms tend to predict behaviour more strongly than personal attitudes.", "a": true, "exp": "集体主义情境下，感知到的社会规范比个人态度更能预测行为，Eom 等人的日本样本就是如此。"},
    {"q": "The masculinity–femininity dimension refers to the biological sex composition of a country's workforce.", "a": false, "exp": "这个维度比的是竞争成就和合作关怀哪个更重要，与生理性别无关，所以也有人叫它成就取向。"},
    {"q": "The lecture notes that long-term orientation and indulgence–restraint are used less in management research and have thinner evidence than the first four dimensions.", "a": true, "exp": "这两个后加的维度证据较薄，管理研究用得少，只能当作启发性线索，不能当定论。"},
    {"q": "High-context communication is a higher-quality form of communication than low-context communication.", "a": false, "exp": "高语境、低语境说的是意思藏在字句里还是背景里，不是沟通质量的高低。"},
    {"q": "GLOBE found that people can work in organisations high in power distance in practice while ideally valuing lower power distance.", "a": true, "exp": "GLOBE 区分实际做法和理想价值：人们可以天天服从高权力距离，心里却希望它低一些。"},
    {"q": "Committing the ecological fallacy means applying a group's average cultural score to predict an individual member's behaviour.", "a": true, "exp": "生态谬误就是从群体平均值直接跳到某个人身上，拿国家分数预测个人行为正是这样。"},
    {"q": "Taras et al. (2010) found that cultural values predict job performance, absenteeism and turnover more strongly than personality does.", "a": false, "exp": "Taras 等人发现文化价值的平均效应只有约 0.18，预测绩效、缺勤和离职时比人格弱。"},
    {"q": "The effect size of about 0.18 reported by Taras et al. means cultural values predict individual outcomes correctly 18% of the time.", "a": false, "exp": "0.18 是效应量，不是「18% 的时候预测正确」，两者意思完全不同。"},
    {"q": "According to Ang et al. (2007), motivational and behavioural CQ predict adaptation.", "a": true, "exp": "动机和行为 CQ 预测的是适应，元认知和认知 CQ 预测的是文化判断。"},
    {"q": "An Equaliser team fully exploits its diversity by smoothing over differences.", "a": false, "exp": "抹平型团队为了避免冲突把差异磨平，能运作但没有用足多样性；真正利用差异的是创造型。"}
  ],
  "mcq": [
    {"q": "In a team meeting, a junior employee publicly agrees with her manager's plan, then emails serious concerns afterwards. Which Hofstede dimension most directly helps explain this?", "options": ["Indulgence–restraint", "Power distance", "Long-term orientation", "Masculinity–femininity"], "answer": 1, "exp": "在高权力距离下，公开反对上级代价很高，所以异议常常转到私下，会后发邮件正是这种表现。"},
    {"q": "A manager wants to encourage recycling among staff in a strongly collectivist context. Based on Eom et al. (2016), which message is likely to be most effective?", "options": ["Explain how recycling fits each person's environmental beliefs", "Show that colleagues are already recycling and that respected members support it", "Offer individual cash bonuses only", "Publish a ranking of the worst recyclers"], "answer": 1, "exp": "集体主义情境下，感知到的规范比个人信念更能预测行为，所以要展示同事已经在回收、受尊敬的人也支持。"},
    {"q": "A manager says, \"Be bold and innovate,\" but one employee freezes because she doesn't know the standards or the consequences of failure. Which dimension is most relevant?", "options": ["Uncertainty avoidance", "Individualism–collectivism", "Indulgence–restraint", "Universalism–particularism"], "answer": 0, "exp": "员工因为不知道标准和失败的后果而不敢动，这是高不确定性规避的表现，应该把任务、标准和后果写清楚。"},
    {"q": "A supplier responds to a deadline request with \"That will be difficult.\" The buyer hears \"a bit hard, but it will be done.\" This misunderstanding best reflects:", "options": ["Monochronic vs polychronic time", "Masculinity–femininity", "Low- vs high-context communication", "Long- vs short-term orientation"], "answer": 2, "exp": "高语境下这句话可能就是婉拒，低语境的买方只听字面意思，所以要再核对对方到底承诺了什么。"},
    {"q": "One colleague treats arriving exactly on time as a sign of respect; another prioritises finishing a conversation with the person in front of them. Which framework best explains this?", "options": ["GLOBE practices vs values", "IAMS vs NOOS", "Power distance", "Monochronic vs polychronic time"], "answer": 3, "exp": "单时制把日程当成承诺，准时到就是尊重；多时制允许眼前的人和事优先于日程，所以先把对话说完。"},
    {"q": "A supplier delivers late. One manager insists on applying the contract penalty to all suppliers equally; another wants to consider the long-term relationship first. This contrast reflects:", "options": ["Universalism vs particularism", "High vs low power distance", "Indulgence vs restraint", "Equalisers vs creators"], "answer": 0, "exp": "坚持对谁都按合同罚是普遍主义，先看长期关系再决定是特殊主义，这是 Trompenaars 的维度，不是权力距离的问题。"},
    {"q": "Employees in a firm follow strict hierarchy every day, but in a survey they say they wish hierarchy were weaker. Which framework best captures this gap?", "options": ["Hofstede's power distance index", "GLOBE's distinction between practices and values", "Hall's high-context communication", "Salacuse's negotiation factors"], "answer": 1, "exp": "GLOBE 专门区分实际怎么做和认为应该怎么做，员工天天服从层级却希望它弱一些，正是这两者的差距。"},
    {"q": "A manager reads that a country scores high on collectivism and concludes that a new hire from that country must prefer team-based rewards. This is an example of:", "options": ["Cognitive CQ", "Pluralistic ignorance", "Circular explanation", "Ecological fallacy"], "answer": 3, "exp": "把国家的集体主义平均分直接套到一个新同事身上，就是生态谬误；国家分数只能当假设，不能当个人的结论。"},
    {"q": "After a project fails, an analyst explains it by saying \"it was because of high uncertainty avoidance\" without any prior prediction. Which critique of Hofstede does this illustrate?", "options": ["Nation as a proxy", "One employer, one era", "Circular explanation", "Survey data only"], "answer": 2, "exp": "事后拿一个维度的名字来解释结果，事先却没有做过预测，这就是循环解释，等于什么都没解释。"},
    {"q": "Which criticism of Hofstede's framework refers to the fact that IBM employees in 1967–1973 are not representative of each nation?", "options": ["One employer, one era", "Averages hide the spread", "Culture treated as static", "Circular explanation"], "answer": 0, "exp": "样本只来自 IBM 一家公司和 1967 到 1973 年一个年代，代表不了每个国家，这就是「一个雇主、一个年代」。"},
    {"q": "During a meeting, Jake realises, \"I've been treating silence as agreement,\" and decides to check with the team privately. Which CQ component is he demonstrating?", "options": ["Cognitive CQ", "Metacognitive CQ", "Motivational CQ", "Behavioural CQ"], "answer": 1, "exp": "Jake 发现自己一直在用「沉默就是同意」这个假设，并决定去核实，这是检查和修正自己文化假设的元认知 CQ。"},
    {"q": "Priya knows a lot about different countries' norms but never changes her direct style or speaking pace when working with international colleagues. Which CQ component is weakest?", "options": ["Cognitive CQ", "Metacognitive CQ", "Behavioural CQ", "Motivational CQ"], "answer": 2, "exp": "Priya 知道各国规范，但从不改变自己的语速和直率风格，缺的是真正调整行为的行为 CQ；知道不同不等于已经调整。"},
    {"q": "A negotiator focuses on getting the lowest price, assumes the other side will squeeze him too, and views value as a fixed pie. Which negotiation orientation is this?", "options": ["NOOS", "Particularism", "Win–win", "IAMS"], "answer": 3, "exp": "只盯最低价、假定对方也会压价、把价值看成固定的一块饼，这是追求自身利益最大化的 IAMS 取向。"},
    {"q": "According to Salacuse, one negotiator sees the goal as signing a contract. What is the contrasting default goal?", "options": ["Building a working relationship", "Maximising the price", "Writing more detailed clauses", "Avoiding any agreement"], "answer": 0, "exp": "Salacuse 说的谈判目标差异：一方把目标看成签下合同，另一方把目标看成建立一段能运作的关系。"},
    {"q": "A multicultural team avoids discussing different views so that meetings stay calm; its plans end up as the most ordinary consensus. This team is best described as:", "options": ["Destroyers", "Creators", "Equalisers", "Integrators"], "answer": 2, "exp": "为了会议平静而不谈分歧，最后只得到最平庸的共识，这是抹平型（Equalisers）：能运作，但没用上多样性。"},
    {"q": "A team first discusses how each member prefers to raise disagreement, then agrees to submit written comments before discussion, and finally merges different risk assessments into the plan. These steps follow:", "options": ["Destroy → Equalise → Create", "Plan → Check → Revise", "Map → Bridge → Integrate", "Existence → Survival → Success"], "answer": 2, "exp": "先说清各自的差异是 Map，约定先书面后讨论是搭沟通桥梁的 Bridge，把不同视角融进成果是 Integrate。"},
    {"q": "In the six-person Canberra / Ho Chi Minh City team activity, the manager wants honest feedback on a proposal. Which meeting change does the lecture's answer recommend?", "options": ["Ask \"Does everyone agree?\" at the end", "Ask each person to name a risk, an unrealistic assumption and a change, possibly in writing or anonymously first", "Let the most talkative members speak first", "Compare which location's staff are more honest"], "answer": 1, "exp": "要改的是流程，让真实的异议说出来更安全，比如先书面或匿名提风险；不要去比较哪个地点的人更诚实。"},
    {"q": "Which approach to feedback does the lecture suggest transfers best across cultures?", "options": ["Public individual rankings", "Feedback only at the annual appraisal", "Feedback delivered only through a third party", "Private, specific and early feedback"], "answer": 3, "exp": "私下、具体、尽早的反馈最容易跨文化通用；公开排名可能让人感到羞辱，在很多文化里行不通。"}
  ],

  "essay": [
    {"q": "Case: An Australian manager, Sam, is transferred to lead a team in Seoul. In meetings he asks \"Any objections?\" and, hearing none, proceeds. Weeks later he learns several team members had serious concerns about a launch date that they never raised. Sam concludes that his team is \"passive\" and plans to give public individual rankings to push more initiative. Using Week 6 concepts, analyse the situation and advise Sam.",
     "points": ["Apply power distance: public disagreement with a superior may be costly; bad news may be delayed", "Apply high vs low context: public agreement may not equal real agreement", "Warn against ecological fallacy and two-directional misreading; separate culture, personality and situation", "Explain risks of public rankings (shame); prefer private, specific, early feedback", "Recommend CQ-based actions: ask preferences, safe bad-news channels, written/anonymous input, stated team norms"],
     "model": "Diagnosis: Sam is reading his team through his own default rules. Cross-cultural management is two-directional: his low power distance assumption that silence means agreement is not a neutral standard. In higher power distance settings, openly challenging a superior can be costly, so disagreement moves to private channels and bad news may be delayed or softened. High-context communication may also mean that public agreement signals politeness rather than commitment. Labelling the team as \"passive\" mirrors the lecture's example of a manager misreading courtesy. However, Sam should avoid the ecological fallacy: national scores are hypotheses, not descriptions of each employee. The silence could also reflect personality (caution) or situation (unclear materials, belief the decision was already final).\n\nRecommendations: Sam should use metacognitive CQ to notice he treated silence as agreement and verify it. Instead of asking \"Any objections?\", he could ask each member to note one risk, one unrealistic assumption and one change, in writing or anonymously before discussion. He should create a channel for bad news that does not require contradicting him publicly, speak to quieter members privately, and ask each person how they prefer to receive feedback and support. Public rankings risk shame; private, specific and early feedback transfers better. Finally, he should state team norms about dissent explicitly in the first week."},
    {"q": "Case: A global consulting firm uses Hofstede country scores to assign staff: employees from high-collectivism countries are automatically placed on team-based incentive schemes, and those from high-uncertainty-avoidance countries are kept off innovation projects. Several employees complain that the policy stereotypes them. As an adviser, critically evaluate this policy using Week 6 concepts and propose a better approach.",
     "points": ["Explain Hofstede scores are national-level indices, not individual profiles", "Identify ecological fallacy; cite Taras et al. (2010) effect ≈ 0.18, weaker than personality", "Apply other critiques: one employer one era, nation as proxy, averages hide spread, static culture", "Note multiple layers of culture (organisational, professional, generational, individual)", "Recommend using frameworks to generate hypotheses, then ask individuals and update; develop CQ"],
     "model": "Evaluation: The policy misuses Hofstede's framework. Hofstede's dimensions are national-level indices derived from IBM employees surveyed in 1967–1973; they are not personality scores of individuals. Assigning people to incentives or projects based on national averages commits the ecological fallacy — inferring an individual's traits from a group mean. Evidence reported in the lecture supports caution: Taras et al. (2010), combining 598 studies with over 200,000 people, found an average effect of cultural values on individual outcomes of about 0.18, weaker than personality for predicting performance, absenteeism and turnover. Further critiques apply: nation is an imperfect proxy for culture, averages hide wide internal variation, survey responses differ from actual behaviour, and cultures change over time. Each employee also carries organisational, professional, generational and individual layers, so a consultant's professional culture may matter more than nationality.\n\nRecommendation: The firm should use frameworks to generate questions, not verdicts. Managers should form a hypothesis, check other cultural layers and situational factors, ask employees directly about their preferences for rewards, feedback and project types, and update on the evidence — letting individual answers override national-score assumptions. The firm should also invest in developing staff cultural intelligence across all four components, so managers can plan, check and adapt their behaviour rather than rely on stereotypes."}
  ]
},

    {"term": "Social support seeking", "zh": "社会支持寻求", "def": "How people seek help; not asking for help does not mean having no difficulty, so invitations should fit people's needs.", "defZh": "员工不主动求助不等于没有困难；改变的是邀请方式（如私下询问），不是降低支持标准。", "one": "员工不开口求助不代表没困难，管理者要按对方的习惯调整邀请方式。", "eg": "经理私下问「要不要一起看一下」，怕麻烦别人的员工就更容易接受帮助。", "like": "像有人会按求救铃，有人只等你来敲门。"},
    {"term": "Managerial ethics", "zh": "管理伦理", "def": "Using moral principles and values to judge whether managerial behaviour is right or wrong, focusing on its impact on people, society and the environment.", "defZh": "用道德原则判断管理行为对错；法律是护栏，伦理还要看护栏之内有没有人被伤害。", "one": "用道德原则判断管理行为对错，不只看合不合法，还看对人和环境的影响。", "eg": "合同允许用客户数据，但客户并不真正明白用途，经理仍要考虑隐私有没有受损。", "like": "像开车：法律是护栏，伦理还要看护栏内有没有撞到人。"},
    {"term": "Codified law / Ethics / Free choice", "zh": "成文法律 / 伦理 / 自由选择", "def": "Law has formal enforcement; ethics is social and moral judgement of what ought to be done; free choice is personal preference without strong legal or moral obligation.", "defZh": "三个领域并非完全隔离；合法不自动等于合乎伦理。", "one": "法律靠强制执行，伦理是应不应该做的道德判断，自由选择是纯个人偏好。", "eg": "遵守劳动法是法律，主动提醒顾客容易忽略的条款是伦理，选笔记本颜色是自由选择。", "like": "像过马路：红灯停是法律，绿灯礼让行人是伦理，走哪侧是自由。"},
    {"term": "Ethical dilemma", "zh": "伦理两难", "def": "A situation where each option protects a defensible value and every choice carries some cost.", "defZh": "不是好人键/坏人键，而是两条路各有要保护的价值，如员工上网监控：信息安全 vs 隐私。", "one": "两个选项各自守护一种站得住脚的价值，不管选哪个都要付出代价。", "eg": "监控员工上网能加强信息安全，却会牺牲员工的隐私和信任，两边都有道理。", "like": "像两位队友同时求救而你只能先救一个，怎么选都有人受损。"},
    {"term": "Utilitarian approach", "zh": "功利主义视角", "def": "Compare benefits and harms to all affected parties and choose the option with the greatest net benefit.", "defZh": "看总体后果；风险：多数受益仍可能让少数人严重受损，长期后果难估计。", "one": "把所有受影响的人的得失加在一起算，选总体好处最大的方案。", "eg": "评估网络监控时，把信息安全的好处和全体员工的隐私损失放在一起算总账。", "like": "像算全队的总血量，而不是只看队长得了多少分。"},
    {"term": "Moral rights approach", "zh": "道德权利视角", "def": "Ask whether the option respects fundamental rights such as privacy, informed consent, free expression, non-discrimination and due process.", "defZh": "有些基本权利不能因为「全队加分」被没收；权利之间也可能冲突。", "one": "先问方案有没有尊重隐私、知情同意这些基本权利，它们不能拿总收益来换。", "eg": "客户没真正明白数据用途时，不能因为公司收益更高就跳过知情同意。", "like": "像队友的基本装备，不能因为全队加分就随便没收。"},
    {"term": "Distributive justice", "zh": "分配正义", "def": "Fairness of outcomes: WHAT people receive (pay, workload, bonuses, training).", "defZh": "WHAT：分到了什么是否公平。", "one": "看结果公不公平：每个人分到的工资、工作量和奖金合不合理。", "eg": "同样完成了项目，两位员工的奖金却差很多，这是分配正义的问题。", "like": "像分蛋糕时只看每人盘子里那块有多大。"},
    {"term": "Procedural justice", "zh": "程序正义", "def": "Fairness of the rules and processes: HOW decisions are made (consistent, transparent).", "defZh": "HOW：怎样决定；招聘、晋升、投诉规则是否一致透明。", "one": "看过程公不公平：做决定的规则是否一致、透明、说得清楚。", "eg": "奖金标准从没公布过，各团队执行得还不一样，员工质疑的就是程序正义。", "like": "像分蛋糕时看由谁拿刀、按什么规则切。"},
    {"term": "Practical approach", "zh": "实践视角", "def": "Whether the decision can be publicly explained to employees, peers and the public and fits professional standards and organisational values.", "defZh": "把理由投上大屏幕能否坦然讲清；但大家赞同不等于一定正确。", "one": "检查决定能不能坦然向员工、同行和公众解释，并符合专业标准。", "eg": "公司不敢公开说明客户数据的真实用法，这本身就是要再检查一遍的警讯。", "like": "像把决策理由投上大屏幕，看你敢不敢当众讲清楚。"},
    {"term": "Corporate social responsibility (CSR)", "zh": "企业社会责任", "def": "Considering social and environmental impacts, not only the firm's own financial interests, when making decisions.", "defZh": "责任范围包括核心经营；对外捐款但在核心业务伤害员工或环境，不算尽责。", "one": "企业做决定时不只算自己的钱，也要考虑对社会和环境的影响。", "eg": "公司捐了一大笔钱，却削减仓库工人的安全培训，这不能算尽到了 CSR。", "like": "像好邻居不只逢年过节送礼，平时也不制造噪音和垃圾。"},
    {"term": "Stakeholder", "zh": "利益相关者", "def": "People and groups who can affect the company or are materially affected by its actions; shareholders are one type.", "defZh": "包括股东、员工、顾客、供应商、社区/环境、监管者。股东只是其中一部分。", "one": "能影响公司、或被公司行动实际影响的所有人和群体，股东只是其中一类。", "eg": "文具售卖机的出资人关心回报，学生关心价格，补货的人关心上班安不安全。", "like": "像一艘船上不只有船东，还有船员、乘客和沿岸居民。"},
    {"term": "Responsible sourcing", "zh": "负责任采购", "def": "Recognising that purchasing terms affect workers, communities and environments along the supply chain.", "defZh": "责任不止于公司大门，如可可案例；Fairtrade 改善交易条件，但不等于所有风险消失。", "one": "采购条件会影响供应链上的工人、社区和环境，企业的责任不止于自家大门。", "eg": "可可案例里收入低、有童工风险和环境压力，交易条件本身就成了 CSR 问题。", "like": "像买现成的衣服，也要问一问做衣服的工人有没有被公平对待。"},
    {"term": "Corporate sustainability", "zh": "企业可持续性", "def": "Creating value today without destroying the social and environmental systems the business depends on tomorrow.", "defZh": "长期经营原则，不是一次活动或一张认证。", "one": "今天赚钱的同时，不破坏明天继续经营所依赖的社会和环境基础。", "eg": "售卖机不只看这个月赚多少，还要能持续补货、合理用工，少耗电少浪费包装。", "like": "像渔民只捕大鱼、放走小鱼，明年才还有鱼可捕。"},
    {"term": "Triple bottom line", "zh": "三重底线", "def": "Assessing performance on People, Planet and Profit.", "defZh": "三脚凳少一条腿就不稳；不是要求忽略利润。", "one": "同时用人、地球、利润三把尺衡量企业表现，不是要放弃利润。", "eg": "售卖机公平对待补货员（人）、减少一次性包装（地球）、售价能覆盖成本（利润）。", "like": "像三脚凳，少了任何一条腿都站不稳。"},
    {"term": "Value signalling", "zh": "价值信号", "def": "People observe a firm's actions, infer what it values, and then decide whether to trust or join it.", "defZh": "看公会平时怎么做，而不是听它自夸。", "one": "人们通过企业的实际行动推断它看重什么，再决定要不要信任或加入它。", "eg": "公司长期保护环境、善待员工，求职者就会推断它真的关心人和自然。", "like": "像看一个人平时怎么待人，而不是听他的自我介绍。"},
    {"term": "Self-transcendence", "zh": "自我超越", "def": "Higher-order value orientation combining Universalism and Benevolence; concern for others and nature.", "defZh": "CSR 最常传递的价值；对立的是 Self-enhancement（Power、Achievement、Hedonism）。另两种：Openness to change（Stimulation + Self-direction）、Conservation（Security + Conformity + Tradition）。", "one": "关心他人和自然的价值取向，由普遍主义和仁慈两种价值合成。", "eg": "加一句环保 CSR 描述后，人们最明显地觉得公司更看重自我超越（系数 0.34）。", "like": "像打游戏不只顾自己的血条，还照顾队友、保护整张地图。"},
    {"term": "Social identity theory", "zh": "社会认同理论", "def": "Part of our self-concept comes from the groups we belong to, so an organisation's image can become part of self-evaluation.", "defZh": "Group membership → Positive distinctiveness → Self-esteem。", "one": "自我概念有一部分来自所属群体，所以组织形象会影响我们怎么看自己。", "eg": "人们会说「我是 ANU 的学生」，从所属的组织里获得身份感和自豪感。", "like": "像穿上球队队服，球队的名声也成了你的一部分。"},
    {"term": "Authenticity", "zh": "真实性", "def": "Stakeholders' judgement of whether a firm's responsible actions are genuine, sincere and consistent with long-term practice.", "defZh": "像验证实机画面而不是只信预告片；内外不一致会削弱 CSR 可信度。", "one": "利益相关者判断企业的责任行动是不是真心、和长期做法一不一致。", "eg": "公司高调资助社区，却忽视员工安全和公平晋升，员工就会怀疑它只是在做形象。", "like": "像看游戏的实机画面，而不是只信宣传预告片。"},
    {"term": "HIHRS (High-investment HR systems)", "zh": "高投入人力资源系统", "def": "Career development, promotion, health and safety and employee involvement showing the firm genuinely invests in its people.", "defZh": "Ong, Kim & Koopman (2024)：HIHRS 加强 External CSR → Authenticity → Attractiveness 路径。", "one": "在职业发展、晋升、安全和员工参与上真投入，证明企业真的重视自己人。", "eg": "企业资助社区项目的同时，也给员工培训机会和安全的工作环境，对外的 CSR 就更可信。", "like": "像店家对外送礼之前先照顾好自家员工，别人才信他是真心的。"}
  ],

    {"q": "Individualism and collectivism describe general tendencies in contexts, not personality traits determined by nationality.", "a": true, "exp": "这两个词说的是情境中的一般倾向，不是由国籍决定的人格特质。"},

    {"q": "Shareholders are one type of stakeholder.", "a": true, "exp": "利益相关者包括股东，也包括员工、顾客、供应商和社区，股东只是其中一类。"},

    {"q": "In the classroom experiment, the self-transcendence coefficient of 0.34 means job interest increased by 34%.", "a": false, "exp": "0.34 是标准化系数，不是「提高了 34%」，不能当成百分比来读。"},
    {"q": "Holding a B Corp certification means a firm's ethical behaviour no longer needs to be checked.", "a": false, "exp": "B Corp 只是外部问责的一种例子，拿到认证不代表公司的伦理行为从此免检。"},
    {"q": "According to Ong, Kim and Koopman (2024), weak internal investment in employees can reduce the credibility of external CSR.", "a": true, "exp": "对内投入是对外 CSR 的可信度检验，帮助外人补偿不了忽视自己人。"},
    {"q": "When managing stakeholder trade-offs, the most powerful stakeholder should automatically be prioritised.", "a": false, "exp": "排序要看紧迫性、正当性和弱势程度，不是谁权力大谁优先，也不是人多就赢。"},
    {"q": "The practical approach asks whether a decision could be openly justified to employees, peers and the public.", "a": true, "exp": "实践视角问的就是能不能公开辩护；但大家都赞同，不代表一定道德。"},
    {"q": "CSR automatically produces meaningfulness, pride, commitment and lower turnover among all employees.", "a": false, "exp": "这些只是 CSR 可能带来的结果，会不会发生要看质量、情境和真实性，不是自动的。"}

  "essay": [
    {"q": "Case: A university is debating whether to introduce an affirmative action policy in admissions and staff recruitment. Supporters argue it will improve representation and compensate for unequal opportunities. Opponents argue that applicants should all be judged by exactly the same procedure, and that some applicants' rights may be affected. Is the policy moral and fair? Analyse it using at least two ethical perspectives from this week, explain which perspective you find most persuasive, and suggest safeguards.",
     "points": ["Take a clear position and justify it", "Apply the utilitarian approach: compare gains in opportunity/representation with possible costs", "Apply moral rights: consider the rights of all applicants", "Apply justice: distinguish distributive (outcomes) from procedural (process) fairness; neither same process nor balanced outcome alone proves fairness", "Use the practical approach: can the policy be explained to admitted and rejected applicants?", "Acknowledge the opposing fairness concern and propose safeguards (job-related criteria, transparent reasons for adjustments, review)"],
     "model": "I support a carefully designed affirmative action policy, and I find the justice perspective most persuasive. From a utilitarian view, the policy may produce wider benefits through greater opportunity and representation, but these must be weighed against the costs to applicants who are not selected. The moral rights view reminds us that every applicant's rights, including non-discrimination and due process, deserve serious consideration, and that rights can conflict. The justice perspective is most useful because it separates distributive justice (what outcomes people receive) from procedural justice (how decisions are made). As the hiring-fairness scenarios in the lecture show, a uniform procedure can still produce outcomes lacking diversity, while an adjusted process may produce balanced outcomes but raise new procedural questions. Neither 'the same process' nor 'balanced results' alone proves fairness. Therefore the university should identify where opportunity gaps arise, keep criteria job- or study-related, and transparently explain why any adjustment is made. Using the practical approach, the reasons should be able to be explained openly to both admitted and rejected applicants. Finally, following the Review step of the ethical decision process, the university should monitor outcomes and complaints and adjust the policy if new unfairness emerges."},
    {"q": "Case: A student start-up plans to place a stationery vending machine at the entrances of the library and a teaching building. The founders' main goal is to maximise returns for the students who invested. They plan to choose the cheapest supplier, have volunteers restock late at night without clear rosters, and use heavy single-use packaging. Using stakeholder thinking, CSR and the triple bottom line, evaluate the plan and recommend how the founders should set priorities.",
     "points": ["Identify stakeholders: student customers, staff/restockers, campus site managers, suppliers, community/environment, investors", "Explain that shareholders are only one stakeholder; CSR includes core operations", "Apply the triple bottom line (people, planet, profit) to the weaknesses in the plan", "Discuss stakeholder trade-offs: prioritise by urgency, legitimacy and vulnerability, not just power", "Recommend concrete actions: clear pricing and refunds, safe rosters, site permission, fair supplier terms, less packaging, transparent reporting", "Note internal-external consistency: claims of supporting students require fair treatment of staff"],
     "model": "The plan takes a narrow shareholder view, whereas the stakeholder view recognises everyone who can affect or is materially affected by the business, with investors being only one group. Student customers need convenient, reliable and clearly priced products with a refund process. Restockers need safety, clear rosters and fair treatment; relying on unscheduled late-night work ignores internal responsibility. Campus site managers need the machine not to block paths and need clear contacts, so permission is a precondition. Suppliers deserve fair terms, and choosing only the cheapest option may harm quality and supply stability. Heavy single-use packaging shifts costs to the environment. Under the triple bottom line, the plan focuses on profit while neglecting people and planet, which threatens sustainability: value created today should not undermine the systems the venture relies on tomorrow. When trade-offs arise, the founders should rank stakeholders by urgency, legitimacy and vulnerability rather than power, look for shared gains, and explain their reasons openly. I recommend: obtaining site approval; setting safe, clearly costed rosters; selecting reliable suppliers with agreed restocking cycles; reducing packaging and checking energy use; and reporting purchases, maintenance and income transparently to investors. Returns remain necessary, but they should not cross these responsibility baselines. This also keeps any claim of 'supporting students' authentic."},
    {"q": "Case: A retail company launches a widely advertised environmental campaign and sponsors local community events. Internal surveys show employees feel cynical: promotion decisions are unclear, safety complaints are slow to be addressed, and little is spent on training. Recruitment results have not improved despite the campaign. Using concepts from this week, explain why the CSR campaign has not attracted applicants or engaged employees, and recommend what management should do.",
     "points": ["Explain value signalling and self-transcendence: CSR can signal concern for others and nature", "Explain the social identity chain from CSR to job interest and employee outcomes", "Identify the internal-external inconsistency and the authenticity problem", "Use Ong, Kim and Koopman (2024): External CSR → Authenticity → Attractiveness, strengthened by HIHRS", "Recommend investment in internal practices (fair promotion, safety, development, voice) and sustained, substantive action", "Note CSR effects are possible, not automatic"],
     "model": "CSR can work through value signalling: when people see a firm protect the environment and support communities, they infer self-transcendence values. Through social identity, applicants who share these values may expect positive distinctiveness and self-esteem from membership, which raises job interest, and current employees may feel meaning, pride, identification and commitment. However, these effects depend on whether the signal is believed. Here, there is a clear internal-external inconsistency: the company spends on external causes while promotion procedures are unclear, safety concerns are ignored and training is minimal. Ong, Kim and Koopman (2024) show that external CSR increases attractiveness through perceived authenticity, and that high-investment HR systems strengthen this path. When internal investment is weak, stakeholders may see the campaign as image management, so its positive signal weakens or loses credibility. Helping outsiders cannot compensate for neglecting insiders. Management should therefore build HIHRS: transparent, consistent promotion criteria (procedural justice), fast responses to safety complaints, real development opportunities and channels for employee voice. The environmental work should be sustained over time and embedded in core operations rather than limited to campaigns. Management should also remember that CSR outcomes are possible rather than automatic, and should review employee attitudes and recruitment results to check whether credibility is improving."}
  ]
},
{
  "week": 8,
  "title": "Communication in Organisations",
  "titleZh": "组织沟通",
  "summary": [
    "管理者通过沟通 coordinate、direct、influence、learn；有效沟通 = 信息 + 足够的共同理解（shared meaning）→ 适当行动",
    "发送 ≠ 收到 ≠ 理解 ≠ 同意；共同理解不要求所有人想法相同",
    "Shannon–Weaver (1949)：source → transmitter → channel → receiver → destination，noise 干扰；是线性传输模型，不能单独解释互动反馈",
    "Encoding（发送者把想法变消息）vs Decoding（接收者依背景解释）；噪声分 Physical、Semantic、Psychological、Organisational 四类",
    "反馈：让对方用自己的话说出任务、标准、期限，「懂了吗」不够；Sensemaking (Weick, 1995)：cue → interpret → act → update",
    "7%/38%/55% (Mehrabian) 不能当所有沟通的通用比例，只适用于态度/情感线索与不一致消息",
    "方向：Downward（过载、失真）、Upward（恐惧、过滤、沉默）、Horizontal（部门孤岛）；正式 ≠ 向下，非正式 ≠ 谣言",
    "网络：Chain、Wheel、All-channel；集中式适合简单任务，分散式适合复杂任务（Bavelas 1950, Leavitt 1951），结构要 fit the task",
    "Media Richness Theory (Daft & Lengel)：快速反馈、多种线索、个人化、自然语言；越模糊越需要丰富渠道；richness ≠ 字数或技术新旧",
    "Channel Expansion Theory (Carlson & Zmud, 1999)：对渠道、主题、组织、沟通伙伴的经验使同一媒介感觉更丰富",
    "社交媒体可供性 (Treem & Leonardi, 2013)：Visibility、Persistence、Editability、Association；affordance 是可能性，不是必然结果",
    "高/低语境 (Hall, 1976) 是框架不是国籍标签；Age / Period / Cohort 效应难分离；Ravid 等 (2025) 元分析：系统且有意义的世代差异很少",
    "失败环节：编码、注意、解释、行动；障碍：知觉选择、模糊与术语、过载 (Marlow 2018)、过滤与 MUM 效应 (Rosen & Tesser 1970)、员工沉默",
    "Voice 两问：Is it safe to speak up? Will it make a difference?（Morrison）；Kluger (2024) 倾听 r = .39（相关不是 39%）；Edmondson (1999) 51 个团队，心理安全与学习行为相关"
  ],
  "concepts": [
    {"term": "Shared meaning", "zh": "共同理解", "def": "Receivers understand enough of the intended meaning to take appropriate action.", "defZh": "信息 → 解释 → 共同理解 → 行动；经理要检查后两步。", "one": "接收者理解了足够的本意并能据此正确行动，而不只是收到了消息。", "eg": "经理说「今天优先处理投诉」，员工却理解成暂停所有销售，消息到了但共同理解没形成。", "like": "像传球不只要把球传到对方脚下，还要他知道该往哪儿踢。"},
    {"term": "Shannon–Weaver model", "zh": "香农–韦弗模型", "def": "A classic linear model: information source, transmitter, channel, receiver and destination, with noise interfering in transmission.", "defZh": "最初关注信号传输，不能单独解释职场互动反馈和意义协商。", "one": "经典线性模型：信息从信源经发射器和渠道传到接收端，途中可能被噪声干扰。", "eg": "电台播报天气时，电流杂音盖住了「暴雨」两个字，收音机这头就漏掉了关键内容。", "like": "像单向的传送带，只管把货送到，不管对方看不看得懂。"},
    {"term": "Encoding / Decoding", "zh": "编码 / 解码", "def": "Encoding is the sender turning ideas into words, symbols or behaviour; decoding is the receiver interpreting the message based on their background.", "defZh": "错误可能发生在任一端。", "one": "发送者把想法变成话语或符号叫编码，接收者按自己的背景去理解叫解码。", "eg": "主管说「把报告写得更战略一点」，新员工理解成多加行业背景，两人朝不同方向做。", "like": "像出谜语和猜谜语，谜面怎么写、怎么猜，两头都可能出错。"},
    {"term": "Noise", "zh": "噪声", "def": "Anything that interferes with transmitting or understanding a message: physical, semantic, psychological or organisational.", "defZh": "物理（声音、技术故障）、语义（术语、模糊词）、心理（压力、预设）、组织（层级、部门隔阂、过载）。", "one": "任何干扰信息传递或理解的东西，分物理、语义、心理和组织四类。", "eg": "「周五完成」在网络不好的会议里听不清，各部门标准又不一样，这些都是噪声。", "like": "像打电话时的杂音、听不懂的方言和坏心情，都会让话听不明白。"},
    {"term": "Sensemaking", "zh": "意义建构", "def": "People form plausible interpretations from cues, act on them, and update their understanding with new information.", "defZh": "Weick (1995)；同一公告可被理解成机会、威胁或已定结论。", "one": "人们根据手头的线索形成一个说得通的解释并行动，再用新信息不断修正。", "eg": "公司宣布要「更敏捷」，有人想到试新方法，有人担心裁员，经理补充说明后大家才更新理解。", "like": "像在雾中开车，先凭看到的路标判断方向，越开越清楚再调整。"},
    {"term": "Downward / Upward / Horizontal communication", "zh": "向下 / 向上 / 横向沟通", "def": "Downward: goals and instructions to lower levels; upward: progress, problems and bad news to management; horizontal: coordination among peers and functions.", "defZh": "风险分别是过载失真、过滤沉默、部门孤岛。", "one": "向下是传目标和指令，向上是报进度和坏消息，横向是同级和部门之间协调。", "eg": "店长布置先处理退货是向下，员工报告排班漏洞是向上，营销部找运营部确认库存是横向。", "like": "像大楼的电梯和走廊：上下楼传指令和问题，走廊连通隔壁。"},
    {"term": "Formal vs informal communication", "zh": "正式与非正式沟通", "def": "Formal communication is deliberately designed by the organisation; informal communication emerges from relationships and daily interaction.", "defZh": "正式不等于只能向下，非正式不等于全是谣言。", "one": "正式沟通由组织有意设计，非正式沟通从人际关系和日常互动中自然形成。", "eg": "公司用官方邮件公布办公室调整，同事午休时聊各自的理解，这些闲聊会影响大家怎么看那封邮件。", "like": "像学校的正式课表和课间走廊里的闲聊，两条线都在传信息。"},
    {"term": "Chain / Wheel / All-channel network", "zh": "链式 / 轮式 / 全通道网络", "def": "Chain links people in sequence; wheel routes information through one central member; all-channel gives members many direct connections.", "defZh": "轮式快速集中但中心可能过载；全通道适合复杂、创造性、相互依赖工作。", "one": "链式按顺序一个传一个，轮式都经过一个中心，全通道是成员彼此直接相连。", "eg": "项目组所有问题都先交给协调员再转告别人，这是轮式；协调员忙不过来，信息就堵在中心。", "like": "像传话游戏、自行车轮的辐条和圆桌讨论这三种连法。"},
    {"term": "Media Richness Theory", "zh": "媒介丰富度理论", "def": "Channels differ in their capacity to reduce ambiguity, based on rapid feedback, multiple cues, personalisation and natural language.", "defZh": "Daft & Lengel；连续线：报告 → 邮件 → 聊天 → 电话 → 视频 → 面对面，但不是绝对排名。", "one": "渠道减少歧义的能力不同，信息越模糊，越需要反馈快、线索多的丰富渠道。", "eg": "员工把重组公告理解成要被裁了，经理安排视频问答当面澄清，而不是再转发一遍文字。", "like": "像解释一场复杂的误会，当面聊比发短信更容易说清楚。"},
    {"term": "Channel Expansion Theory", "zh": "渠道扩展理论", "def": "Perceived richness depends on experience with the channel, topic, organisational context and communication partner.", "defZh": "Carlson & Zmud (1999)；不是增加软件功能。", "one": "一个渠道感觉有多丰富，还取决于你对这个渠道、话题、组织和对方有多熟。", "eg": "同一个项目群里，老成员看到一句缩写就能动手，新成员却需要别人额外解释。", "like": "像老朋友之间发一个表情包就懂，陌生人却得说一大段。"},
    {"term": "Social media affordances", "zh": "社交媒体可供性", "def": "Visibility, persistence, editability and association: action possibilities that technology enables.", "defZh": "Treem & Leonardi (2013)；可能也被用于印象管理或监视。", "one": "可见、持久、可编辑、可关联四种特性，让信息更容易被看见、留存和连接。", "eg": "公司知识平台公开技术讨论、保留旧答案、可以修改还能找到贡献者，新人顺着线索就能求助。", "like": "像公共留言墙：人人能看、一直留着、能补充，还找得到作者。"},
    {"term": "High-context / Low-context communication", "zh": "高语境 / 低语境沟通", "def": "High-context relies more on relationships, shared background and nonverbal cues; low-context states meaning more explicitly in words.", "defZh": "Hall (1976)；Kittler 等 (2011) 指出国家排名缺乏严格经验支持。", "one": "高语境靠关系、共同背景和非言语线索传意，低语境把意思直接写在字面上。", "eg": "经理说「报告还有提升空间」可能被当成随口建议，补一句「周五三点前改好第二节」就清楚了。", "like": "像老夫妻一个眼神就懂，和新同事则得把话说全。"},
    {"term": "Age / Period / Cohort effects", "zh": "年龄 / 时期 / 出生群体效应", "def": "Age effects come from life or career stage; period effects from events affecting many people at once; cohort effects from a birth group's historical background.", "defZh": "三者交织难以分离；Rudolph 等 (2021)。", "one": "年龄效应看人生阶段，时期效应看大家同时经历的事，群体效应看出生年代。", "eg": "疫情后各个年龄层都开始用视频开会，这主要是时期效应，不能说成是 Gen Z 的特征。", "like": "像猜人为何穿厚外套：年纪大、今天冷，还是那代人的习惯？"},
    {"term": "Communication overload", "zh": "信息过载", "def": "Too many, repeated or low-value messages and meetings scatter attention and hide priorities.", "defZh": "Marlow 等 (2018)；质量比数量更重要。", "one": "消息和会议太多太杂，注意力被打散，真正重要的事反而被淹没。", "eg": "主管在邮件、群聊和会议里发了十几条提醒，员工反而漏掉了唯一紧急的截止日期。", "like": "像一屋子闹钟同时响，反而找不到真正叫你起床的那一个。"},
    {"term": "Filtering", "zh": "信息过滤", "def": "Selecting, softening or changing information passed upward.", "defZh": "和知觉选择不同：过滤改变传给别人的内容。", "one": "往上传话时有选择地删减、弱化或改写内容，上级听到的版本就变了样。", "eg": "员工说「期限做不到」，中层转成「可能稍有延误」，高层听到的是「基本按计划推进」。", "like": "像坏消息一层层加糖，传到最上面已经尝不出原味了。"},
    {"term": "MUM effect", "zh": "MUM 效应（坏消息回避）", "def": "Reluctance to transmit unpleasant news.", "defZh": "Rosen & Tesser (1970)。", "one": "人们不愿意传递让人不舒服的消息，所以坏消息常常被拖着或憋着不说。", "eg": "团队早就知道客户的期限做不到却不上报，拖到截止前两天才告诉客户会延误。", "like": "像孩子考砸了，迟迟不敢把试卷拿给父母签字。"},
    {"term": "Employee voice / silence", "zh": "员工发声 / 沉默", "def": "Voice is proactively raising ideas or concerns to improve work; silence is withholding useful information.", "defZh": "Morrison (2014, 2023)；沉默不等于赞同。", "one": "发声是主动提意见或担忧，沉默是明知有用信息却不说，但不等于同意。", "eg": "员工发现流程会让客户重复付款，但怕被责怪、觉得说了也没用，就选择不提。", "like": "像乘客发现车门没关好，喊不喊得看司机会不会骂人。"},
    {"term": "Open communication climate", "zh": "开放沟通氛围", "def": "A climate where relevant information reaches those who need it, built through accessibility, candour and responsiveness.", "defZh": "不是公开每场谈话。", "one": "让相关信息能到达需要它的人，靠容易接近、坦诚和认真回应来建立。", "eg": "主管说「随时来找我」却每次都打断坏消息，没人敢说；认真听完风险并跟进，门才真的开着。", "like": "像一扇门不只要开着，进去的人还不能被骂出来。"},
    {"term": "Active listening", "zh": "积极倾听", "def": "Attending carefully, clarifying and paraphrasing to confirm meaning, then responding so the other person feels understood.", "defZh": "先注意，再澄清复述，最后回应；不急着评价。", "one": "专心听，用提问和复述确认自己理解对了，再回应，让对方觉得被理解。", "eg": "员工抱怨预算要求，经理先复述一遍：「你担心的是数据没法验证，不是目标太高，对吗？」", "like": "像服务员把你点的菜复述一遍，确认没听错再下单。"},
    {"term": "Team psychological safety", "zh": "团队心理安全", "def": "A shared belief that the team is safe for interpersonal risk-taking such as asking questions, admitting mistakes or disagreeing.", "defZh": "Edmondson (1999)，51 个团队；不等于永远同意或无需承担责任。", "one": "团队成员共同相信，在这里提问、认错、提出不同意见都不会被羞辱或惩罚。", "eg": "飞行员发现仪表异常能马上说出来而不怕被羞辱，团队就更可能及时学习和纠错。", "like": "像一个允许答错的课堂，大家才敢举手。"}
  ],
  "tf": [
    {"q": "If a message has been sent and received, effective communication has occurred.", "a": false, "exp": "发出、收到、理解、同意是四件不同的事，有效沟通要形成共同理解并带来合适的行动。"},
    {"q": "The Shannon–Weaver model is a linear transmission model that cannot by itself explain interactive feedback and negotiation of meaning at work.", "a": true, "exp": "它是一个线性的传输模型，最初关心的是信号怎么传，所以解释不了职场里的互动和反馈。"},
    {"q": "According to the lecture, the 7%/38%/55% rule shows that 93% of all communication is nonverbal.", "a": false, "exp": "那个实验只涉及态度和情感线索，以及不一致的消息，不能推广成所有沟通的比例。"},
    {"q": "Formal communication can carry upward and horizontal information, not only downward instructions.", "a": true, "exp": "正式沟通不等于只能向下传指令，正式渠道同样可以向上报告和横向协调。"},
    {"q": "Classic network studies (Bavelas, Leavitt) suggest centralised networks handle simple problems efficiently, while decentralised networks suit complex problems better.", "a": true, "exp": "集中式网络处理简单任务效率高，分散式更适合复杂任务，关键是结构要和任务匹配。"},
    {"q": "Media richness refers to the length of a message or the newness of the technology used.", "a": false, "exp": "丰富度看的是渠道减少歧义的能力，比如反馈快不快、线索多不多，和字数、技术新旧无关。"},
    {"q": "Channel Expansion Theory suggests that the same chat tool can feel richer to experienced team members than to newcomers.", "a": true, "exp": "对渠道、话题、组织和对方越熟悉，同一个工具就感觉越丰富，老成员自然比新人觉得更好用。"},
    {"q": "Social media affordances guarantee that knowledge sharing will improve once a platform is installed.", "a": false, "exp": "可供性只是提供了行动的可能，不保证结果；如果大家怕公开提问或频道被淹没，收益就会下降。"},
    {"q": "High-context and low-context communication should not be used to predict each individual's style from their nationality.", "a": true, "exp": "高低语境是帮你留意差异的框架，不是固定的国籍标签，不能拿来预测某个人的风格。"},

  "essay": [
    {"q": "Case: A project team believes a client deadline is unrealistic. The team leader instructs members to 'stay positive' and avoid escalating issues until they have a solution. Routine updates to senior managers report that the project is on track. Two days before the deadline, the client is told there will be a delay, damaging the relationship. Using concepts from this week, diagnose what went wrong and recommend how communication should be improved.",
     "points": ["Identify blocked upward communication, filtering and the MUM effect", "Explain employee silence using the two voice questions: safe to speak up? will it make a difference?", "Explain that routine updates lacked feedback checks on deadline and risk", "Recommend an open communication climate: accessibility, candour, responsiveness; do not punish messengers", "Recommend specific practices: risk-focused updates, interactive risk discussion plus written record, closing the loop", "Suggest how to verify improvement, e.g. leaders restating risks and decisions needed"],
     "model": "The core problem was blocked upward communication. The real risk never entered routine updates, so senior managers made judgements based on incomplete information. Two mechanisms explain this. First, filtering and the MUM effect: people are reluctant to transmit unpleasant news, and each layer softened the message until 'impossible' became 'on track'. Second, employee silence: the instruction to 'stay positive' and to escalate only with a solution raised the cost of speaking up. Using Morrison's two questions, staff likely felt it was neither safe nor useful to raise concerns. Routine updates also reported surface progress without any feedback check on deadline risk. To fix this, the manager should immediately verify the risk and tell the client and leaders what is known and what is uncertain. Updates should explicitly list deadline gaps, risks, impacts and decisions required. Because risk is ambiguous, a rich, interactive discussion where leaders can ask questions should be held, followed by a written record. Leaders should build an open climate through accessibility, candour and responsiveness: invite concerns before asking for agreement, respond constructively to bad news, never punish the messenger, and close the loop by reporting owners, actions and the next update time. Improvement can be checked by asking senior managers to restate current risks and by rewarding accurate, timely risk reports rather than good news alone."},
    {"q": "Case: A multinational firm is announcing a major restructuring to 600 employees across three countries. The HR director plans to send one long email full of internal acronyms on a Friday evening. A manager also suggests putting older staff on email-only updates and younger staff on chat-only updates because 'that is what each generation prefers'. Evaluate the plan using this week's concepts and propose a better communication approach.",
     "points": ["Apply Media Richness Theory: an ambiguous, sensitive message needs richer, interactive channels", "Identify semantic noise from acronyms and psychological noise from anxiety; sensemaking risks", "Recommend combining channels: written statement for reach and persistence plus interactive Q&A", "Apply cross-cultural guidance: clarify expectations, check meaning, avoid idioms and acronyms; do not stereotype by nationality", "Critique generational stereotyping using age/period/cohort and Ravid et al. (2025); ask individual preferences", "Include feedback checks and ongoing updates"],
     "model": "A major restructuring is ambiguous and sensitive, so a single long email is a poor fit. Media Richness Theory suggests that ambiguous messages need channels with rapid feedback, multiple cues and personalisation. Employees will engage in sensemaking: some may interpret the change as a threat, and anxiety creates psychological noise, while internal acronyms add semantic noise, especially across countries. A Friday-evening email also leaves people to fill the gaps over the weekend. A better approach combines channels. A clear written statement provides reach and a persistent reference, followed by interactive meetings or video Q&A where managers explain what is decided, what is not yet known and the next steps. Managers should check understanding by inviting employees to describe what the change means for their own roles. Across cultures, managers should state key expectations clearly, avoid idioms, jokes and acronyms, and remain curious rather than assuming any individual's style from high- or low-context national labels. The generational plan is stereotyping. Differences in channel use may reflect age, period or cohort effects, which are hard to separate, and Ravid et al.'s (2025) meta-analysis found few systematic and meaningful generational differences in work outcomes. Managers should instead ask individuals about their preferences and agree on consistent confirmation rules for urgent messages. Ongoing updates should follow."},
    {"q": "Case: A hospital unit has a suggestion box and an 'open door' policy, yet junior nurses rarely report near-miss medication errors. When one nurse raised a concern last year, the senior nurse said she should 'stop complaining' and nothing changed. Using concepts from this week, explain why reporting is low and what the unit manager should do.",
     "points": ["Explain voice versus silence and that silence does not mean agreement", "Apply the two voice questions: safety and efficacy", "Explain team psychological safety (Edmondson, 1999) and its limits (association, not universal causation)", "Note a suggestion box only provides an entry point, not safety or responsiveness", "Recommend managerial practices: invite concerns, respond constructively, do not punish the messenger, separate issue from person, follow up", "Recommend active listening and appropriate question types"],
     "model": "The low reporting reflects employee silence: nurses are withholding useful information about near-misses. Silence is not agreement and not simply being quiet. According to Morrison, employees ask whether it is safe to speak up and whether speaking up will make a difference. Here both answers appear to be no: the earlier concern was dismissed as complaining, and nothing changed. A suggestion box and an 'open door' only provide an entry point; they cannot create safety or responsiveness on their own. The unit lacks team psychological safety, the shared belief that asking questions, admitting mistakes and raising problems are safe. Edmondson's (1999) study of 51 teams found psychological safety was associated with team learning behaviour, although this is a correlation rather than a universal law. Psychological safety does not mean removing accountability; it means making it safe to raise risks. The manager should actively invite concerns before asking for agreement, respond constructively to bad news, separate the issue from the person, never punish the messenger, and admit uncertainty or mistakes. Using active listening and open, clarifying and reflective questions, the manager can understand each report. Crucially, the manager should close the loop by explaining what was changed or why not. Over time this shows staff that speaking up is both safe and useful."}
  ]

    {"term": "Rational decision making", "zh": "理性决策", "def": "Defining the problem and criteria, weighting them, developing and evaluating alternatives systematically, and selecting the best fit.", "defZh": "依赖足够信息；选择后还要实施与复核。", "one": "先定好问题和标准并加权，再用同一套标准比较各方案，选最合适的。", "eg": "买车时按价格、油耗、安全、舒适度和设计给三款车打分，再比较后选择。", "like": "像比赛先定好统一的评分规则，再给每位选手打分。"},
    {"term": "Bounded rationality", "zh": "有限理性", "def": "Simplifying complex problems and searching only a manageable subset of options because of limits on information, ability, time and resources.", "defZh": "Simon (1955)；不等于不理性或随意。", "one": "因为信息、能力、时间和资源都有限，人们只能简化问题，只看一部分方案。", "eg": "手机坏了急着换，你没法研究所有型号，只看几款熟悉的品牌和靠谱的推荐。", "like": "像限时考试里，只能先挑几道有把握的题来做。"},
    {"term": "Satisficing vs optimising", "zh": "满意化 vs 最优化", "def": "Satisficing stops the search when an option meets minimum acceptable standards; optimising seeks the best of all possible options.", "defZh": "good enough 仍要满足明确标准；满意化不保证全局最佳。", "one": "满意化是找到一个够格的方案就停下，最优化是要在所有方案里挑出最好的。", "eg": "买手机时预算内、性能够用就下单是满意化，把所有型号比完再选是最优化。", "like": "像找餐厅：第一家不错就进是满意化，逛完整条街再定是最优化。"},
    {"term": "Intuitive decision making", "zh": "直觉决策", "def": "Fast judgement drawing on patterns learned through experience, with little conscious deliberation.", "defZh": "强烈感觉本身不是证据；可先用直觉提出备选，再用标准检验。", "one": "不逐项推敲，而是快速调用经验里学到的模式来作判断。", "eg": "熟悉设备的主管一听到异常的声音，就想到某种常见故障，先提出该检查哪里。", "like": "像老司机一听发动机的声音，就知道哪儿可能出了毛病。"},
    {"term": "Heuristic", "zh": "启发式", "def": "A mental shortcut that speeds judgement under uncertainty but may substitute an easier question for the real one.", "defZh": "Tversky & Kahneman (1974)；并非每次都错。", "one": "不确定时加快判断的心理捷径，省力，但可能把问题偷换成更容易的那个。", "eg": "经理赶时间筛项目，不知不觉把「哪个更熟悉」当成了「哪个最值得投入」。", "like": "像抄熟悉的近路，通常省时间，偶尔会走错方向。"},
    {"term": "Representativeness heuristic", "zh": "代表性启发式", "def": "Judging likelihood by how much a person or situation resembles a typical prototype.", "defZh": "外表像理想教师 ≠ 能力证据。", "one": "按一个人或情况像不像心里的典型形象来判断可能性，把相似当成了证据。", "eg": "两位辅导员候选人资历差不多，只因为一位外表更像理想中的老师就选了他。", "like": "像以为穿白大褂的就一定是好医生。"},
    {"term": "Availability heuristic", "zh": "可得性启发式", "def": "Judging frequency, probability or risk by how easily examples come to mind.", "defZh": "警察 vs 伐木风险；鲜明 ≠ 常见。", "one": "按例子有多容易想起来判断频率或风险，把印象深刻误当成经常发生。", "eg": "警察遇险的场面常上新闻和影视，人们就觉得警察比伐木工危险，却没查过职业风险数据。", "like": "像刚看完空难新闻，就觉得坐飞机比开车更危险。"},
    {"term": "Anchoring", "zh": "锚定", "def": "Over-relying on initial information and adjusting insufficiently in light of later evidence.", "defZh": "转盘 10 / 65 估计非洲国家在联合国比例；也有社会锚：第一印象、会议中第一个意见。", "one": "过度依赖最先得到的信息，后来即使有新证据也调整得不够。", "eg": "转盘停在 10 或 65 后再估非洲国家在联合国的比例，低锚组估得低，高锚组估得高。", "like": "像砍价时商家先报一个高价，你怎么砍都离那个数不远。"},
    {"term": "Conformity", "zh": "从众", "def": "Using others' behaviour or opinions as a reference for what is correct or appropriate, or following the group to be accepted.", "defZh": "三种驱动：information、belonging、norms。", "one": "把别人的做法或意见当成正确的参照，或者为了被接纳而跟着群体走。", "eg": "Asch 的线段实验里，几位同谋一致说错答案后，参与者在答案很明显时也可能跟着说错。", "like": "像在陌生餐厅先看别人怎么排队，但别人也可能排错。"},
    {"term": "Need to belong", "zh": "归属需要", "def": "People want to form and maintain meaningful connections, so they attend to social cues and may adjust to gain acceptance.", "defZh": "Baumeister & Leary (1995)。", "one": "人想建立并维持有意义的关系，所以会留意社交线索，并调整自己来被接纳。", "eg": "新成员想融入团队，会留意大家的语气和习惯，证据不够时也顺着多数人的意见。", "like": "像转学生第一天，会悄悄观察同学怎么说话做事再跟着学。"},
    {"term": "Chameleon effect (mimicry)", "zh": "变色龙效应（模仿）", "def": "Unconsciously imitating an interaction partner's behaviour, which can build social connection.", "defZh": "Chartrand & Bargh (1999)；动作趋同 ≠ 观点赞同。", "one": "互动时不自觉地模仿对方的动作姿态，能拉近关系，但不代表赞同他的观点。", "eg": "同事聊天时一个人靠向桌面，另一个也不知不觉换了坐姿，但不一定同意对方的结论。", "like": "像变色龙随环境变色，只是外表跟着变，想法并没有变。"}
  ],

  "essay": [
    {"q": "Case: Steve, a warehouse employee, has arrived late five times in the past month. His manager, Lisa, tells HR that Steve is 'lazy and unmotivated' and wants to issue a formal warning. Other staff mention that a new bus timetable started this month, and Steve has always been punctual for weekend shifts. Using concepts from this week, evaluate Lisa's judgement and recommend how she should proceed.",
     "points": ["Distinguish observation (lateness) from inference (laziness)", "Identify internal vs external attribution", "Explain the fundamental attribution error (Ross, 1977)", "Apply 'diagnose before you label': describe, check context, seek evidence, choose a matching response", "Use the evidence in the case: bus timetable, other staff, weekend punctuality", "Note that avoiding FAE does not remove accountability; the response should match the most supported cause"],
     "model": "Lisa has treated an inference as if it were an observation. What she observed is that Steve arrived late five times; 'lazy and unmotivated' is an internal attribution placing the cause in his personality and motivation. She has not considered external attribution, such as transport or scheduling constraints. This is a likely case of the fundamental attribution error (Ross, 1977): overemphasising personal causes and underestimating situational influences when explaining others' behaviour. The case contains evidence pointing to the situation. A new bus timetable began this month, which may affect other staff, and Steve is punctual for weekend shifts, so the lateness may be concentrated on particular days rather than reflecting a stable trait. Following the lecture's four steps, Lisa should first describe the behaviour without labels, then check the context, then seek evidence across times and settings, and finally choose a response that matches the most likely cause. She could ask Steve directly using open questions, check whether colleagues on the same route are affected, and review the timing pattern. If transport is the cause, a matching response might be adjusting start times or shift allocation. If evidence later shows a personal problem, she can address it fairly. Avoiding the fundamental attribution error does not remove accountability; it ensures the action fits the evidence and protects the relationship and motivation."},
    {"q": "Case: An interview panel is choosing a new team manager. The panel chair opens by saying one candidate 'just doesn't look like a strong manager'. Another member recalls that the last candidate from a similar background failed badly. Within ten minutes everyone agrees to reject the candidate, although no one has reviewed her work samples. Identify the judgement biases and social influences that may be operating, and recommend how the panel should redesign its process.",
     "points": ["Representativeness: 'doesn't look like' a prototype", "Availability: one vivid recent failure", "Anchoring / social anchor: the chair's first opinion", "Conformity: information, belonging, norms; status of the chair; Asch-type pressure", "Caution: confirm mechanisms with evidence rather than labelling every bias", "Recommendations: independent ratings before discussion, job-related criteria applied consistently, ask for reasons and counter-evidence, debiasing steps"],
     "model": "Several mechanisms may be operating, although each should be confirmed with evidence rather than assumed. First, the chair's comment that the candidate 'doesn't look like a strong manager' suggests the representativeness heuristic: judging by resemblance to a prototype rather than job-related evidence. Second, recalling one vivid failure of a similar candidate reflects the availability heuristic; an easily remembered case is treated as if it indicated frequency or likelihood, and it may also involve generalising from a group to an individual. Third, the chair's opening remark may act as a social anchor: later discussion interprets the file around that starting point with insufficient adjustment. Fourth, the rapid unanimous agreement suggests conformity, driven by information (assuming others know something), belonging and norms, and amplified by the chair's status. As Asch's experiment shows, a unanimous group can pull individuals even when evidence is available. The panel should redesign its process. Members should independently score each candidate against agreed, weighted, job-related criteria before discussion. The chair should speak last. Discussion should require reasons and counter-evidence and should separate evidence from status. Using the debiasing discipline, the panel should name the judgement (ability to manage the team), identify any shortcut, look for base evidence such as work samples, and generate alternative explanations. Because this decision is important and uncertain, slowing down is justified."},
    {"q": "Case: A small business owner must choose a new software supplier within one afternoon. There are dozens of suppliers, information about long-term reliability is incomplete, and the owner is unfamiliar with this type of software. A friend advises: 'Just trust your gut.' Using decision-making concepts from this week, advise the owner on how to approach the decision.",
     "points": ["Explain the rational model and its six steps", "Identify limits to full rationality: incomplete information, cognitive limits, time, uncertainty", "Apply bounded rationality and satisficing (Simon) with clear minimum standards", "Evaluate intuition: unreliable in unfamiliar situations; strong feelings are not evidence", "Recommend combining approaches: shortlist, criteria and weights, satisfice, then implement and review", "Warn about heuristics such as anchoring on the first price or availability of vivid reviews"],
     "model": "A fully rational approach would define the problem, identify criteria, weight them, develop alternatives, evaluate each against the same criteria and select the best. However, the owner faces the classic limits to full rationality: incomplete information about reliability, cognitive limits in processing dozens of options, a one-afternoon time constraint and future uncertainty. Bounded rationality (Simon, 1955) explains why the owner should simplify the search rather than try to optimise across every supplier. The friend's advice to trust one's gut is risky here. Intuition is valuable when it draws on patterns learned through relevant experience, but the owner is unfamiliar with this software, so a strong feeling is not reliable evidence. I recommend combining approaches. First, define the problem precisely (what the software must do). Second, set a few clear criteria with weights, such as price, essential features, security and support, and specify minimum acceptable standards. Third, use a selective search: shortlist a small number of credible suppliers through trusted advice. Fourth, satisfice by choosing the first option that meets all minimum standards; good enough must still meet explicit criteria. The owner should also watch for heuristics, such as anchoring on the first quoted price or relying on one vivid review because it is available. Finally, the decision does not end at selection: the owner should implement the software, review whether it meets expectations, and adjust as new information arrives."}
  ]
