    "Leader emergence（谁被认可/选为领导）≠ leader effectiveness（实际成果、成员发展、公平与长期后果）；自信、可见度帮助涌现但不保证有效",
    "Born or made：特质较稳定，行为与技能可学习；Judge et al. (2002) Big Five 元分析——外向性正向关联最强，尽责性、开放性正向，宜人性较弱，神经质负向",
    "Trait approach 的局限：不直接解释行为、对涌现和有效性关系不同、不诊断情境、易被误读为领导无法培养；相关 ≠ 因果",
    "Behavioural approach：consideration（关系行为）与 initiating structure（任务行为）是两个独立维度，可同时高或同时低；Judge, Piccolo & Ilies (2004)：关怀↔满意度/动机/感知有效性，任务结构↔领导工作绩效与团队/组织绩效稍强",
    "Hersey–Blanchard：readiness = 针对具体任务的 ability（知识+技能）+ willingness（动机+信心）；R1→S1 Telling（高指导/较低支持）、R2→S2 Selling（高指导/高支持）、R3→S3 Participating（较低指导/高支持）、R4→S4 Delegating（较低指导/较低支持）",
    "R2 = 不会做但愿意；R3 = 会做但不愿/不自信——最易混淆；Delegating ≠ 撒手不管，须约定成果、期限、决策权限与汇报节点",
    "Thompson & Vecchio (2009)：情境领导模型只得到有限支持，修订版预测不如原版；处方是待验证的假设，不是唯一规定",
    "Fiedler：LPC 量表评价最不愿共事的同事；低 LPC = 任务导向，高 LPC = 关系导向；LPC 是相对稳定的动机取向，不是当前团队关系指标",
    "Situational favourability = leader–member relations + task structure + position power → 八情境 I–VIII；I–II 很有利、VII–VIII 很不利时任务导向较好，III–VI 中间时关系导向较好；I 职位权力强、II 弱",
    "Fiedler 的干预思路是改变情境（澄清授权、修复关系）或调整领导任用，而不是要求领导临时改变取向；授权不能替代信任修复",
    "五种当代方式：Level 5（Collins 2001，个人谦逊+专业意志）、Servant（支持成长但保留标准与问责）、Authentic（自我意识、平衡处理、关系透明、内化道德视角）、Transformational（四个 I）、Transactional（条件性奖励、主动/被动例外管理）",
    "Power = 不对称控制他人重视的资源与后果；Status = 他人给予的尊重与敬佩；两者可以分离；Galinsky et al. (2006)：权力条件下换位思考减少（额头写 E 任务）"
  ],
  "concepts": [
    {"term": "Leadership", "zh": "领导力", "def": "An interpersonal process of influence that motivates others to put in effort to achieve goals reflecting the values of the leader or organisation.", "defZh": "通过人际影响激励他人努力实现体现领导者或组织价值的目标；四要素：interpersonal process、influence、motivation、goals and values。", "one": "领导力就是通过影响和激励别人，一起去实现体现领导者或组织价值的目标。", "eg": "团队做客户报告时，负责人先讲清报告用来干什么，再商量分工，还帮有困难的同事。", "like": "像领队先说清目的地和路线，再带着大家一起走到终点。"},
    {"term": "Leader emergence", "zh": "领导涌现", "def": "Whether a person is recognised or selected as a leader.", "defZh": "谁被认可或选为领导；自信、可见度、外向性有助于涌现，但不保证有效。", "one": "领导涌现指的是谁被大家认可或选成了领导，被选上不等于带得好。", "eg": "小组讨论时最先自信发言的同学，很快就被大家推成了组长，至于带得好不好还不知道。", "like": "像先站上舞台的人先拿到聚光灯，演得好不好是另一回事。"},
    {"term": "Leader effectiveness", "zh": "领导有效性", "def": "How well a leader actually leads the team and what outcomes result.", "defZh": "看任务成果、成员发展、公平待遇和长期后果（信任、合作、伦理）。", "one": "领导有效性看的是实际带出了什么：任务成果、成员成长、公平和长期信任。", "eg": "组长不只是按时交了报告，还分工公平、肯听反对意见，组员也真的学到了东西。", "like": "像评价教练要看整季战绩和球员进步，而不是看他嗓门大不大。"},
    {"term": "Trait approach", "zh": "特质取向", "def": "Studies links between relatively stable personal characteristics and leader emergence or effectiveness.", "defZh": "Judge 等（2002）Big Five 元分析：外向性最强正向，尽责性、开放性正向，宜人性较弱，神经质负向；只是平均倾向，不是个人保证。", "one": "特质取向研究稳定的人格特点和当领导的关系，只说平均倾向，不保证某个人。", "eg": "Judge 等（2002）发现外向性和领导的关联最强，但外向的人不一定就能把团队带好。", "like": "像鲜艳的队服让球员更显眼，但球踢得好不好还要看场上。"},
    {"term": "Consideration", "zh": "关系关怀（关系行为）", "def": "Showing concern and respect for followers by listening, valuing their views and recognising contributions.", "defZh": "倾听、尊重、认可贡献和一致行动建立信任；与满意度、动机、感知有效性关联更强。倾听不等于取消标准。", "one": "关怀行为是关心和尊重下属：倾听意见、认可贡献、说到做到，以此建立信任。", "eg": "成员多次迟交，领导先问他遇到了什么困难、需要什么支持，同时也讲清下一步要负的责任。", "like": "像教练先了解队员伤情再安排训练，但比赛要求并不降低。"},
    {"term": "Initiating structure", "zh": "任务结构（任务行为）", "def": "Clarifying roles, priorities, standards and how progress will be checked.", "defZh": "明确职责、优先级、标准和检查方式；与领导工作绩效、团队/组织绩效关联稍强。与关怀是两个独立维度。", "one": "任务结构行为是把职责、优先级、标准和检查方式讲清楚，让大家知道怎么干。", "eg": "展示小组先定好研究问题、每人分工和整合的时间表，再按节点检查进度。", "like": "像乐队先排好每人的乐段、节拍和合练时间，才能合奏成曲。"},
    {"term": "Follower readiness", "zh": "追随者准备度", "def": "A follower's ability (knowledge and skill) and willingness (motivation and confidence) to perform a specific task.", "defZh": "针对具体任务，不是年龄、职称或资历的永久标签；同一人在不同任务上准备度可能不同。", "one": "准备度是员工做某项具体任务的能力和意愿，换一项任务就要重新判断。", "eg": "员工做常规财务报告很熟练，换到一个陌生的演示平台就既不会做也没把握。", "like": "像开了多年车的老司机，第一次开船照样是新手。"},
    {"term": "Telling (S1)", "zh": "指示型", "def": "High task direction, lower relationship support; matched to R1 (low ability, low willingness).", "defZh": "给出清楚具体指令、示范第一步、频繁检查；较低支持仍要尊重员工。", "one": "指示型针对不会做又没信心的人（R1）：给具体指令和示范，经常检查。", "eg": "新员工没用过报告系统，主管先示范第一步，给出明确的指令，再确认他真的听懂了。", "like": "像教小孩骑车：先扶着车把一步步示范，而不是说「自己骑吧」。"},
    {"term": "Selling (S2)", "zh": "解释型", "def": "High task direction and high relationship support; matched to R2 (low ability, high willingness).", "defZh": "解释做法与理由、鼓励学习、认可进展；selling 指 explaining，不是施压或对外销售。", "one": "解释型针对不会做但很想学的人（R2）：详细指导加鼓励，还解释为什么。", "eg": "热情的实习生想写好第一份客户报告，主管给范例、讲清每部分的目的，还夸他有进步。", "like": "像带热情的新学徒：边讲原理边手把手教，还常夸他进步了。"},
    {"term": "Participating (S3)", "zh": "参与型", "def": "Lower task direction, high relationship support; matched to R3 (high ability, low willingness/confidence).", "defZh": "讨论顾虑、探索选项、让员工参与计划；不必重教基础步骤。", "one": "参与型针对会做但没信心的人（R3）：少讲步骤，多听顾虑，请他一起规划。", "eg": "资深员工会写报告，但一次难缠的客户会后不愿牵头了，主管和他聊顾虑、问需要什么支持。", "like": "像对待状态低迷的老将：不用重教动作，而是陪他找回信心。"},
    {"term": "Delegating (S4)", "zh": "授权型", "def": "Lower task direction and lower relationship support; matched to R4 (high ability, high willingness).", "defZh": "约定成果、期限、决策权限，让员工选方法；领导仍可联系，问责清楚，不是撒手不管。", "one": "授权型针对又会做又愿做的人（R4）：约定成果、期限和权限，方法由他定。", "eg": "分析师多次成功完成类似任务，主管只约定交付物和截止日期，方法让他自定，按节点汇报。", "like": "像把车钥匙交给老司机：说好目的地和到达时间，路线他自己定。"},
    {"term": "LPC (Least Preferred Coworker) scale", "zh": "最不愿共事同事量表", "def": "Fiedler's measure in which a leader describes the coworker they worked least well with, identifying a relatively stable motivational orientation.", "defZh": "评价较负面 → 低 LPC → 任务导向；评价较正面 → 高 LPC → 关系导向；不是当前团队关系指标。", "one": "LPC 量表让领导评价最难合作的同事，由此判断他偏任务型还是关系型。", "eg": "一位领导对合作最不顺的同事仍评价得比较正面，这就是高 LPC，属于关系导向。", "like": "像看人怎么评价最难合作的队友：还能说出优点的更看重关系。"},
    {"term": "Situational favourability", "zh": "情境有利程度", "def": "The degree of control a leader has, determined by leader–member relations, task structure and position power.", "defZh": "三因素组合为八情境 I–VIII；两端（很有利/很不利）任务导向较好，中间关系导向较好。", "one": "情境有利程度指领导能掌控多少局面，看上下级关系、任务结构和职位权力。", "eg": "团队信任主管、任务也清楚，但调资源要逐项审批：关系和结构有利，职位权力却弱。", "like": "像开车顺不顺：乘客配不配合、路线清不清楚、方向盘在不在手里。"},
    {"term": "Position power", "zh": "职位权力", "def": "Formal authority over rewards, punishments, task assignment and related decisions.", "defZh": "Fiedler 三因素之一；关系好不等于权力强，加强授权也不会自动产生信任。", "one": "职位权力是职位本身带来的正式权力，比如能奖惩、派任务和调资源。", "eg": "项目协调员想调人手和预算，却要先经几个部门负责人批准，说明他的职位权力弱。", "like": "像手里有没有钥匙：有钥匙能开门，但不代表大家愿意跟你进门。"},
    {"term": "Level 5 leadership", "zh": "第五级领导", "def": "Collins' (2001) description of leaders who combine personal humility with professional will.", "defZh": "承认错误、分享功劳，又坚定推动长期成果；发展接班人与系统。五层图不是普遍职级排名。", "one": "第五级领导是个人谦逊加上专业意志：肯认错、让功劳，又坚定推动长期成果。", "eg": "新流程失败后，领导承认自己的假设不完整，把功劳归给找出问题的员工，再定目标持续跟进。", "like": "像肯认错改路线、却一定要把队伍带到终点的领队。"},
    {"term": "Servant leadership", "zh": "服务型领导", "def": "Prioritising followers' growth, capability and wellbeing while considering responsibilities to the organisation and wider community.", "defZh": "倾听、辅导、分享信息、移除障碍；仍保留标准与问责，不等于批准每项请求。", "one": "服务型领导把下属的成长和福祉放在优先位置，但工作标准和问责照样保留。", "eg": "好几个人想在同一班次休假，主管先听理由，说明服务不能停，再一起商量换班。", "like": "像为别人搭台阶帮他往上走，但台阶通向的方向不变。"},
    {"term": "Authentic leadership", "zh": "真实型领导", "def": "Leadership based on self-awareness, balanced processing, relational transparency and an internalised moral perspective.", "defZh": "行动与反思过的价值一致；真实不能为羞辱开脱，要看持续可观察的行为。", "one": "真实型领导看清自己、全面看证据、适度坦诚，行动和反思过的价值观一致。", "eg": "经理公开说自己方案的不足，请大家提反对证据，再按事先讲明的原则做决定。", "like": "像先照镜子看清自己，再按心里的指南针校准方向。"},
    {"term": "Transformational leadership", "zh": "变革型领导", "def": "Inspiring and developing followers toward a shared vision through idealised influence, inspirational motivation, intellectual stimulation and individualised consideration.", "defZh": "四个 I：榜样、鼓舞性动机、智力激发、个别化关怀；喊口号或自信本身不够。", "one": "变革型领导用共同愿景激励人，靠榜样、鼓舞、启发思考和个别关怀发展成员。", "eg": "改进服务时，主管讲清改变能帮到哪些顾客，鼓励员工质疑现有障碍，还按各人需要辅导。", "like": "像既指明远方目的地、又教每个人学会走路的向导。"},
    {"term": "Transactional leadership", "zh": "交易型领导", "def": "Clarifying performance expectations, linking achievement to rewards (contingent reward) and managing deviations (active/passive management by exception).", "defZh": "主动例外管理：持续监测并及时纠正；被动例外管理：问题出现后才介入。与变革型可互补，不是互斥的人。", "one": "交易型领导事先讲清绩效期望和回报，达标就兑现，出了偏差就介入纠正。", "eg": "经理事先和团队约定交付目标和认可方式，团队达标后就按约定兑现奖励。", "like": "像赛前讲清计分规则和奖金，按成绩发奖，有人犯规再吹哨。"},
    {"term": "Social power vs social status", "zh": "社会权力与社会地位", "def": "Power is asymmetric control over valued resources and outcomes; status is the respect and admiration others grant.", "defZh": "两者可分离：有职权仍可能缺少信任，受尊重也可能没有审批权；权力可能降低换位思考（Galinsky 等 2006）。", "one": "权力是能控制别人在乎的资源和后果，地位是别人给你的尊重，两者可以分开。", "eg": "新经理能批预算、派项目，这是权力；大家有难题都去请教资深同事，这是他的地位。", "like": "像一个人握着开门的钥匙，另一个人是大家信任的向导。"}
  ],
  "tf": [
    {"q": "A person without a formal managerial title cannot provide leadership in a team.", "a": false, "exp": "没有头衔也能领导。职位只给你分配任务和资源的权利，真正的领导影响可以来自经验和信任。"},
    {"q": "Leader emergence and leader effectiveness are different: being chosen as leader does not guarantee leading the team well.", "a": true, "exp": "被选为领导只说明你「涌现」了；带得好不好要看成果、成员成长、公平和长期后果。"},
    {"q": "According to the Big Five meta-analysis by Judge et al. (2002) presented in class, agreeableness showed the strongest positive relationship with leadership.", "a": false, "exp": "关联最强的是外向性（extraversion），宜人性关联较弱，神经质则是负向关联。"},
    {"q": "Consideration and initiating structure are two ends of a single continuum, so increasing one necessarily reduces the other.", "a": false, "exp": "关怀和任务结构是两个独立维度，可以同时高或同时低；把任务讲清楚并不会减少关心。"},
    {"q": "Judge, Piccolo and Ilies (2004) found that consideration was more strongly related to follower satisfaction and motivation than initiating structure was.", "a": true, "exp": "关怀与满意度、动机和感知有效性联系更强；任务结构则与领导和团队的绩效联系稍强。"},
    {"q": "In the Hersey–Blanchard model, an employee's readiness is task-specific, so the same person can be R4 on one task and R1 or R2 on another.", "a": true, "exp": "准备度看的是做某项具体任务的能力和意愿，不是贴在人身上的永久标签。"},
    {"q": "An R3 follower is unable to do the task but is enthusiastic and confident.", "a": false, "exp": "不会做但热情自信的是 R2；R3 正好相反，是会做但不太愿意或没信心。"},
    {"q": "The Delegating (S4) style means the leader no longer needs to be available or hold the follower accountable.", "a": false, "exp": "授权不是撒手不管：仍要约定成果、期限、决策权限和汇报节点，领导也要能被找到。"},
    {"q": "Thompson and Vecchio (2009) found only limited support for situational leadership theory, and the revised version predicted outcomes less well than the original.", "a": true, "exp": "研究只找到有限支持，修订版的预测还不如原版，所以模型的处方只能算待验证的假设。"},
    {"q": "In Fiedler's model, a high LPC score indicates that the leader currently has poor relationships with team members.", "a": false, "exp": "高 LPC 只说明这位领导偏关系导向，这是一种稳定取向，不反映他现在和团队关系好坏。"},
    {"q": "Fiedler's situations I and II both have good leader–member relations and a structured task, but position power is strong in I and weak in II.", "a": true, "exp": "两种情境都是关系好、任务结构化，区别只在职位权力：情境 I 强，情境 II 弱。"},
    {"q": "According to Fiedler's pattern, relationship-oriented leaders perform better in very favourable situations (I–II).", "a": false, "exp": "关系导向在中间情境（III–VI）更好；两端很有利或很不利时，任务导向更好。"},
    {"q": "Strengthening a leader's formal position power will automatically repair poor leader–member relations.", "a": false, "exp": "权力变大不会自动带来信任。修复关系要靠兑现承诺，并公平地让成员参与决策。"},
    {"q": "Active management by exception involves monitoring for deviations and correcting them, whereas passive management by exception waits until problems occur.", "a": true, "exp": "两者差在介入时机：主动型持续监测、发现偏差就纠正，被动型要等问题出现了才处理。"},
    {"q": "Social status refers to the respect and admiration others give a person, and a person can have high status without control over budgets.", "a": true, "exp": "地位来自别人给你的尊重，权力来自对资源和后果的控制，两者可以分开，没预算也能有地位。"}
  ],

  "essay": [
    {"q": "Case: Mei is a senior analyst who has independently produced the company's monthly financial reports for three years. Her manager, Tom, is introducing a new data visualisation platform and plans to hand all reporting on the new platform to Mei with no guidance, saying \"She's our best reporter, she'll be fine.\" Mei has never used the platform, but tells colleagues she is keen to learn it. Two weeks later her first dashboards are late and contain errors. Using the Hersey–Blanchard situational leadership model, diagnose the problem and recommend what Tom should do.",
     "points": ["Readiness is task-specific: high readiness on routine reports (R4) does not transfer to the new platform", "Diagnose ability (knowledge, skill) and willingness (motivation, confidence) separately: low ability but high willingness = R2", "Tom used Delegating (S4) when Selling (S2) – high direction and high support – was needed", "Recommend: demonstrate key steps, explain reasons, set practice and checkpoints, discuss drafts and recognise progress", "Gradually reduce direction as evidence of competence grows; re-diagnose when the task changes", "Note limits: Thompson & Vecchio (2009) gave limited support, so treat the prescription as a hypothesis and check other causes such as workload or resources"],
     "model": "Tom has made a readiness error. In the Hersey–Blanchard model, readiness combines ability (relevant knowledge and skill) and willingness (motivation and confidence) for a specific task. Mei is R4 for routine reporting, but the new platform is a different task: she lacks the relevant skill but is keen to learn, which places her at R2. Tom applied Delegating (S4) – low direction and low support – which suits only followers who are both able and willing. The late, error-filled dashboards are consistent with a mismatch rather than poor attitude. Tom should shift to Selling (S2): provide substantial task direction by demonstrating key steps, explaining why each part matters and setting clear quality standards and checkpoints, while also giving high relationship support by inviting questions, discussing drafts and recognising progress. As Mei's competence grows, Tom can reduce direction and move towards delegating, agreeing outcomes, deadlines and decision limits. However, Thompson and Vecchio (2009) found only limited support for the model, so Tom should treat R2 as a starting hypothesis: he should also check whether workload, inaccessible resources or unclear expectations contributed, try one form of support, and review the results before changing approach again."},
    {"q": "Case: Raj is a task-oriented manager (low LPC) who has been appointed to lead a cross-department IT project. The project goals are vague and acceptance criteria are undefined, team members distrust Raj because a previous manager broke promises, and Raj must seek approval from three department heads before he can allocate staff or budget. Senior management's plan is simply to tell Raj to \"become more of a people person\". Using Fiedler's contingency theory, analyse the situation and evaluate senior management's plan.",
     "points": ["Explain LPC: low LPC = task-motivated, a relatively stable orientation", "Diagnose the three favourability factors: poor leader–member relations, unstructured task, weak position power = situation VIII (very unfavourable)", "Fiedler's pattern: task-oriented leaders tend to perform relatively better in very unfavourable situations; but the situation should still be improved where possible", "Critique: Fiedler does not assume leaders can freely switch orientation, so asking Raj to change style is weak", "Recommend changing the situation: clarify goals and acceptance criteria, clarify decision authority, rebuild trust by following through and involving members fairly", "Note that authority does not automatically create trust, and the pattern is not a guarantee"],
     "model": "Fiedler's contingency theory argues that effectiveness depends on the fit between a leader's relatively stable motivational orientation, measured by the LPC scale, and situational favourability. Raj's low LPC indicates a task-motivated orientation. The three favourability factors are all unfavourable: leader–member relations are poor because of distrust, the task is unstructured because goals and acceptance criteria are vague, and position power is weak because Raj needs approval to allocate staff or budget. This corresponds to situation VIII, which the class diagram labels very unfavourable; in this zone the pattern shows task-oriented leaders performing relatively better, so Raj's orientation is not necessarily the problem. Senior management's plan is therefore poorly grounded: Fiedler treats LPC as relatively stable and does not assume leaders can switch orientation on demand. A better approach is to change the situation. Management can increase task structure by defining objectives and acceptance criteria, and strengthen position power by clarifying Raj's legitimate decision authority over resources. Separately, Raj should rebuild relations by following through on commitments and involving members fairly in decisions, because more authority will not automatically create trust. If fit still cannot be achieved, reassigning the leadership role could be considered. These interventions should be judged against evidence, since the eight-situation pattern is not a guarantee of performance."},
    {"q": "Case: Lena leads a customer service team that is rolling out a new booking system. She explains how the change will reduce customer waiting times, invites staff to challenge obstacles in the current process, and coaches newer staff individually. She also agrees clear milestones with each person and promises public recognition and a team bonus once targets are met. However, she rarely checks progress until a customer complaint arrives. Identify the leadership approaches evident in Lena's behaviour and evaluate their likely strengths and weaknesses.",
     "points": ["Transformational: inspirational motivation (shared purpose), intellectual stimulation (challenging obstacles), individualised consideration (individual coaching)", "Transactional – contingent reward: agreed milestones linked to recognition and bonus", "Transactional – passive management by exception: intervening only after complaints", "Transformational and transactional behaviours can complement each other; judge by observable behaviour", "Weakness: passive monitoring lets problems grow; recommend active management by exception or regular checkpoints", "Evaluate effectiveness with outcomes, member development, fairness and long-term consequences; note research links (Judge & Piccolo 2004) are correlational"],
     "model": "Lena's behaviour combines several leadership approaches. Explaining how the change benefits customers reflects inspirational motivation; inviting staff to challenge obstacles reflects intellectual stimulation; and coaching newer staff individually reflects individualised consideration – three of the four I's of transformational leadership. Her coaching and removal of barriers could also be read as servant-type behaviour. At the same time, agreeing milestones and linking them to recognition and a bonus is contingent reward, a transactional component that Judge and Piccolo (2004) found positively associated with satisfaction, motivation and performance, although these are correlations rather than proof of causation. These approaches complement each other: the vision supplies meaning while the milestones make delivery concrete. The weakness is in how Lena manages deviations. Waiting until a customer complaint arrives is passive management by exception, so errors may become serious before she acts. During a system rollout she should move to active management by exception, monitoring progress at agreed checkpoints and correcting problems early. Lena's effectiveness should then be judged not just by whether targets are met, but by member development, fair treatment of staff and longer-term outcomes such as trust and customer service quality."}
  ]
},

    {"term": "Culture strength (consensus and intensity)", "zh": "文化强度（共识与强度）", "def": "How widely expectations are shared (consensus) and how strongly they are held and reinforced (intensity).", "defZh": "Chatman & O'Reilly（2016）；不是人数、标语音量或经理意志。", "one": "文化强度看两点：多少人共享这些期待（共识），大家坚持得多坚定（强度）。", "eg": "团队里几乎人人都认同提交前要核查质量，而且还会互相提醒必须照做。", "like": "像一条班规：全班都认可、还会互相监督，才算真正立住。"},
    {"term": "Culture content", "zh": "文化内容", "def": "What values and behaviours members actually support.", "defZh": "与强度分开评价；强文化不保证内容合适、合乎伦理或绩效更高。", "one": "文化内容是文化具体鼓励什么行为，要和强度分开看：强文化不等于好文化。", "eg": "两家公司都高度一致：一家坚定鼓励试验新方法，另一家坚定要求严守流程。", "like": "像两支纪律同样严明的球队，一支专练进攻，一支专练防守。"},
    {"term": "Sørensen (2002) finding", "zh": "Sørensen 研究结论", "def": "Strong cultures were associated with more reliable performance in relatively stable environments, but this advantage disappeared in volatile environments.", "defZh": "可靠 = 一致稳定，不是利润最高；是关联不是因果定律。", "one": "强文化在稳定环境里让绩效更可靠，但环境一旦多变，这个优势就消失了。", "eg": "一家强文化公司在稳定市场里交付一直很可靠，市场骤变后表现就开始起伏了。", "like": "像走熟路：路况稳定时总能准时，路况骤变时熟路未必还管用。"},
    {"term": "Ritual", "zh": "重复活动（仪式）", "def": "A repeated activity in which members participate and express shared meaning.", "defZh": "例：Walmart cheer；重复动作本身不足以证明共享意义。", "one": "仪式是成员反复参与、借此表达共同意义的活动。", "eg": "Walmart 的员工反复一起喊口号，拼出公司名称，并强调顾客第一。", "like": "像球队赛前的固定呼喊，把共同身份一遍遍带进日常。"},
    {"term": "Ceremony", "zh": "庆典", "def": "A planned event that publicly marks an occasion or achievement, communicating which contributions the organisation values.", "defZh": "与 ritual 区别：庆典强调公开标记事件/成就，ritual 强调重复参与；两者可重叠。", "one": "庆典是有计划地公开标记某个事件或成就，告诉大家组织看重哪种贡献。", "eg": "公司在年度活动上公开表彰跨部门协作的团队，让大家知道这种合作受重视。", "like": "像颁奖台：把值得学习的表现举起来给所有人看。"},
    {"term": "Heroes and symbols", "zh": "榜样人物与象征物", "def": "Heroes are people presented as models of valued behaviour; symbols are objects, actions or images that carry cultural meaning.", "defZh": "例：Nordstrom 倒金字塔（顾客在顶、管理层在下）；需核查一线是否真有权限与资源。", "one": "英雄是被当作榜样讲述的人物，象征物是带有文化意义的物件、动作或图像。", "eg": "Nordstrom 的倒金字塔把顾客放最上、管理层放最下，表达的是支持一线服务。", "like": "像故事里的主角和队徽：一个供人模仿，一个代表认同。"},
    {"term": "Hofstede's six dimensions", "zh": "Hofstede 六维度", "def": "Power distance, individualism/collectivism, uncertainty avoidance, masculinity/femininity, long/short-term orientation, indulgence/restraint.", "defZh": "描述国家层面广泛倾向；national culture ≠ individual behaviour ≠ organisational culture。", "one": "六个维度描述的是国家层面的大体文化倾向，不能直接套到某个人或某家公司。", "eg": "得知成员来自高不确定性规避的国家，经理先问他们需要哪些规则，而不是默认人人爱严格流程。", "like": "像一个城市的平均气温：说明大体气候，却定不了每个人穿什么。"},
    {"term": "Independent vs interdependent self", "zh": "独立自我与互依自我", "def": "Independent self emphasises personal attributes and preferences; interdependent self emphasises relationships, roles, belonging and mutual dependence.", "defZh": "Markus & Kitayama（1991）；个人可随情境表现两种，不能凭国籍或阶层贴标签。", "one": "独立自我看重个人的特点和偏好，互依自我看重关系、角色和彼此依存。", "eg": "团队自我介绍时，一个人先讲自己的专长和兴趣，另一个人先讲自己在团队里的角色。", "like": "像介绍自己时先说「我擅长什么」，还是先说「我是谁的队友」。"},
    {"term": "Cultural mismatch", "zh": "文化错配", "def": "When institutional or organisational expectations do not match the values and motives that members bring.", "defZh": "Stephens 等（2012）美国大学研究：独立规范与部分第一代大学生互依取向错配；差异 ≠ 错配 ≠ 能力不足。", "one": "组织默认的期待和成员的价值观不合拍，让人不适、更吃力，但不代表能力差。", "eg": "Stephens 等（2012）：美国大学推崇独立，互依的第一代大学生感到不适、表现较差。", "like": "像左撇子用右手剪刀：剪不好不是手笨，是工具不配。"},
    {"term": "Competing Values Framework (CVF)", "zh": "竞争价值框架", "def": "Organises four culture orientations along internal–external focus and flexibility–stability/control axes.", "defZh": "Quinn & Rohrbaugh（1983）：Clan/Involvement、Adhocracy/Adaptability、Hierarchy/Consistency、Market/Achievement；不是发展阶段。", "one": "用内外关注和灵活或稳定两条轴，把文化分成四种取向，没有哪种普遍最好。", "eg": "Apex 看重外部业绩指标，是成就型；医院靠清楚流程可靠运作，是一致性型。", "like": "像坐标图的四个象限：先看横轴竖轴，再定组织落在哪一格。"},
    {"term": "Achievement orientation (Market)", "zh": "成就取向（市场型）", "def": "External focus plus stability/control: competitiveness, clear targets and measurable results, possibly with autonomy over methods.", "defZh": "例：Apex Sales Group；有自主选方法不等于适应型；稳定/控制指结果控制，不证明外部稳定。", "one": "成就取向是外部关注加稳定控制：重视竞争力、明确目标和可衡量的结果。", "eg": "Apex 设有挑战性的指标、每月复盘，晋升紧扣业绩，但具体怎么做由员工自己选。", "like": "像按终点成绩排名的比赛：怎么跑你自己定，最后只看名次。"},
    {"term": "Values–performance matrix", "zh": "价值-绩效矩阵", "def": "A diagnostic that separately checks whether performance goals are achieved and whether values are practised.", "defZh": "四象限组织调查而非人格标签或人事处方；高结果低价值要问结果如何取得、需复核哪些风险。", "one": "把目标是否达成和价值是否践行分开检查，组成四个象限来诊断问题。", "eg": "销售员超额完成指标，却是靠隐瞒客户信息、排挤同事做到的，要追问结果是怎么来的。", "like": "像比赛既看得分也看犯规：跑得快却越出赛道，成绩也要复核。"}

    {"q": "In Schein's model, basic underlying assumptions are the most visible level of culture.", "a": false, "exp": "最可见的是可见表征（artifacts）；基本假设是最深的一层，习以为常，很少被说出来。"},
    {"q": "Holding regular open meetings is sufficient evidence that employees feel safe to express disagreement.", "a": false, "exp": "开会只是一种可见表征，看得见却不好解读；员工敢不敢说，要看实际决策和他们的经历。"},
    {"q": "A gap between stated values and practised values automatically proves that everyone in the organisation is hypocritical.", "a": false, "exp": "差距不一定是虚伪，可能来自相互冲突的要求、部门差异或价值尚未落实，要先查它在哪里发生。"},
    {"q": "Built to Last compared 18 visionary companies with 18 comparison companies using historical material.", "a": true, "exp": "Collins 和 Porras（1994）做的是历史比较，不能据此说文化是成功唯一原因。"},
    {"q": "The \"clock building\" idea means organisations should build capabilities and mechanisms that do not depend on a single charismatic leader.", "a": true, "exp": "造钟是建立职责、程序、接班安排和共享价值，让组织不靠某一个人；报时则只靠领导个人魅力。"},
    {"q": "\"Preserve the core, stimulate progress\" means an organisation should protect all of its existing routines and practices.", "a": false, "exp": "要守住的只是核心理念，具体做法应该不断更新；把所有熟悉的老惯例都当成核心就错了。"},
    {"q": "Culture strength includes both consensus (how widely expectations are shared) and intensity (how strongly they are held and reinforced).", "a": true, "exp": "Chatman 和 O'Reilly（2016）的文化强度就含这两个成分，和文化内容不同。"},
    {"q": "A strong culture is, by definition, a good culture that will produce higher performance.", "a": false, "exp": "强度和内容要分开评价。文化强只说明大家一致，内容可能并不适合任务或环境，所以强不等于好。"},
    {"q": "Sørensen (2002) found that the performance-reliability advantage of strong cultures disappeared in volatile environments.", "a": true, "exp": "稳定环境里强文化和更可靠的绩效相关，波动环境里这个优势消失；是优势消失，不是必然下降。"},
    {"q": "A single company event can contain several visible forms of culture at once, such as a ritual, slogan, hero and symbol.", "a": true, "exp": "一场年度颁奖礼就能同时包含仪式、口号、英雄和象征物；分类是用来识别信息的，不是唯一标签。"},
    {"q": "Hofstede's national-culture dimensions can be used to reliably predict an individual employee's behaviour.", "a": false, "exp": "维度说的是国家层面的大体倾向，不是固定规则；国家文化推不出个人行为，也不等于组织文化。"},
    {"q": "In Stephens et al. (2012), \"first-generation students\" refers to students whose parents did not attend university.", "a": true, "exp": "第一代大学生指父母没上过大学的学生，不是第一代移民；这项研究的情境是美国大学。"},
    {"q": "The cultural mismatch research shows that all first-generation students are interdependent and less capable.", "a": false, "exp": "研究不能这样推论：困难来自制度规范和个人背景的互动，有差异不等于能力不足。"},
    {"q": "In the Competing Values Framework, the Hierarchy (Consistency) orientation combines an internal focus with stability and control.", "a": true, "exp": "一致性型就是内部关注加稳定控制，重视协调、清楚的程序和可靠运作。"},
    {"q": "The four CVF orientations represent developmental stages that organisations pass through in order.", "a": false, "exp": "四种取向不是组织依次经过的发展阶段，也不由规模或行业直接决定；没有哪一种普遍最优。"}

    {"q": "A manager learns that her new team comes from a country with high uncertainty avoidance. The most appropriate use of Hofstede's framework is to:",

  "essay": [
    {"q": "Case: Lumen Tech's website states that \"openness and employee wellbeing\" are its core values, and it holds a monthly open forum. However, last year an engineer who raised concerns about unrealistic deadlines at the forum was later passed over for a key project. Since then, staff rarely speak at forums, and requests to reduce excessive workloads are routinely declined. The CEO is puzzled and plans to run a values workshop. Using Schein's levels of culture and the distinction between stated and practised values, diagnose the situation and recommend what management should do.",
     "points": ["Artifacts: monthly open forum; espoused values: openness and wellbeing on the website", "Basic underlying assumption: speaking up carries career costs (learned from the engineer's experience)", "Gap between stated and practised values: decisions, recognition and workload responses contradict the stated values", "Culture is learned through shared experience; one workshop cannot replace changing actual practice", "Recommend: diagnose experiences, clarify that reasonable dissent will not be punished, align opportunity allocation and workload decisions, evaluate whether concerns are raised and handled", "Avoid concluding everyone is hypocritical; investigate where and why the gap occurs"],
     "model": "Schein distinguishes three levels of culture. At Lumen Tech the monthly forum is an artifact and the website's commitment to openness and wellbeing is an espoused value. However, culture is learned through shared experience: when the engineer who raised concerns was passed over, employees learned that speaking up carries career costs. This has likely become a basic underlying assumption – a taken-for-granted belief that now guides behaviour, explaining why forums are silent. The case also shows a gap between stated and practised values. Practised values are visible in decisions, recognition and what behaviour is accepted or corrected; here, opportunity allocation and the routine refusal of workload requests contradict the stated values. The forum's existence cannot prove openness, because artifacts are easy to observe but hard to interpret. A values workshop alone is unlikely to work, because it repeats the espoused level without changing practice. Management should follow a diagnose–clarify–align–evaluate sequence: listen to employees' experiences and examine how project and workload decisions are made; clarify that reasonable dissent will not be penalised; align leaders' actions, project allocation and workload resources with the stated values; and evaluate over time whether concerns are raised and handled seriously. Management should also avoid assuming everyone is hypocritical, since the gap may come from competing demands or particular units."},
    {"q": "Case: Harbour Logistics has had a very strong culture for 30 years: almost all staff share and firmly enforce the belief that \"we always follow the established process exactly\". This produced highly reliable delivery performance in a stable market. In the past two years, customer demands and technology have changed rapidly, competitors have introduced flexible services, and Harbour's performance has become uneven. A new manager argues that \"a strong culture is always an advantage, so we should just reinforce it\". Evaluate this argument using concepts from this week.",
     "points": ["Define culture strength as consensus plus intensity; Harbour scores high on both", "Distinguish strength from content: the content (strict process adherence) may not fit the new environment", "Sørensen (2002): strong cultures linked to reliable performance in stable environments, advantage disappears in volatile ones; association not causal law", "Built to Last: preserve the core, stimulate progress – separate core commitments from familiar routines", "CVF: current Consistency (Hierarchy) emphasis may need more Adaptability (external + flexibility) practices", "Recommend diagnosing which expectations still fit, and aligning recognition and resources with needed behaviours"],
     "model": "The manager's argument confuses culture strength with culture content. Following Chatman and O'Reilly (2016), strength combines consensus – how widely an expectation is shared – and intensity – how strongly it is held and socially reinforced. Harbour is high on both, but strength says nothing about whether the content, strict adherence to established process, suits the current task and environment. Sørensen (2002) found that strong cultures were associated with more reliable performance in relatively stable environments, but this advantage disappeared in volatile environments. Harbour's history fits the first condition and its recent uneven results are consistent with the second, although this is an association rather than proof that strong culture causes decline. Simply reinforcing old habits therefore risks locking in behaviour that no longer fits. In Competing Values terms, Harbour has a Consistency (Hierarchy) emphasis – internal focus and stability/control – while the new environment demands more Adaptability: attention to external signals, experimentation and changed practice. Built to Last's principle of preserving the core while stimulating progress is useful: management should identify the genuine core commitment, such as reliable service to customers, and separate it from familiar routines that can be updated. Management should diagnose which shared expectations still fit, clarify the new behaviours needed, align recognition and resources to support experimentation, and evaluate results over time."},
    {"q": "Case: Westbridge University's student support centre has a strongly service-minded team: staff treat students respectfully and help each other, but average waiting times have exceeded targets for three consecutive months. Meanwhile, the university's orientation messaging stresses \"be independent, find your own path and speak up for yourself\", and staff notice that some first-generation students rarely use the centre and report feeling out of place. The director plans to run more value-awareness sessions. Using the values–performance matrix and the concept of cultural mismatch, analyse the situation and recommend actions.",
     "points": ["Matrix: values practised but goals not achieved – ask what capabilities are missing and what resources need improving", "Do not assume staff lack commitment to service; investigate skills, workload, systems and resources", "Value-awareness sessions alone do not change practice; clarify waiting-time targets and trial targeted improvements", "Cultural mismatch: independence-focused norms may mismatch the interdependent orientation of some first-generation students (Stephens et al. 2012)", "Avoid generalising: not all first-generation students are interdependent or less capable; mismatch arises from institution–background interaction", "Inclusive culture: recognise differences, create multiple ways to participate, align practices (e.g. framing support around community)"],
     "model": "The values–performance matrix separates whether performance goals are achieved from whether values are practised. The support team falls in the 'values practised, goals not achieved' quadrant, so the right questions are what capabilities are missing and what resources need improving. Respectful, helpful behaviour shows the team already practises its service values, so more value-awareness sessions are unlikely to reduce waiting times. The director should clarify the waiting-time target, investigate skills, workload, booking systems and staffing, trial a targeted improvement, and then review service behaviour and waiting times separately. The second issue concerns cultural mismatch. Stephens et al. (2012) showed that in US universities, norms emphasising independence can mismatch the interdependent orientation of some first-generation students – those whose parents did not attend university – leading to discomfort, tasks feeling harder and poorer performance; framing the university around interdependence was linked to better task performance. Westbridge's 'be independent' messaging may make some students feel help-seeking does not belong to them. The director should not assume all first-generation students are interdependent or less capable, since mismatch arises from the interaction between institutional norms and background. Building an inclusive culture means recognising differences, creating varied ways to participate, such as peer or group-based support, and aligning messaging with inclusive values, then checking whether usage and student experiences actually change."}
  ]
}];

      "howTo": "先定横轴：盯客户、市场是外部，盯成员、流程是内部；再定纵轴：鼓励实验、参与是灵活，强调目标控制、程序合规是稳定。外部加灵活是适应，外部加稳定是成就，内部加灵活是参与，内部加稳定是一致性。",
      "items": [

          "answer": 0,
          "how": ["「customer trends」「market shifts」是外部关注，「experimentation」「rapid prototyping」是灵活。", "外部加灵活是 Adaptability（Adhocracy），选 A。", "Achievement 也是外部关注，但重点是可衡量结果和控制，不是实验。"]

          "answer": 1,
          "how": ["「sales target」「league table」「bonuses」是外部可衡量结果和竞争力，属于外部加稳定控制。", "外部加稳定控制是 Achievement（Market），选 B。", "「decide for themselves how」是方法自主，不等于适应型；成就取向不必靠僵硬的过程控制。"]
        },
        {
          "type": "mcq",
          "q": "A college's staff regularly join teaching and student-support meetings, solve problems together, and managers emphasise feedback, development and commitment. Which CVF position applies?",

          "answer": 1,
          "how": ["「solve problems together」「development」「commitment」关注的是内部成员，方式是参与和合作。", "内部加灵活是 Involvement（Clan），选 B。", "别因为气氛好就停在这里：课堂要求用主导优先事项和具体实践来支持判断。"]
        },
        {
          "type": "mcq",
          "q": "A hospital has clear procedures for medication, records and handovers, defined roles, and supervisors who check that standards are followed. Its dominant orientation is:",
          "options": ["Adaptability (Adhocracy)", "Achievement (Market)", "Involvement (Clan)", "Consistency (Hierarchy)"],
          "answer": 3,
          "how": ["「clear procedures」「defined roles」「check that standards are followed」是内部协调加程序控制。", "内部加稳定控制是 Consistency（Hierarchy），选 D。", "一致性不只是僵化官僚，关键是流程如何支持可靠运作。"]
        },
        {
          "type": "tf",
          "q": "In the Competing Values Framework (Quinn & Rohrbaugh 1983), the four orientations are developmental stages, and the Adaptability orientation is the best one for every organisation.",

          "how": ["四种取向不是发展阶段，也没有普遍最优，要结合任务和环境判断。", "题目既说成阶段又说有最优，所以是 False。"]
        }
      ],
      "recap": "先看内外，再看灵活或稳定：实验是适应型，指标是成就型，参与是参与型，程序是一致性型。"
    },
    {
      "id": "w11-p14",
      "title": "价值—绩效矩阵与管理文化四步",

      "kp": "价值—绩效矩阵把目标是否达成和价值是否践行分开检查，形成四个象限用来组织调查，不是人格标签。管理文化四步：diagnose 诊断实际行为、clarify 澄清期待、align 对齐领导与资源、evaluate 评估调整。",
      "howTo": "先判两个维度：目标达没达成、价值践不践行。目标达成但价值被忽视，问结果怎么取得、要复核什么风险；价值践行但目标未达，问缺什么能力和资源，不要只加宣讲。看到「先听经历、再澄清、再调资源、最后复查」就是四步。",

          "q": "A salesperson exceeds every target but does so by withholding information from customers and undermining colleagues. On the values–performance matrix the manager should first ask:",

          "answer": 1,

          "answer": 1,
          "how": ["「respectfully」「help each other」说明价值被践行，「exceeded the target」说明目标未达。", "这个象限要问缺什么能力和资源，不能只加宣讲，选 B。", "A 跳过诊断直接认定员工不认同服务，正是矩阵要避免的。"]
        },

          "answer": 2,
          "how": ["「observes… interviews」是诊断，「spells out… expected」是澄清。", "「changes bonuses and budgets」是对齐，「tracks… feedback」是评估。", "四步依次是 diagnose、clarify、align、evaluate，选 C。", "B 是包容文化的三项做法，别混。"]
        },
        {
          "type": "tf",
          "q": "Following the diagnose, clarify, align and evaluate sequence once guarantees that the desired culture is established.",
          "a": false,
          "how": ["四步帮助组织行动，并不保证一次调整就建立理想文化，要保留持续反馈和复查。", "题目说「once guarantees」，所以是 False。"]
        }
      ],
      "recap": "矩阵分开看目标与价值：高绩效低价值问结果怎么来；管理文化四步诊断、澄清、对齐、评估。"

<script>
(function(){
"use strict";
const WEEKS = (window.MGMT_DATA||[]).slice().sort((a,b)=>a.week-b.week);
const EXAM_AT = new Date("2026-11-09T14:00:00+11:00");
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const TYPE_ZH = {tf:"判断",mcq:"单选",match:"匹配",essay:"简答"};

/* ---------- storage ---------- */
const KEY="mgmt1003-review-v1";
let S = {stats:{},wrong:{},box:{},essay:{},theme:""};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
S.learn = S.learn || {};   // 边练边学进度：{ [itemId]: {ok, t} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* ---------- question index ---------- */
const Q = [];       // all gradable + essay questions
const CARDS = [];
WEEKS.forEach(w=>{
  (w.tf||[]).forEach((q,i)=>Q.push({id:`w${w.week}-tf-${i}`,type:"tf",week:w.week,...q}));
  (w.mcq||[]).forEach((q,i)=>Q.push({id:`w${w.week}-mcq-${i}`,type:"mcq",week:w.week,...q}));
  (w.match||[]).forEach((q,i)=>Q.push({id:`w${w.week}-match-${i}`,type:"match",week:w.week,...q}));
  (w.essay||[]).forEach((q,i)=>Q.push({id:`w${w.week}-essay-${i}`,type:"essay",week:w.week,...q}));
  (w.concepts||[]).forEach((c,i)=>CARDS.push({id:`w${w.week}-c-${i}`,week:w.week,...c}));
});
const QBYID = Object.fromEntries(Q.map(q=>[q.id,q]));

function record(q,ok){
  const s=S.stats[q.id]||{c:0,w:0};
  ok?s.c++:s.w++; S.stats[q.id]=s;
  if(!ok) S.wrong[q.id]=Date.now();
  save();
}

/* ---------- header ---------- */
function tickCountdown(){
  const ms=EXAM_AT-Date.now();
  const el=$("#countdown");
  if(ms<=0){ el.innerHTML="考试时间已到"; return; }
  const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5);
  el.innerHTML=`距期末 <b>${d}</b> 天 <b>${h}</b> 小时`;
}
tickCountdown(); setInterval(tickCountdown,60000);

function applyTheme(){ if(S.theme) document.documentElement.setAttribute("data-theme",S.theme); else document.documentElement.removeAttribute("data-theme"); $("#themeBtn").textContent={"":"主题：跟随系统",light:"主题：浅色",dark:"主题：深色"}[S.theme||""]; }
$("#themeBtn").onclick=()=>{ S.theme={"":"light",light:"dark",dark:""}[S.theme||""]; save(); applyTheme(); };
applyTheme();

/* ---------- router ---------- */
let current="home";
const views={home:viewHome,learn:viewLearn,notes:viewNotes,cards:viewCards,practice:viewPractice,exam:viewExam,wrong:viewWrong};
function go(v,opts){
  if(current==="exam" && EX && EX.running && v!=="exam"){ /* keep exam running; just switch view */ }
  current=v;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===v));
  document.documentElement.style.setProperty("--hdr",($("header.top").offsetHeight+8)+"px");
  const m=$("#main"); m.innerHTML=""; views[v](m,opts||{}); window.scrollTo(0,0);
  try{ if(/^[a-z]+$/.test(v)) history.replaceState(null,"","#"+v); }catch(e){}
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>go(b.dataset.view));

/* ---------- week chips helper ---------- */
function weekChips(selected,onChange,{multi=true}={}){
  const wrap=document.createElement("div"); wrap.className="chips";
  const render=()=>{
    wrap.innerHTML="";
    if(multi){
      const all=document.createElement("button"); all.className="chip"; all.type="button";
      all.textContent="全部"; all.setAttribute("aria-pressed",selected.size===WEEKS.length);
      all.onclick=()=>{ if(selected.size===WEEKS.length) selected.clear(); else WEEKS.forEach(w=>selected.add(w.week)); render(); onChange(); };
      wrap.appendChild(all);
    }
    WEEKS.forEach(w=>{
      const b=document.createElement("button"); b.className="chip"; b.type="button";
      b.textContent="W"+w.week; b.title=w.titleZh||w.title;
      b.setAttribute("aria-pressed",selected.has(w.week));
      b.onclick=()=>{ if(multi){ selected.has(w.week)?selected.delete(w.week):selected.add(w.week);} else {selected.clear();selected.add(w.week);} render(); onChange(); };
      wrap.appendChild(b);
    });
  };
  render(); return wrap;
}

/* ---------- HOME ---------- */
function viewHome(m){
  const ms=Math.max(0,EXAM_AT-Date.now()); const days=Math.ceil(ms/864e5);
  const gradable=Q.filter(q=>q.type!=="essay");
  const done=gradable.filter(q=>S.stats[q.id]).length;
  const corr=gradable.reduce((a,q)=>a+(S.stats[q.id]?.c||0),0), tot=gradable.reduce((a,q)=>a+((S.stats[q.id]?.c||0)+(S.stats[q.id]?.w||0)),0);
  const mastered=CARDS.filter(c=>(S.box[c.id]||0)>=3).length;
  m.innerHTML=`<section class="view">
    <div class="panel">
      <div class="eyebrow">Final examination</div>
      <div class="hero-count" style="margin-top:8px">
        <div><div class="big">${days}</div><div class="muted">天后开考</div></div>
        <dl class="facts" style="flex:1;min-width:240px;margin:0">
          <dt>时间</dt><dd>2026 年 11 月 9 日 14:00–16:00（课件所列，以 Canvas 通知为准）</dd>
          <dt>地点</dt><dd>Copland G29 / G30 / G31</dd>
          <dt>形式</dt><dd>闭卷 · 纸笔 · 2 小时 · 覆盖全部周次</dd>
          <dt>题型</dt><dd>True/False · Multiple choice · Matching · Short essay / case analysis</dd>
        </dl>
      </div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="eyebrow">题库</div><div class="big" style="font-size:2rem;margin-top:6px">${done}<span class="muted" style="font-size:1rem"> / ${gradable.length}</span></div><div class="muted">已做过的客观题 · 正确率 ${tot?Math.round(corr/tot*100):0}%</div></div>
      <div class="panel"><div class="eyebrow">闪卡</div><div class="big" style="font-size:2rem;margin-top:6px">${mastered}<span class="muted" style="font-size:1rem"> / ${CARDS.length}</span></div><div class="muted">已掌握的概念（连续答对 3 次）</div></div>
      <div class="panel"><div class="eyebrow">错题本</div><div class="big" style="font-size:2rem;margin-top:6px">${Object.keys(S.wrong).length}</div><div class="muted">待复习的错题</div></div>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between"><h2>各周进度</h2>
        <div class="legend"><span><i style="background:var(--accent)"></i>已做比例</span><span><i style="background:var(--good)"></i>正确率</span></div></div>
      <div class="weekbars" id="wbars" style="margin-top:12px"></div>
    </div>
    <div class="panel">
      <h2>建议复习路线</h2>
      <ol class="summary" style="margin-top:10px">
        <li>每周先读 <b>笔记要点</b>，把 summary 和概念表过一遍。</li>
        <li>用 <b>闪卡</b> 背术语中英对照，考试英文作答，术语要能直接写出。</li>
        <li><b>分题练习</b> 按周刷判断、单选、匹配，看解析里的易混点。</li>
        <li>考前一周每两天做一次 <b>模拟考试</b>（完整版 120 分钟），简答题动手写。</li>
        <li>考前一天只刷 <b>错题本</b>。</li>
      </ol>
      <div class="row" style="margin-top:14px">
        <button class="btn primary" data-go="exam">开始模拟考试</button>
        <button class="btn" data-go="cards">背闪卡</button>
        <button class="btn" data-go="wrong">复习错题</button>
      </div>
    </div>
  </section>`;
  m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const wb=$("#wbars",m);
  WEEKS.forEach(w=>{
    const qs=gradable.filter(q=>q.week===w.week);
    const d=qs.filter(q=>S.stats[q.id]).length;
    let c=0,t=0; qs.forEach(q=>{const s=S.stats[q.id]; if(s){c+=s.c;t+=s.c+s.w;}});
    const row=document.createElement("div"); row.className="wb"; row.style.cursor="pointer"; row.title="打开 Week "+w.week+" 笔记";
    row.innerHTML=`<span class="name">W${w.week}</span>
      <div style="display:grid;gap:3px;min-width:0"><div class="muted" style="font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(w.titleZh)} · ${esc(w.title)}</div>
      <div class="bar"><i style="width:${qs.length?d/qs.length*100:0}%"></i></div>
      <div class="bar"><i class="acc" style="width:${t?c/t*100:0}%"></i></div></div>
      <span class="num">${d}/${qs.length}</span>`;
    row.onclick=()=>go("notes",{week:w.week});
    wb.appendChild(row);
  });
}

/* ---------- NOTES ---------- */
let notesWeek=null;
// 一句话 + 例子 + 比喻；英文原定义折叠在最后（考试用英文作答时可参考）
function explainHTML(c,fold){
  const en = fold ? `<details><summary>英文定义</summary>${esc(c.def)}</details>` : `<div class="muted" style="font-size:.88rem">${esc(c.def)}</div>`;
  return `<div class="xp"><div class="one">${esc(c.one||c.defZh)}</div>
    ${c.eg?`<div class="ln"><b>例子</b><span>${esc(c.eg)}</span></div>`:""}
    ${c.like?`<div class="ln like"><b>比喻</b><span>${esc(c.like)}</span></div>`:""}
    ${en}</div>`;
}
function viewNotes(m,opts){
  if(opts.week) notesWeek=opts.week;
  if(!notesWeek) notesWeek=WEEKS[0]?.week;
  m.innerHTML=`<section class="view">
    <input class="search" id="nsearch" type="search" placeholder="搜索所有周的概念，例如 Herzberg、心理安全、LPC">
    <div id="nchips"></div>
    <div id="nbody" style="display:grid;gap:18px"></div></section>`;
  const sel=new Set([notesWeek]);
  $("#nchips",m).appendChild(weekChips(sel,()=>{notesWeek=[...sel][0];renderWeek();},{multi:false}));
  const body=$("#nbody",m);
  function renderWeek(){
    const w=WEEKS.find(x=>x.week===notesWeek); if(!w){body.innerHTML="";return;}
    body.innerHTML=`<div class="panel">
      <div class="week-head"><span class="wk">Week ${w.week}</span><h1>${esc(w.title)}</h1><span class="muted">${esc(w.titleZh)}</span></div>
      <h2 style="margin-top:16px">核心要点</h2>
      <ol class="summary" style="margin-top:8px">${(w.summary||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      <div class="row" style="margin-top:16px">
        <button class="btn primary" id="pw">练习本周题目</button>
        <button class="btn" id="cw">本周闪卡</button></div>
    </div>
    <div class="panel"><h2>概念表 <span class="muted" style="font-size:.85rem;font-weight:500">${(w.concepts||[]).length} 个</span></h2>
      <div class="concepts" style="margin-top:8px">${(w.concepts||[]).map(c=>conceptHTML(c)).join("")}</div></div>`;
    $("#pw",body).onclick=()=>go("practice",{weeks:[w.week]});
    $("#cw",body).onclick=()=>go("cards",{weeks:[w.week]});
  }
  function conceptHTML(c,tag){ return `<div class="concept"><div class="t">${tag?`<span class="tag">W${c.week}</span> `:""}${esc(c.term)}<small>${esc(c.zh)}</small></div><div class="d">${explainHTML(c,true)}</div></div>`; }
  $("#nsearch",m).oninput=e=>{
    const k=e.target.value.trim().toLowerCase();
    if(!k){ $("#nchips",m).hidden=false; renderWeek(); return; }
    $("#nchips",m).hidden=true;
    const hits=CARDS.filter(c=>[c.term,c.zh,c.def,c.defZh,c.one,c.eg,c.like].join(" ").toLowerCase().includes(k));
    const sumHits=[]; WEEKS.forEach(w=>(w.summary||[]).forEach(s=>{ if(s.toLowerCase().includes(k)) sumHits.push({w:w.week,s}); }));
    body.innerHTML=`<div class="panel"><h2>概念 · ${hits.length} 条</h2><div class="concepts" style="margin-top:8px">${hits.map(c=>conceptHTML(c,true)).join("")||'<div class="empty">没有匹配的概念</div>'}</div></div>
      ${sumHits.length?`<div class="panel"><h2>要点 · ${sumHits.length} 条</h2><ul style="margin:8px 0 0;padding-left:1.2em">${sumHits.map(h=>`<li><span class="tag">W${h.w}</span> ${esc(h.s)}</li>`).join("")}</ul></div>`:""}`;
  };
  renderWeek();
}

/* ---------- LEARN (边练边学) ---------- */
// 题目按考点顺序排列；每题先给考点和解题方法，答完给“怎么用这个知识点解出这题”
const LEARN = (window.MGMT_LEARN||[]).slice().sort((a,b)=>a.week-b.week);
LEARN.forEach(L=>L.points.forEach((p,pi)=>p.items.forEach((it,i)=>{ it.id=`${p.id}-${i}`; it.week=L.week; })));
let learnWeek=null, LR=null;   // LR = {week, pi, qi, resp, checked}
function learnStatus(p){ const done=p.items.filter(it=>S.learn[it.id]).length, ok=p.items.filter(it=>S.learn[it.id]&&S.learn[it.id].ok).length; return {done,ok,total:p.items.length}; }
function viewLearn(m,opts){
  if(opts.week) learnWeek=opts.week;
  const L = LEARN.find(x=>x.week===learnWeek) || LEARN[0];
  learnWeek = L ? L.week : null;
  if(!L){ m.innerHTML=`<section class="view"><div class="panel empty">还没有“边练边学”内容。</div></section>`; return; }
  if(opts.start){ LR={week:L.week,pi:opts.start.pi,qi:opts.start.qi||0,resp:undefined,checked:false}; }
  if(LR && LR.week===L.week){ renderRun(m,L); return; }
  m.innerHTML=`<section class="view">
    <div class="panel" style="display:grid;gap:12px">
      <div class="lchips" id="lchips"></div>
      <div class="muted" style="font-size:.9rem">不用先看笔记：按考点顺序直接做题，每题都告诉你考的是哪个知识点、怎么用它选出答案。</div>
    </div>

let cardWeeks=null;
function viewCards(m,opts){
  if(opts.weeks) cardWeeks=new Set(opts.weeks);
  if(!cardWeeks) cardWeeks=new Set(WEEKS.map(w=>w.week));
  let onlyWeak=true, front="en", deck=[], idx=0;
  m.innerHTML=`<section class="view">
    <div class="panel" style="display:grid;gap:12px">
      <div id="cchips"></div>
      <div class="row">
        <label class="row" style="gap:6px"><input type="checkbox" id="weak" checked> 只看未掌握</label>
        <label class="row" style="gap:6px">正面显示 <select id="front" class="btn small"><option value="en">英文术语</option><option value="zh">中文名称</option></select></label>
        <button class="btn small" id="reshuffle" type="button">重新洗牌</button>
      </div>
      <div class="boxes" id="boxes"></div>
    </div>
    <div id="cardarea" style="display:grid;gap:12px"></div></section>`;
  $("#cchips",m).appendChild(weekChips(cardWeeks,build));
  $("#weak",m).onchange=e=>{onlyWeak=e.target.checked;build();};
  $("#front",m).onchange=e=>{front=e.target.value;show();};
  $("#reshuffle",m).onclick=build;
  function build(){
    deck=shuffle(CARDS.filter(c=>cardWeeks.has(c.week) && (!onlyWeak || (S.box[c.id]||0)<3)));
    // weaker boxes first
    deck.sort((a,b)=>(S.box[a.id]||0)-(S.box[b.id]||0));
    idx=0; boxes(); show();
  }
  function boxes(){
    const pool=CARDS.filter(c=>cardWeeks.has(c.week)); const cnt=[0,0,0,0];
    pool.forEach(c=>cnt[Math.min(3,S.box[c.id]||0)]++);
    $("#boxes",m).innerHTML=`<span>新/不会 ${cnt[0]}</span>·<span>模糊 ${cnt[1]}</span>·<span>较熟 ${cnt[2]}</span>·<span>已掌握 ${cnt[3]}</span>`;
  }
  function show(){
    const area=$("#cardarea",m);
    if(!deck.length){ area.innerHTML=`<div class="panel empty">这些周的概念都已掌握。取消“只看未掌握”可以继续复习全部。</div>`; return; }
    if(idx>=deck.length){ area.innerHTML=`<div class="panel empty">这一轮 ${deck.length} 张已过完。<div style="margin-top:12px"><button class="btn primary" id="again">再来一轮</button></div></div>`; $("#again",area).onclick=build; return; }
    const c=deck[idx];
    const f = front==="en" ? `<div class="term">${esc(c.term)}</div>` : `<div class="term">${esc(c.zh)}</div>`;
    const b = `<div style="font-family:var(--f-display);font-weight:800;font-size:1.15rem">${esc(c.term)} <span class="muted" style="font-weight:500">${esc(c.zh)}</span></div>${explainHTML(c,false)}`;
    area.innerHTML=`<div class="q-meta"><span>${idx+1} / ${deck.length}</span><span>当前熟练度 ${["新","模糊","较熟","已掌握"][Math.min(3,S.box[c.id]||0)]}</span></div>
      <div class="flash" id="flash" tabindex="0" role="button" aria-label="翻转卡片">
        <div class="flash-inner">
          <div class="face front"><span class="tag wk">W${c.week}</span>${f}<span class="hint">点击或按空格翻面</span></div>
          <div class="face back"><span class="tag wk">W${c.week}</span>${b}</div>
        </div></div>
      <div class="rate">
        <button class="btn" data-r="0" type="button">不会 <span class="muted">1</span></button>
        <button class="btn" data-r="1" type="button">模糊 <span class="muted">2</span></button>
        <button class="btn primary" data-r="2" type="button">会了 <span class="muted">3</span></button>
      </div>`;
    const fl=$("#flash",area); fl.onclick=()=>fl.classList.toggle("flipped");
    area.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>rate(+b.dataset.r));
  }
  function rate(r){
    const c=deck[idx]; if(!c) return;
    const cur=S.box[c.id]||0;
    S.box[c.id]= r===0?0 : r===1?Math.max(1,Math.min(cur,1)) : Math.min(3,cur+1);
    save();
    if(r===0 && deck.length-idx>3) deck.splice(idx+3,0,c); // see again soon
    idx++; boxes(); show();
  }
  cardKeys=e=>{
    if(current!=="cards"||e.target.closest("input,select,textarea")) return;
    if(e.key===" "){ e.preventDefault(); $("#flash")?.classList.toggle("flipped"); }
    if(["1","2","3"].includes(e.key)) rate(+e.key-1);
  };
  build();
}

/* ---------- question renderers ---------- */
// render(q, container, {mode:'practice'|'exam', state, onAnswer})
function renderQuestion(q,box,opt){
  const st=opt.state; // {resp, checked}
  const locked = opt.mode==="practice" ? st.checked : !!opt.review;
  box.innerHTML="";
  const head=document.createElement("div"); head.className="q-meta";
  head.innerHTML=`<span><span class="tag">W${q.week}</span> ${TYPE_ZH[q.type]}</span>${opt.counter||""}`;
  box.appendChild(head);
  if(q.type==="tf"||q.type==="mcq"){
    const p=document.createElement("div"); p.className="q-text"; p.textContent=q.q; box.appendChild(p);
    const opts = q.type==="tf" ? [{t:"True",v:true},{t:"False",v:false}] : q.options.map((t,i)=>({t,v:i}));
    const wrap=document.createElement("div"); wrap.className=q.type==="tf"?"tfrow":"opts";
    opts.forEach((o,i)=>{
      const b=document.createElement("button"); b.type="button"; b.className="opt";
      b.innerHTML=`<span class="k">${q.type==="tf"?(o.v?"T":"F"):"ABCD"[i]}</span><span>${esc(o.t)}</span>`;
      const correct = q.type==="tf" ? o.v===q.a : o.v===q.answer;
      if(st.resp===o.v) b.classList.add("sel");
      if(locked){ b.disabled=true; if(correct) b.classList.add("right"); else if(st.resp===o.v) b.classList.add("wrong"); }
      else b.onclick=()=>{ st.resp=o.v; if(opt.mode==="practice"){ st.checked=true; record(q,isCorrect(q,st)); } opt.onAnswer&&opt.onAnswer(); renderQuestion(q,box,opt); };
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
    if(locked) box.appendChild(feedback(q,st));
  } else if(q.type==="match"){
    const p=document.createElement("div"); p.className="q-text"; p.textContent=q.title; box.appendChild(p);
    if(!st.order) st.order=shuffle(q.pairs.map((_,i)=>i));
    if(!st.resp) st.resp={};
    const rights=shuffle(q.pairs.map(p=>p[1]));
    if(!st.rights) st.rights=rights;
    const list=document.createElement("div");
    st.order.forEach(i=>{
      const [L,R]=q.pairs[i];
      const row=document.createElement("div"); row.className="match-row";
      const sel=document.createElement("select"); sel.id=`m-${q.id}-${i}`;
      sel.innerHTML=`<option value="">— 选择 —</option>`+st.rights.map(r=>`<option ${st.resp[i]===r?"selected":""}>${esc(r)}</option>`).join("");
      sel.onchange=()=>{ st.resp[i]=sel.value; opt.onAnswer&&opt.onAnswer(); };
      if(locked){ sel.disabled=true; row.classList.add(st.resp[i]===R?"right":"wrong"); }
      const l=document.createElement("div"); l.style.fontWeight="600"; l.textContent=L;
      row.append(l,sel);
      if(locked && st.resp[i]!==R){ const f=document.createElement("div"); f.className="fix"; f.textContent="正确："+R; row.appendChild(f); }
      list.appendChild(row);
    });
    box.appendChild(list);
    if(opt.mode==="practice" && !locked){
      const b=document.createElement("button"); b.className="btn primary"; b.type="button"; b.textContent="提交匹配"; b.style.marginTop="12px";
      b.onclick=()=>{ st.checked=true; record(q,isCorrect(q,st)); opt.onAnswer&&opt.onAnswer(); renderQuestion(q,box,opt); };
      box.appendChild(b);
    }
    if(locked){ const n=matchScore(q,st); const f=document.createElement("div"); f.className="feedback "+(n===q.pairs.length?"ok":"no"); f.style.marginTop="12px"; f.innerHTML=`<b>${n} / ${q.pairs.length} 对正确</b>`; box.appendChild(f); }
  } else if(q.type==="essay"){
    const p=document.createElement("div"); p.className="q-text"; p.style.whiteSpace="pre-wrap"; p.textContent=q.q; box.appendChild(p);
    const ta=document.createElement("textarea"); ta.id="ta-"+q.id; ta.placeholder="用英文写下你的答案（考试是纸笔，建议按 diagnosis → explanation → recommendation 结构）";
    ta.value = st.text ?? S.essay[q.id] ?? "";
    ta.oninput=()=>{ st.text=ta.value; S.essay[q.id]=ta.value; save(); opt.onAnswer&&opt.onAnswer(); };
    if(locked && opt.mode==="exam") ta.readOnly=true;
    box.appendChild(ta);
    const wc=document.createElement("div"); wc.className="muted"; wc.style.fontSize=".8rem";
    const upd=()=>wc.textContent=(ta.value.trim()?ta.value.trim().split(/\s+/).length:0)+" words"; upd(); ta.addEventListener("input",upd);
    box.appendChild(wc);
    const showKey = opt.mode==="practice" ? st.checked : opt.review;
    if(!showKey && opt.mode==="practice"){
      const b=document.createElement("button"); b.className="btn primary"; b.type="button"; b.textContent="对照评分要点"; b.style.marginTop="10px";
      b.onclick=()=>{ st.checked=true; opt.onAnswer&&opt.onAnswer(); renderQuestion(q,box,opt); };
      box.appendChild(b);
    }
    if(showKey){
      if(!st.ticks) st.ticks={};
      const k=document.createElement("div"); k.style.cssText="display:grid;gap:10px;margin-top:12px";
      k.innerHTML=`<h3>评分要点 · 写到了就勾选</h3>`;
      const ul=document.createElement("ul"); ul.className="points";
      q.points.forEach((pt,i)=>{ const li=document.createElement("li"); li.innerHTML=`<label><input type="checkbox" id="pt-${q.id}-${i}" ${st.ticks[i]?"checked":""}><span>${esc(pt)}</span></label>`;
        li.querySelector("input").onchange=e=>{ st.ticks[i]=e.target.checked; opt.onAnswer&&opt.onAnswer(); }; ul.appendChild(li); });
      k.appendChild(ul);
      const md=document.createElement("details"); md.innerHTML=`<summary style="cursor:pointer;font-weight:700">查看参考答案</summary><div class="model" style="margin-top:8px"></div>`;
      md.querySelector(".model").textContent=q.model; k.appendChild(md);
      box.appendChild(k);
    }
  }
}
function feedback(q,st){
  const ok=isCorrect(q,st); const f=document.createElement("div");
  f.className="feedback "+(st.resp===undefined?"":ok?"ok":"no"); f.style.marginTop="12px";
  const ans = q.type==="tf" ? (q.a?"True":"False") : "ABCD"[q.answer];
  f.innerHTML=`<b>${st.resp===undefined?"未作答":ok?"正确":"错误"} · 答案 ${ans}</b><div style="margin-top:4px">${esc(q.exp)}</div>`;
  return f;
}
function matchScore(q,st){ let n=0; q.pairs.forEach((p,i)=>{ if(st.resp&&st.resp[i]===p[1]) n++; }); return n; }
function isCorrect(q,st){
  if(q.type==="tf") return st.resp===q.a;
  if(q.type==="mcq") return st.resp===q.answer;
  if(q.type==="match") return matchScore(q,st)===q.pairs.length;
  return null;
}
function answered(q,st){
  if(q.type==="match") return st.resp && Object.values(st.resp).filter(Boolean).length>0;
  if(q.type==="essay") return !!(st.text&&st.text.trim());
  return st.resp!==undefined;
}

/* ---------- PRACTICE ---------- */
let prWeeks=null, prTypes=new Set(["tf","mcq","match","essay"]);
function viewPractice(m,opts){
  if(opts.weeks) prWeeks=new Set(opts.weeks);
  if(!prWeeks) prWeeks=new Set(WEEKS.map(w=>w.week));
  let list=[], i=0, states={}, unseenFirst=true, onlyIds=opts.ids||null;
  m.innerHTML=`<section class="view">
    <div class="panel" style="display:grid;gap:12px" id="prcfg">
      <div id="pchips"></div>
      <div class="chips" id="ptypes"></div>
      <label class="row" style="gap:6px"><input type="checkbox" id="unseen" checked> 没做过的题优先</label>
    </div>
    <div class="progress"><i id="pbar" style="width:0"></i></div>
    <div class="panel" id="qbox"></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="prev" type="button">上一题</button>
      <span class="muted" id="pstat" style="font-family:var(--f-mono);font-size:.85rem"></span>
      <button class="btn primary" id="next" type="button">下一题</button>
    </div></section>`;
  if(onlyIds){ $("#prcfg",m).innerHTML=`<div class="row" style="justify-content:space-between"><b>错题重做 · ${onlyIds.length} 题</b><button class="btn small" id="exitw" type="button">返回错题本</button></div>`; $("#exitw",m).onclick=()=>go("wrong"); }
  else {
    $("#pchips",m).appendChild(weekChips(prWeeks,build));
    const tw=$("#ptypes",m);
    ["tf","mcq","match","essay"].forEach(t=>{ const b=document.createElement("button"); b.className="chip"; b.type="button"; b.textContent=TYPE_ZH[t]; b.dataset.t=t; b.setAttribute("aria-pressed",prTypes.has(t));
      b.onclick=()=>{ prTypes.has(t)?prTypes.delete(t):prTypes.add(t); if(!prTypes.size) prTypes.add(t); tw.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",prTypes.has(x.dataset.t))); build(); };
      tw.appendChild(b); });
    $("#unseen",m).onchange=e=>{unseenFirst=e.target.checked;build();};
  }
  function build(){
    let pool = onlyIds ? onlyIds.map(id=>QBYID[id]).filter(Boolean) : Q.filter(q=>prWeeks.has(q.week)&&prTypes.has(q.type));
    pool=shuffle(pool);
    if(unseenFirst && !onlyIds) pool.sort((a,b)=>(S.stats[a.id]?1:0)-(S.stats[b.id]?1:0));
    list=pool; i=0; states={}; show();
  }
  function show(){
    const box=$("#qbox",m);
    if(!list.length){ box.innerHTML=`<div class="empty">这个筛选下没有题目。</div>`; $("#pstat",m).textContent=""; return; }
    const q=list[i]; states[q.id]=states[q.id]||{};
    renderQuestion(q,box,{mode:"practice",state:states[q.id],counter:`<span>${i+1} / ${list.length}</span>`,onAnswer:stat});
    $("#prev",m).disabled=i===0; $("#next",m).textContent=i===list.length-1?"完成":"下一题";
    stat();
  }
  function stat(){
    const ch=Object.entries(states).filter(([id,s])=>s.checked && QBYID[id].type!=="essay");
    const ok=ch.filter(([id,s])=>isCorrect(QBYID[id],s)).length;
    $("#pstat",m).textContent=`本轮 ${ok}/${ch.length} 正确`;
    $("#pbar",m).style.width=(list.length?(i+1)/list.length*100:0)+"%";
  }
  $("#prev",m).onclick=()=>{ if(i>0){i--;show();} };
  $("#next",m).onclick=()=>{ if(i<list.length-1){i++;show();} else { if(onlyIds) go("wrong"); else build(); } };
  build();
}

let EX=null, exTimer=null;
const EXAM_PRESETS={
  quick:{name:"快速版",min:30,tf:10,mcq:15,match:1,essay:1},
  full:{name:"完整版",min:120,tf:20,mcq:30,match:3,essay:3}

function pickBalanced(type,n){
  // spread across weeks evenly, prefer unseen / wrong
  const byW={}; Q.filter(q=>q.type===type).forEach(q=>(byW[q.week]=byW[q.week]||[]).push(q));
  Object.keys(byW).forEach(k=>byW[k]=shuffle(byW[k]).sort((a,b)=>score(a)-score(b)));
  function score(q){ const s=S.stats[q.id]; if(S.wrong[q.id]) return 0; if(!s) return 1; return 2; }
  const weeks=shuffle(Object.keys(byW)); const out=[]; let k=0;
  while(out.length<n && weeks.some(w=>byW[w].length)){ const w=weeks[k%weeks.length]; if(byW[w].length) out.push(byW[w].shift()); k++; }
  return shuffle(out);
}
function viewExam(m){
  if(EX && EX.running){ examRun(m); return; }
  if(EX && EX.finished){ examResult(m); return; }
  m.innerHTML=`<section class="view">
    <div class="panel"><div class="eyebrow">Mock final</div><h1 style="margin-top:4px">模拟考试</h1>
      <p class="muted" style="margin:8px 0 0">题目按周均匀抽取，覆盖全部周次；错题和没做过的题优先出现。交卷前不显示对错。简答题交卷后对照评分要点自评。</p></div>
    <div class="grid2">${Object.entries(EXAM_PRESETS).map(([k,p])=>`<div class="panel" style="display:grid;gap:8px">
      <h2>${p.name} · ${p.min} 分钟</h2>
      <div class="muted">${p.tf} 判断 · ${p.mcq} 单选 · ${p.match} 匹配 · ${p.essay} 简答</div>
      <button class="btn ${k==="full"?"primary":""}" data-p="${k}" type="button">开始${p.name}</button></div>`).join("")}</div>
  </section>`;
  m.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
    const p=EXAM_PRESETS[b.dataset.p];
    const items=[...pickBalanced("tf",p.tf),...pickBalanced("mcq",p.mcq),...pickBalanced("match",p.match),...pickBalanced("essay",p.essay)];
    EX={preset:p,items:items.map(q=>q.id),states:{},i:0,end:Date.now()+p.min*60000,running:true};
    items.forEach(q=>EX.states[q.id]={});
    go("exam");
  });
}
function examRun(m){
  m.innerHTML=`<section class="view">
    <div class="panel" id="exbar" style="position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,92px));z-index:3;display:grid;gap:10px;padding:12px 16px">
      <div class="row" style="justify-content:space-between"><b>${EX.preset.name}模拟考</b><span class="timer" id="timer"></span>
      <button class="btn primary small" id="submit" type="button">交卷</button></div>
      <div class="navdots" id="dots"></div>
    </div>
    <div class="panel" id="qbox"></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="prev" type="button">上一题</button>
      <button class="btn" id="next" type="button">下一题</button>
    </div>
    <div id="confirm"></div></section>`;
  function dots(){
    const d=$("#dots",m); d.innerHTML="";
    EX.items.forEach((id,k)=>{ const q=QBYID[id]; const b=document.createElement("button"); b.type="button"; b.textContent=k+1; b.title=TYPE_ZH[q.type];
      if(answered(q,EX.states[id])) b.classList.add("done"); if(k===EX.i) b.classList.add("cur");
      b.onclick=()=>{EX.i=k;show();}; d.appendChild(b); });
  }
  function show(){
    const id=EX.items[EX.i], q=QBYID[id];
    renderQuestion(q,$("#qbox",m),{mode:"exam",state:EX.states[id],counter:`<span>${EX.i+1} / ${EX.items.length}</span>`,onAnswer:dots});
    $("#prev",m).disabled=EX.i===0; $("#next",m).disabled=EX.i===EX.items.length-1; dots();
  }
  $("#prev",m).onclick=()=>{EX.i--;show();};
  $("#next",m).onclick=()=>{EX.i++;show();};
  $("#submit",m).onclick=()=>{
    const left=EX.items.filter(id=>!answered(QBYID[id],EX.states[id])).length;
    const c=$("#confirm",m);
    c.innerHTML=`<div class="panel" style="display:grid;gap:10px;border-color:var(--warn)"><b>确定交卷？</b><span class="muted">${left?`还有 ${left} 题未作答。`:"全部已作答。"}</span>
      <div class="row"><button class="btn primary" id="yes" type="button">交卷并查看成绩</button><button class="btn" id="no" type="button">继续作答</button></div></div>`;
    $("#yes",c).onclick=finishExam; $("#no",c).onclick=()=>c.innerHTML="";
    c.scrollIntoView({behavior:"smooth",block:"center"});
  };
  clearInterval(exTimer);
  const tick=()=>{ const t=$("#timer"); const ms=EX.end-Date.now(); if(ms<=0){ finishExam(); return; }
    if(t){ const mm=Math.floor(ms/60000), ss=Math.floor(ms%60000/1000); t.textContent=`${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`; t.classList.toggle("low",ms<5*60000);} };
  tick(); exTimer=setInterval(tick,1000);
  show();
}
function finishExam(){
  clearInterval(exTimer);
  EX.running=false; EX.finished=true; EX.i=0;
  EX.items.forEach(id=>{ const q=QBYID[id]; if(q.type!=="essay" && answered(q,EX.states[id])) record(q,!!isCorrect(q,EX.states[id])); });
  if(current==="exam") go("exam");
}
function examResult(m){
  const obj=EX.items.map(id=>QBYID[id]).filter(q=>q.type!=="essay");
  const ok=obj.filter(q=>isCorrect(q,EX.states[q.id])).length;
  const byW={}; obj.forEach(q=>{ const r=byW[q.week]||(byW[q.week]={c:0,t:0}); r.t++; if(isCorrect(q,EX.states[q.id])) r.c++; });
  const byT={}; obj.forEach(q=>{ const r=byT[q.type]||(byT[q.type]={c:0,t:0}); r.t++; if(isCorrect(q,EX.states[q.id])) r.c++; });
  m.innerHTML=`<section class="view">
    <div class="panel"><div class="eyebrow">Result</div>
      <div class="row" style="align-items:flex-end;gap:18px;margin-top:6px"><div class="score">${ok} / ${obj.length}</div><div class="muted">客观题正确率 ${obj.length?Math.round(ok/obj.length*100):0}% · 简答题请在下方逐题对照要点自评</div></div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="newex" type="button">再考一次</button><button class="btn" id="towrong" type="button">去错题本</button></div></div>
    <div class="grid2">
      <div class="panel"><h3>按周</h3><div class="scroll-x"><table class="res" style="margin-top:6px"><tr><th>周</th><th>正确</th><th>正确率</th></tr>
        ${Object.keys(byW).sort((a,b)=>a-b).map(w=>`<tr><td>Week ${w}</td><td class="n">${byW[w].c}/${byW[w].t}</td><td class="n">${Math.round(byW[w].c/byW[w].t*100)}%</td></tr>`).join("")}</table></div></div>
      <div class="panel"><h3>按题型</h3><div class="scroll-x"><table class="res" style="margin-top:6px"><tr><th>题型</th><th>正确</th><th>正确率</th></tr>
        ${Object.keys(byT).map(t=>`<tr><td>${TYPE_ZH[t]}</td><td class="n">${byT[t].c}/${byT[t].t}</td><td class="n">${Math.round(byT[t].c/byT[t].t*100)}%</td></tr>`).join("")}</table></div></div>
    </div>
    <div class="panel" style="display:grid;gap:10px;padding:12px 16px"><b>逐题回看</b><div class="navdots" id="dots"></div></div>
    <div class="panel" id="qbox"></div>
    <div class="row" style="justify-content:space-between"><button class="btn" id="prev" type="button">上一题</button><button class="btn" id="next" type="button">下一题</button></div>
  </section>`;
  $("#newex",m).onclick=()=>{EX=null;go("exam");};
  $("#towrong",m).onclick=()=>go("wrong");
  function show(){
    const id=EX.items[EX.i], q=QBYID[id];
    renderQuestion(q,$("#qbox",m),{mode:"exam",review:true,state:EX.states[id],counter:`<span>${EX.i+1} / ${EX.items.length}</span>`});
    const d=$("#dots",m); d.innerHTML="";
    EX.items.forEach((id2,k)=>{ const q2=QBYID[id2]; const b=document.createElement("button"); b.type="button"; b.textContent=k+1;
      if(q2.type!=="essay") b.classList.add(isCorrect(q2,EX.states[id2])?"r":"w"); else b.classList.add("done");
      if(k===EX.i) b.classList.add("cur"); b.onclick=()=>{EX.i=k;show();}; d.appendChild(b); });
    $("#prev",m).disabled=EX.i===0; $("#next",m).disabled=EX.i===EX.items.length-1;
  }
  $("#prev",m).onclick=()=>{EX.i--;show();};
  $("#next",m).onclick=()=>{EX.i++;show();};
  show();
}

/* ---------- WRONG BOOK ---------- */
function viewWrong(m){
  const ids=Object.keys(S.wrong).filter(id=>QBYID[id]).sort((a,b)=>S.wrong[b]-S.wrong[a]);
  m.innerHTML=`<section class="view">
    <div class="panel"><div class="row" style="justify-content:space-between"><h1>错题本</h1>
      <div class="row"><button class="btn primary" id="redo" type="button" ${ids.length?"":"disabled"}>重做全部 ${ids.length} 题</button></div></div>
      <p class="muted" style="margin:6px 0 0">做错的题会自动进来。重做时答对后可以点“移出”。</p></div>
    <div class="panel" id="wl">${ids.length?"":'<div class="empty">还没有错题。去做几道练习或一次模拟考吧。</div>'}</div></section>`;
  $("#redo",m).onclick=()=>go("practice",{ids:shuffle(ids)});
  const wl=$("#wl",m);
  ids.forEach(id=>{
    const q=QBYID[id]; const s=S.stats[id]||{c:0,w:0};
    const d=document.createElement("div"); d.className="wrong-item";
    const ans = q.type==="tf"?(q.a?"True":"False"):q.type==="mcq"?"ABCD"[q.answer]+". "+q.options[q.answer]:q.pairs.map(p=>p[0]+" → "+p[1]).join("；");
    d.innerHTML=`<div class="row" style="justify-content:space-between"><span><span class="tag">W${q.week}</span> <span class="muted">${TYPE_ZH[q.type]} · 对 ${s.c} 次 / 错 ${s.w} 次</span></span>
      <button class="btn small ghost" type="button">移出</button></div>
      <div style="font-weight:500">${esc(q.q||q.title)}</div>
      <details><summary style="cursor:pointer;color:var(--accent);font-weight:600">答案与解析</summary><div style="margin-top:6px"><b>${esc(ans)}</b>${q.exp?`<div class="muted">${esc(q.exp)}</div>`:""}</div></details>`;
    d.querySelector("button").onclick=()=>{ delete S.wrong[id]; save(); d.remove(); };
    wl.appendChild(d);
  });
}

/* ---------- boot ---------- */
const start=(location.hash||"").slice(1);
if(!WEEKS.length){ $("#main").innerHTML='<div class="panel empty">题库数据没有加载。</div>'; }
else go(views[start]?start:"home");
})();
</script>
