<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>MGMT1003 冲刺</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: exam-desk tool — sticky header with countdown + tab rail, one working column (max 860px) below. Highlighter yellow marks what matters. */
:root{
  --paper:#f6f7f4; --card:#ffffff; --ink:#18323f; --ink-soft:#4a5f6a; --line:#d7ddd9;
  --mark:#f7dd3a; --mark-ink:#2a2400; --accent:#1f6f8b; --accent-soft:#e2eef2;
  --good:#2f7d4f; --good-soft:#e1f1e6; --bad:#b4442f; --bad-soft:#f8e4df; --warn:#9a6a00;
  --f-display:"Archivo","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121a1e; --card:#1a2429; --ink:#e4ecee; --ink-soft:#9fb1b8; --line:#2c3a40;
  --mark:#e8cf2c; --mark-ink:#1d1900; --accent:#6cb8d3; --accent-soft:#1d3640;
  --good:#6cc391; --good-soft:#18342a; --bad:#ec8a74; --bad-soft:#3c211b; --warn:#e3b54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121a1e; --card:#1a2429; --ink:#e4ecee; --ink-soft:#9fb1b8; --line:#2c3a40;
  --mark:#e8cf2c; --mark-ink:#1d1900; --accent:#6cb8d3; --accent-soft:#1d3640;
  --good:#6cc391; --good-soft:#18342a; --bad:#ec8a74; --bad-soft:#3c211b; --warn:#e3b54a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
mark,.hl{background:linear-gradient(transparent 45%,var(--mark) 45%);color:inherit;padding:0 .1em}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-inner{max-width:900px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:118%;font-size:1.25rem;letter-spacing:-.01em}
.brand span{background:var(--mark);color:var(--mark-ink);padding:0 .3em;margin-left:.2em;border-radius:3px;font-stretch:100%}
.countdown{font-family:var(--f-mono);font-size:.82rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.countdown b{color:var(--ink);font-size:1rem}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;white-space:nowrap;color:var(--ink-soft);font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mark);font-weight:700}

main{max-width:900px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section.view{display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.6rem;font-weight:800;font-stretch:110%}
h2{font-size:1.2rem;font-weight:750}
h3{font-size:1rem;font-weight:700}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;font-family:var(--f-display)}
.muted{color:var(--ink-soft)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}

.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.ghost{background:none}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.72rem;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:700;vertical-align:middle}

/* overview */
.hero-count{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.big{font-family:var(--f-mono);font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.facts dt{color:var(--ink-soft)} .facts dd{margin:0}
.weekbars{display:grid;gap:8px}
.wb{display:grid;grid-template-columns:3.2rem 1fr 4.5rem;gap:10px;align-items:center;font-size:.88rem}
.wb .name{font-family:var(--f-mono);font-weight:700}
.wb .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;position:relative}
.wb .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.wb .bar i.acc{background:var(--good)}
.wb .num{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.wb button{all:unset;cursor:pointer;display:contents}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--ink-soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* notes */
.week-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.week-head .wk{font-family:var(--f-mono);font-weight:700;background:var(--mark);color:var(--mark-ink);padding:0 .4em;border-radius:3px}
ol.summary{margin:0;padding-left:1.4em;display:grid;gap:6px}
ol.summary li::marker{font-family:var(--f-mono);color:var(--ink-soft);font-size:.8em}
.concepts{display:grid;gap:0}
.concept{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr);gap:4px 16px;padding:10px 0;border-top:1px solid var(--line)}
.concept:first-child{border-top:0}
.concept .t{font-weight:700;font-family:var(--f-display)}
.concept .t small{display:block;font-family:var(--f-body);font-weight:500;color:var(--ink-soft)}
.concept .d{min-width:0}
.concept .d .en{font-size:.9rem;color:var(--ink-soft)}
.xp{display:grid;gap:6px}
.xp .one{font-weight:600}
.xp .ln{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline;font-size:.94rem}
.xp .ln b{font-size:.75rem;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--line);color:var(--ink-soft);white-space:nowrap}
.xp .ln.like b{background:var(--mark);color:var(--mark-ink)}
.xp details{font-size:.86rem;color:var(--ink-soft)}
.xp summary{cursor:pointer;width:max-content}
@media (max-width:560px){.concept{grid-template-columns:1fr}}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}

/* flashcard */
.flash{perspective:1200px;min-height:300px;cursor:pointer}
.flash-inner{position:relative;min-height:300px;transition:transform .45s;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:auto;
  background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-position:0 12px}
.face.back{transform:rotateY(180deg)}
.face .term{font-family:var(--f-display);font-size:1.7rem;font-weight:800;font-stretch:108%;text-align:center}
.face .zh{text-align:center;color:var(--ink-soft)}
.face .hint{position:absolute;bottom:10px;right:14px;font-size:.75rem;color:var(--ink-soft)}
.face .wk{position:absolute;top:10px;left:14px}
.face{justify-content:safe center;padding-top:36px}
@media (max-width:560px){.flash,.flash-inner{min-height:420px}.face .term{font-size:1.35rem}}
@media (prefers-reduced-motion:reduce){.flash-inner{transition:none}}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{padding:10px}
.boxes{display:flex;gap:6px;font-family:var(--f-mono);font-size:.8rem;color:var(--ink-soft);flex-wrap:wrap}

/* questions */
.q-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-soft)}
.q-text{font-size:1.05rem;font-weight:500;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;width:100%}
.opt .k{font-family:var(--f-mono);font-weight:700;color:var(--ink-soft);min-width:1.2em}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:inherit}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feedback{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0}
.feedback.ok{border-color:var(--good);background:var(--good-soft)}
.feedback.no{border-color:var(--bad);background:var(--bad-soft)}
.feedback b{font-family:var(--f-display)}

/* learn mode */
.kp{border-left:4px solid var(--mark);padding:12px 16px;background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:0 12px 12px 0;display:grid;gap:8px}
.kp .kp-t{font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.kp .kp-t small{font-family:var(--f-body);font-weight:500;color:var(--ink-soft);margin-left:8px}
.kp .lbl{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--mark);color:var(--mark-ink);margin-right:6px;vertical-align:middle}
.how{margin:10px 0 0;padding-left:1.4em;display:grid;gap:4px}
.how li::marker{font-family:var(--f-mono);font-weight:700;color:var(--ink-soft)}
.plist{display:grid;gap:8px}
.pitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.pitem .n{font-family:var(--f-mono);font-weight:700;color:var(--ink-soft)}
.pitem .st{font-size:.82rem;color:var(--ink-soft);white-space:nowrap}
.pitem.done .st{color:var(--good)}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchips .chip[disabled]{opacity:.45;cursor:not-allowed}
.match-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.match-row:first-child{border-top:0}
.match-row select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-width:0}
.match-row.right select{border-color:var(--good);background:var(--good-soft)}
.match-row.wrong select{border-color:var(--bad);background:var(--bad-soft)}
.match-row .fix{grid-column:2;font-size:.85rem;color:var(--good)}
@media (max-width:560px){.match-row{grid-template-columns:1fr}.match-row .fix{grid-column:1}}
textarea{width:100%;min-height:170px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);resize:vertical;line-height:1.6}
.points{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.points label{display:flex;gap:8px;align-items:flex-start}
.model{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.95rem}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--mark)}
.score{font-family:var(--f-mono);font-size:2.2rem;font-weight:700}
.timer{font-family:var(--f-mono);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.navdots{display:flex;flex-wrap:wrap;gap:4px}
.navdots button{width:30px;height:28px;border:1px solid var(--line);background:var(--card);border-radius:5px;font-family:var(--f-mono);font-size:.72rem;padding:0}
.navdots button.done{background:var(--accent-soft);border-color:var(--accent)}
.navdots button.cur{outline:2px solid var(--ink)}
.navdots button.r{background:var(--good-soft);border-color:var(--good)}
.navdots button.w{background:var(--bad-soft);border-color:var(--bad)}
.wrong-item{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.wrong-item:first-child{border-top:0}
.empty{text-align:center;padding:30px 10px;color:var(--ink-soft)}
.theme-toggle{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.78rem;color:var(--ink-soft)}
table.res{width:100%;border-collapse:collapse;font-size:.9rem}
table.res th,table.res td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.res td.n{font-family:var(--f-mono);text-align:right}
.scroll-x{overflow-x:auto}
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand-row">
      <div class="brand">MGMT1003<span>冲刺</span></div>
      <div class="row" style="gap:10px">
        <div class="countdown" id="countdown"></div>
        <button class="theme-toggle" id="themeBtn" type="button">主题</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-view="home">总览</button>
      <button role="tab" data-view="learn">边练边学</button>
      <button role="tab" data-view="notes">笔记要点</button>
      <button role="tab" data-view="cards">闪卡</button>
      <button role="tab" data-view="practice">分题练习</button>
      <button role="tab" data-view="exam">模拟考试</button>
      <button role="tab" data-view="wrong">错题本</button>
    </nav>
  </div>
</header>
<main id="main"></main>

<script>
window.MGMT_DATA=[{
  "week": 1,
  "title": "Introduction to Management, People and Organisations",
  "titleZh": "管理、人员与组织导论",
  "summary": [
    "MGMT1003 三个分析层次：Individual（管理者本人：人格、自我认识、决策、角色）→ Interpersonal（沟通、动机、团队、影响力、领导）→ Organisational（组织文化、集体问题）",
    "There is no single quality that defines a good manager（不存在单一的管理者神属性）",
    "Effective Management = Technical Competence + Judgement + Integrity + Ability to Work with People",
    "Technical competence is necessary, but not sufficient：专业强不代表会沟通、分配任务、解决冲突、激励、作困难决定",
    "Judgement：在信息不完整、情况复杂时作出合理决定；管理问题没有数学题式的唯一答案",
    "Integrity：诚实、公平、守诺、言行一致、承担责任、不滥用权力；短期达标但失信，团队最终失去信任",
    "Listening ≠ Agreeing with everyone ≠ Avoiding decisions；Listening = Gathering information before judgement，经理仍须作最终决定并承担责任",
    "Effective management starts with you：Know yourself、Listen to feedback、Build on your strengths、Do what you say you will do、Build a network of support、Be positive",
    "Career Progression Trap：让人在技术岗成功的能力不一定能转移到管理岗",
    "关键角色转变：Doing the work yourself → Achieving work through other people（对团队整体结果负责，依靠沟通、授权与影响力）",
    "新经理四个优先事项（奇数项 1、3、5、7）：Care for and develop people；Network with peers；Talk with and listen to subordinates；Clarify the boss's expectations",
    "正确顺序：Understand → Coordinate → Decide → Change；不要急着展示权力、立刻改制度",
    "高使用频率 + 高训练需求：Interpersonal skills、Generative thinking、Strategic and systems skills、Managing decision-making processes、Managing strategy and innovation；另有 Managing human capital",
    "结论：Management is largely about people skills——技术帮你理解工作，判断力帮你决策，诚信帮你获得信任，人际能力帮你带领团队"
  ],
  "concepts": [
    {"term": "Individual level", "zh": "个体层次", "def": "Level of analysis focusing on the manager as a person: personality, self-knowledge, decision style and managerial roles.", "defZh": "研究管理者本人，如人格、自我认识、决策方式和管理角色。", "one": "把管理者本人当作分析对象，看他的性格、自我认识和决策方式。", "eg": "研究一位经理为什么总凭直觉拍板、压力一大就容易发火。", "like": "像给管理者本人做体检，只看他自己这台「发动机」。"},
    {"term": "Interpersonal level", "zh": "人际层次", "def": "Level of analysis focusing on interactions between people: communication, motivation, teamwork, influence and leadership.", "defZh": "研究人与人之间的互动：沟通、动机、团队合作、影响力和领导。", "one": "关注人与人之间如何互动，如沟通、激励、团队合作和领导。", "eg": "分析经理如何在会上说服两名意见不合的组员一起推进项目。", "like": "像看双人舞，重点不在某一个人，而在两人如何配合。"},
    {"term": "Organisational level", "zh": "组织层次", "def": "Level of analysis focusing on how the whole organisation operates, e.g. culture and collective problems.", "defZh": "研究整个组织如何运行，如组织文化和集体问题。", "one": "把整个组织当成对象，看文化和集体层面的问题如何形成和运作。", "eg": "研究一家公司为什么人人报喜不报忧，形成不敢上报坏消息的文化。", "like": "像观察整片森林的生态，而不是只盯着一棵树。"},
    {"term": "Effective management", "zh": "有效管理", "def": "A combination of technical competence, judgement, integrity and the ability to work with people; no single quality defines it.", "defZh": "技术胜任力 + 判断力 + 诚信 + 与人共事能力的组合，没有单一决定性特质。", "one": "好经理不靠单一天赋，而是技术、判断、诚信和人际能力缺一不可的组合。", "eg": "技术最强却常失信的组长，短期能达标，团队最终仍会失去信任。", "like": "像四条腿的桌子，少了任何一条腿都站不稳。"},
    {"term": "Technical competence", "zh": "技术胜任力", "def": "The knowledge and skills needed to perform specialist work; necessary but not sufficient for managing.", "defZh": "完成专业工作的知识和技能；让经理理解团队在做什么，但只是必要条件而非充分条件。", "one": "懂专业、会干活的能力；让你看懂团队在做什么，但光有它管不好人。", "eg": "公司最强的程序员升任组长后，仍要学会分配任务、处理冲突和激励组员。", "like": "像驾照：开车必须有，但有驾照不等于会带车队。"},
    {"term": "Judgement", "zh": "判断力", "def": "The ability to make reasonable decisions when information is incomplete and situations are complex.", "defZh": "在信息不完整、情况复杂时综合信息作出合理决定，并承担结果。", "one": "信息不全、情况复杂时，仍能权衡各种可能并作出合理决定。", "eg": "员工表现下滑，经理先判断是能力、目标不清、工作量过大还是个人问题，再行动。", "like": "像医生在化验结果不全时，凭症状作出最合理的诊断。"},
    {"term": "Integrity", "zh": "正直与诚信", "def": "Honesty, fairness, keeping promises, consistency between words and actions, taking responsibility and not abusing power.", "defZh": "诚实、公平、守诺、言行一致、承担责任、不滥用权力；是团队信任的基础。", "one": "说真话、守承诺、对人一视同仁、不滥用权力，是团队信任的地基。", "eg": "经理总承诺周五前回复提案却失约，还对不同员工执行不同考勤标准。", "like": "像房子的地基：平时看不见，一旦塌了整栋楼都不稳。"},
    {"term": "Ability to work with people", "zh": "与人共事的能力", "def": "Communication, listening, motivating, managing conflict, flexibility, giving clear instructions, understanding others and building relationships.", "defZh": "沟通、倾听、激励、处理冲突、灵活、清晰指示、理解他人、建立关系；因人而异调整方式。", "one": "会沟通、倾听、激励和化解冲突，并针对不同的人调整带人方式。", "eg": "对新人给清楚的步骤，对老手只讲目标，放手让他自己安排。", "like": "像好教练：对每个队员说不同的话，让全队一起赢。"},
    {"term": "Listening", "zh": "倾听", "def": "Gathering and understanding information before judgement; not agreeing with everyone and not avoiding decisions.", "defZh": "在判断前收集和理解信息；≠ 同意所有人，≠ 逃避决策，经理仍须作最终决定。", "one": "倾听是在作决定前收集信息，不是谁说都同意，也不是借机逃避拍板。", "eg": "十个组员给出十五种方案，经理全听完、判断取舍，最后自己拍板并负责。", "like": "像法官先认真听双方陈述，但判决仍由法官自己下。"},
    {"term": "Self-awareness", "zh": "自我觉察", "def": "Understanding one's own strengths, weaknesses, values, decision style, stress reactions and impact on others.", "defZh": "了解自己的优劣势、价值观、决策与压力反应、对他人的影响；缺乏时容易把自己的问题误认为员工的问题。", "one": "清楚自己的长处短处、价值观、压力反应，以及自己给别人带来的影响。", "eg": "经理自认「直接、高效」，员工感受到的却是「强硬、不允许提问」。", "like": "像先照镜子看清自己脸上的污点，才不会怪别人脏。"},
    {"term": "Listen to feedback", "zh": "听取反馈", "def": "Using others' feedback to uncover blind spots, unconscious bias and the impact of one's behaviour, while judging which criticism is valuable.", "defZh": "发现沟通盲点、偏见和行为影响；不等于接受所有批评，而是判断其中有价值的信息。", "one": "借别人的眼睛发现自己的盲点，并分辨哪些批评真正有价值。", "eg": "同事指出你开会总打断别人，你核实后改掉，而对无根据的抱怨不必照单全收。", "like": "像倒车时看后视镜，能看到自己看不到的死角。"},
    {"term": "Build on your strengths", "zh": "发挥优势", "def": "Develop core strengths into stable capabilities while controlling the risks created by weaknesses.", "defZh": "把核心优势发展为稳定能力，同时控制弱点带来的风险，而非要求样样第一。", "one": "把核心优势练成稳定能力，同时给弱点设防，而不是追求样样第一。", "eg": "擅长分析但不擅表达的人，继续做强分析，开会前提前准备好沟通结构。", "like": "像前锋专心练射门，同时把防守练到不拖后腿。"},
    {"term": "Do what you say you will do", "zh": "言出必行", "def": "Credibility built through consistent behaviour over time, such as keeping small promises and applying rules equally.", "defZh": "信任靠反复兑现小承诺累积，而不是靠一句「请相信我」。", "one": "信任来自长期兑现大大小小的承诺，而不是嘴上说「相信我」。", "eg": "经理说好周五给反馈就准时给，考勤规则对所有人一样执行。", "like": "像存钱：每兑现一次承诺，就往信任账户存进一笔。"},
    {"term": "Career progression trap", "zh": "职业晋升陷阱", "def": "Being promoted for technical excellence into a managerial role whose success depends on different, people-oriented abilities.", "defZh": "因技术出色被提拔，但管理岗需要的是另一套能力，原有能力不一定能转移。", "one": "因技术好被提拔当经理，却发现管理需要的是另一套和人打交道的能力。", "eg": "最强的程序员当上组长后仍自己写大部分代码、很少授权，团队士气低落。", "like": "像让明星球员直接当教练，踢得好不等于带得好。"},
    {"term": "Individual contributor vs Manager", "zh": "个人贡献者与经理", "def": "An individual contributor does the work and is responsible for personal output; a manager achieves work through others and is responsible for team results.", "defZh": "前者自己完成工作、对个人产出负责；后者通过他人完成工作、对团队结果负责，依靠沟通、授权与影响力。", "one": "个人贡献者靠自己干出成绩；经理要通过别人完成工作，对团队结果负责。", "eg": "当员工时写好自己的报告就行；当经理后要分工、授权，确保全组按时交付。", "like": "像从乐手变成指挥：不再自己演奏，而是让整个乐团奏好。"},
    {"term": "Network with peers", "zh": "与同级建立关系", "def": "A new-manager priority: building lateral relationships to obtain cross-department information, resources and cooperation.", "defZh": "新经理优先事项之一；建立横向关系获取跨部门信息、资源与协作，避免部门成为孤岛。", "one": "主动和其他部门的同级经理建立关系，换取信息、资源和协作。", "eg": "新运营经理的项目总因另一部门迟迟不给数据而卡住，需要先和对方负责人搭好关系。", "like": "像平时和邻居修好小路，需要借东西时随时走得通。"},
    {"term": "Clarify the boss's expectations", "zh": "弄清上级期待", "def": "A new-manager priority: confirming goals, priorities, performance measures, decision authority and escalation issues with one's superior.", "defZh": "明确上级希望完成什么、优先级、如何衡量绩效、决策权限和哪些问题需上报。", "one": "向上级问清目标、优先级、考核方式、决策权限和哪些事必须上报。", "eg": "新经理上任就问上司：部门绩效怎么衡量？哪些事我能自己决定？", "like": "像出发前先和乘客确认目的地，免得一路开错方向。"},
    {"term": "Managing human capital", "zh": "管理人力资本", "def": "Arranging, developing and using people according to their knowledge, skills, experience and potential.", "defZh": "根据员工知识、技能、经验和潜力合理安排、培养和使用人员；属于高训练需求项目。", "one": "根据每个人的知识、技能、经验和潜力，把人放对位置并持续培养。", "eg": "把擅长沟通的员工安排去对接客户，同时给有潜力的新人配导师。", "like": "像下棋时让每颗棋子走到最能发挥作用的格子。"},
    {"term": "Generative thinking", "zh": "生成性思考", "def": "Producing new ideas and solutions; a skill that is frequently used and still rated as needing more training.", "defZh": "产生新想法和解决方案；属于高使用频率 + 高训练需求的技能。", "one": "能想出新点子和新解决方案的能力，经理常用却普遍觉得还需加强。", "eg": "预算被砍后，经理想出跨部门共享设备的办法，而不是只会砍项目。", "like": "像厨师用冰箱里剩下的食材变出一道新菜。"}

  "essay": [
    {"q": "Case: Priya was the top software engineer in her company and has just been promoted to lead a team of eight developers. Three months later, she still personally handles the hardest coding tasks and often rewrites her team members' code at night. She has not held one-on-one meetings, has skipped the monthly meeting with other department leads, and is unsure what her director expects from the team. Deadlines are slipping and two developers say they feel ignored. Using concepts from this week, diagnose the problem and recommend what Priya should do.",
     "points": ["Identify the career progression trap: technical excellence does not automatically transfer to management", "Explain the key role change from doing the work yourself to achieving work through other people (responsibility for team results, delegation, influence)", "Point out that technical competence is necessary but not sufficient; she needs judgement, integrity and people skills", "Apply the four new-manager priorities: care for and develop people, network with peers, listen to subordinates, clarify the boss's expectations", "Recommend the sequence Understand → Coordinate → Decide → Change, plus self-awareness and seeking feedback"],
     "model": "Priya is caught in the career progression trap. She was promoted because of her technical excellence, but the abilities that made her a successful individual contributor do not automatically transfer to a managerial role. Her core problem is that she has not made the key role change from doing the work herself to achieving work through other people. By taking the hardest tasks and rewriting others' code, she remains focused on personal output rather than team results, which leaves members feeling ignored and limits their development.\n\nTechnical competence is necessary but not sufficient. Effective management also requires judgement, integrity and the ability to work with people. Priya should focus on the four highest-priority actions for new managers. First, care for and develop people: hold one-on-ones, identify each developer's strengths and delegate meaningful work. Second, talk with and listen to subordinates to understand current difficulties and what is working before changing anything. Third, network with peers by attending the department-lead meetings, since cross-department coordination and resources affect deadlines. Fourth, clarify her director's expectations about priorities, how performance is measured and her decision authority.\n\nShe should follow the order Understand → Coordinate → Decide → Change, and build self-awareness by asking for feedback on how her behaviour affects the team. Management is largely about people skills, and her success now depends on whether her team can succeed together."},
    {"q": "Case: Daniel joins a logistics company as a new warehouse manager from outside the organisation. On his first day he announces, \"I'm in charge now,\" and immediately changes the rostering system and several safety procedures without consulting staff. When supervisors raise concerns, he says listening to everyone would only slow things down. Staff have started withholding information about problems, and a peer manager comments that Daniel seems harsh, which he dismisses. Using concepts from this week, evaluate Daniel's approach and explain what he should do differently.",
     "points": ["Identify the error of showing authority too early and changing rules before understanding the situation", "Explain risks: resistance, destroying effective processes, staff withholding honest information, poor decisions", "Clarify that listening is gathering information before judgement, not agreeing with everyone or avoiding decisions", "Link to self-awareness and listening to feedback (gap between how he sees himself and how others see him)", "Recommend Understand → Coordinate → Decide → Change and the four new-manager priorities"],
     "model": "Daniel has made the classic new-manager mistake of trying to prove he is in charge by displaying power and changing rules immediately. The lecture warns that showing authority too early can cause team resistance, destroy processes that were working well, make members unwilling to provide honest information, and lead the manager to make poor decisions without understanding the situation. All of these are already visible: staff are withholding information about problems.\n\nDaniel also misunderstands listening. Listening does not mean agreeing with everyone or avoiding decisions; it means gathering information before judgement. He can still make the final decision and take responsibility, but only after hearing the supervisors, understanding which concerns are relevant, and judging what is reasonable.\n\nHe also lacks self-awareness. He likely sees himself as decisive, while others experience him as harsh. Listening to feedback would help him identify this blind spot.\n\nDaniel should follow the sequence Understand → Coordinate → Decide → Change. He should talk with and listen to subordinates about what works and what problems are unresolved, care for and develop his people, network with peer managers instead of dismissing them, and clarify his boss's expectations about priorities and his decision authority. Only then should he change procedures. This approach would rebuild trust, which depends on integrity and consistent behaviour, and reflects that management is largely about people skills."}
  ]

  "concepts": [

    {"term": "Direction / Intensity / Persistence", "zh": "方向／强度／持续性", "def": "The three components of motivation: which behaviour is chosen, how much effort is invested, and how long effort is sustained.", "defZh": "动机三要素：选择做什么、投入多少、坚持多久；不能只说一个人「有动力／没动力」。", "one": "动机要分三面看：选择做什么、投入多大力气、能坚持多久。", "eg": "学生选择复习而非打游戏（方向），每天学三小时（强度），一直坚持到考完（持续）。", "like": "像开车：方向盘定去哪，油门定多快，油箱定能开多远。"},
    {"term": "Ability–Motivation–Opportunity", "zh": "能力—动机—机会", "def": "Performance and behaviour depend on whether people can (ability), will (motivation) and have the resources and conditions (opportunity) to perform.", "defZh": "表现由三者共同决定；缺资源是 opportunity 问题，发奖金无法解决。", "one": "表现取决于会不会、愿不愿、有没有条件，三者缺一都不行。", "eg": "员工愿意写报告也有分析能力，但公司不给他开放所需数据，报告只能拖延。", "like": "像烤蛋糕：要有手艺、想做，还得有烤箱和面粉。"},
    {"term": "Forced ranking", "zh": "强制排名", "def": "A system (e.g. IBM, GE) placing employees into fixed proportions such as top 20%, middle 70% and bottom 10%, with the bottom group facing dismissal.", "defZh": "初期可能提升生产力但收益递减；必须人为制造末位；假设评价绝对准确；损害公平感、合作和信息分享。", "one": "按固定比例给员工排名，末位必须有人；短期可能见效，但伤公平与合作。", "eg": "IBM、GE 曾把员工按 20%、70%、10% 分三档，员工因此不愿把好方法分享给同事。", "like": "像抢椅子游戏：不管大家多优秀，总得有人出局。"},
    {"term": "Compliance vs Commitment", "zh": "服从与承诺", "def": "Rewards and punishments change what people do but not necessarily why, producing compliance rather than genuine commitment.", "defZh": "奖惩针对行为而非原因，带来的往往是服从而非真正认同目标。", "one": "奖惩只能让人照着做（服从），不一定让人真心认同目标（承诺）。", "eg": "员工因为有人检查才按流程写报告，没人看时就草草了事。", "like": "像被父母逼着练琴，父母一出门就停；真爱弹的人会自己练。"},
    {"term": "Autonomy, Mastery, Purpose", "zh": "自主、精通、目的", "def": "Factors that matter once pay is adequate: control over how/when/with whom to work, progress in meaningful challenges, and contribution beyond oneself.", "defZh": "工资合理后更重要的三因素；大致对应 SDT 的 autonomy、competence、relatedness/beneficiary contact。", "one": "工资给够之后，更能激励人的是自主掌控、不断进步和做有意义的事。", "eg": "工资合理的工程师更在意能自己选技术方案、学到新本事、看到产品帮到用户。", "like": "像玩喜欢的游戏：自己操作、不断升级、为队伍赢下比赛。"},
    {"term": "Prepotency", "zh": "优势需要原则", "def": "Maslow's idea that an activated need dominates attention until it is reasonably satisfied.", "defZh": "被激活的需要主导注意力直到合理满足；管理含义：高层需要无法补偿底层需要的严重缺失。", "one": "被激活的需要会霸占注意力直到基本满足；高层需要补不了底层缺口。", "eg": "连房租都付不起的员工，给再多自主权和意义感也难让他安心投入。", "like": "像饿肚子时满脑子都是吃的，再好的电影也看不进去。"},
    {"term": "Intrinsic motivation", "zh": "内在动机", "def": "Motivation in which satisfaction lies in the activity itself, e.g. interest, curiosity, enjoyment, getting better.", "defZh": "满足感来自活动本身；对质量的预测通常优于对数量的预测。", "one": "因为事情本身有趣、好奇或想变得更熟练而去做，满足感来自活动本身。", "eg": "一个人学心理学，是因为他真的想理解人类行为。", "like": "像为了好玩去打球，没人给钱也愿意上场。"},
    {"term": "Extrinsic motivation", "zh": "外在动机", "def": "Motivation in which satisfaction comes from external outcomes of the task, e.g. pay, grades, praise, promotion, awards.", "defZh": "满足感来自任务后的外部结果；与内在动机的区别不是努力程度，而是原因来源。", "one": "为了工资、分数、表扬、晋升等外部结果而做，满足感来自事后的回报。", "eg": "一个人学心理学，主要是为了拿到 HD 成绩。", "like": "像为了零花钱才去洗碗，不给钱就不洗。"},
    {"term": "Self-Determination Theory (SDT)", "zh": "自我决定理论", "def": "Sustaining intrinsic motivation requires satisfying three basic psychological needs: autonomy, competence and relatedness.", "defZh": "Autonomy：我选择和掌控；Competence：我能做好并进步；Relatedness：我与他人有真实连接。", "one": "要保持内在动机，需要满足三种心理需要：自主、胜任和归属。", "eg": "让员工自己安排工作顺序（自主），给适度挑战和指导（胜任），并让他融入团队（归属）。", "like": "像植物需要阳光、水和土壤，缺一样就长不好。"},
    {"term": "Undermining effect", "zh": "削弱效应", "def": "Tangible rewards that are expected, contingent on task engagement and experienced as controlling can reduce intrinsic interest.", "defZh": "可预期、以参与任务为条件、感到被控制的有形奖励会削弱内在兴趣；口头表扬通常不会。", "one": "事先约定、做了就给、让人感到被控制的物质奖励，会削弱原本的兴趣。", "eg": "爱画画的孩子被约定「画一张给一块钱」，后来不给钱就不想画了。", "like": "像把爱好变成打卡任务，乐趣慢慢变成了差事。"},
    {"term": "Motivators", "zh": "激励因素", "def": "Herzberg's job-content factors (achievement, recognition, responsibility, the work itself, growth and advancement) that produce satisfaction.", "defZh": "存在→满意；缺失→没有满意（不一定是不满）。", "one": "来自工作内容本身的因素，如成就、认可、责任和成长，能真正带来满意。", "eg": "医院让资深护士自主安排病人护理并对结果负责，她们更投入工作。", "like": "像菜本身的味道：做得好吃，客人才会真心喜欢。"},
    {"term": "Hygiene factors", "zh": "保健因素", "def": "Herzberg's job-context factors (e.g. pay, policies, working conditions, supervision) whose deficiency produces dissatisfaction.", "defZh": "修复只能消除不满（no dissatisfaction），不能创造满意和动机。", "one": "工资、政策、环境、监督等外围条件，做不好会不满，做好了也只是不抱怨。", "eg": "公司修好空调、按时发薪后，抱怨停了，但员工并没有更有干劲。", "like": "像餐厅的卫生：脏了客人会走，干净却不会让人专程来吃。"},
    {"term": "Goal-setting theory", "zh": "目标设定理论", "def": "Well-set goals direct attention, increase effort and sustain action; effective goals are specific, challenging but not impossible, accepted and supported by feedback.", "defZh": "Lecture 中实证支持最强的理论；「Do your best」通常不如具体且困难的目标。", "one": "具体、有挑战但做得到、被接受且有反馈的目标，最能引导和维持努力。", "eg": "与其说「尽力而为」，不如说「本月把客户处理时间降低 15%」。", "like": "像跳高横杆：高度明确又够得着，人才会全力去跳。"},
    {"term": "Goals gone wrong", "zh": "目标的副作用", "def": "Side effects of goals: attention narrows, horizons shorten, risk-taking rises and ethics erode.", "defZh": "只关注被测量部分、短期主义、接近失败时过度冒险、修改数字隐瞒问题。", "one": "目标也有副作用：只盯考核指标、只顾短期、冒险加大，甚至造假。", "eg": "银行员工差一点完成季度目标，就把未完成的单子记成已完成。", "like": "像药物：对症有效，剂量不对就会出副作用。"},
    {"term": "Expectancy", "zh": "期望", "def": "The belief that effort will lead to high performance (Effort → Performance).", "defZh": "受能力、培训、自信、资源、任务难度影响；「我做不到」= Expectancy 低。", "one": "相信「我努力就能做好」的程度，受能力、培训、资源和任务难度影响。", "eg": "「即使我复习，我也完全看不懂题目。」这就是 Expectancy 低。", "like": "像面对一堵墙：觉得爬得上去，才会开始爬。"},
    {"term": "Instrumentality", "zh": "工具性", "def": "The belief that high performance will lead to outcomes (Performance → Outcomes).", "defZh": "「做得好也没用」= Instrumentality 低；需建立可信的绩效—结果联系。", "one": "相信「做得好就会得到相应结果」的程度；结果不可信，人就不卖力。", "eg": "销售员觉得无论业绩多好，晋升总是给老板喜欢的人。", "like": "像常常吞币不出货的售货机，投过几次就不想再投。"},
    {"term": "Valence", "zh": "效价", "def": "How desirable the outcome is to the individual.", "defZh": "「这个奖励对我没价值」= Valence 低；同一结果对不同人价值不同。", "one": "这个结果对本人有多大吸引力；同一奖励对不同人价值不同。", "eg": "公司奖励多一周年假，但正在攒钱买房的员工只在乎钱，所以不为所动。", "like": "像用骨头奖励猫：奖品再大，对方不爱也没用。"},
    {"term": "Job enlargement vs Job enrichment", "zh": "工作扩大与工作丰富化", "def": "Enlargement horizontally adds more tasks at the same level without more authority; enrichment vertically adds responsibility, autonomy and growth.", "defZh": "Enlargement ≠ Enrichment：前者加任务不加权，后者把 Herzberg motivators 嵌入工作。", "one": "扩大化是横向多加同级任务；丰富化是纵向增加责任、自主和成长。", "eg": "录入员加做收集和清洗数据是扩大化；护士自主安排护理并对结果负责是丰富化。", "like": "像多给你几样菜去切，和直接让你当主厨定菜单的区别。"},
    {"term": "Job Characteristics Model (JCM)", "zh": "工作特征模型", "def": "Five core job dimensions (skill variety, task identity, task significance, autonomy, feedback) create three psychological states that lead to motivation, quality, satisfaction and lower absenteeism and turnover.", "defZh": "Meaningfulness ← 前三项；Responsibility ← Autonomy；Knowledge of results ← Feedback；受 growth-need strength 调节。", "one": "五个工作特征带来三种心理状态，进而提高动机、质量和满意度，减少离职。", "eg": "厨师从设计菜单到做完整道菜，比只反复切一种食材的帮厨更有意义感。", "like": "像好玩的游戏：任务多样、剧情完整、能自己选、即时显示得分。"}
  ],
  "tf": [
    {"q": "According to Herzberg, removing problems with hygiene factors will create job satisfaction.", "a": false, "exp": "修好保健因素只能让人不再不满，真正的满意要靠成就、认可这类激励因素。"},
    {"q": "Motivation consists of three components: direction, intensity and persistence.", "a": true, "exp": "动机确实有三个部分：方向是选择做什么，强度是投入多少，持续性是坚持多久。"},
    {"q": "If an employee performs poorly, it can be concluded that the employee lacks motivation.", "a": false, "exp": "表现差不一定是没动力，也可能是能力不够，或者缺资源、权限这类机会问题。"},
    {"q": "Punishment can suppress unwanted behaviour, but it does not teach the employee what to do instead.", "a": true, "exp": "惩罚只能压住不想要的行为，教不会员工该怎么做；监督一撤，旧行为可能回来。"},
    {"q": "The productivity gains from forced ranking tend to increase each year as more weak performers are removed.", "a": false, "exp": "收益是递减的：明显较弱的人淘汰后，制度仍要硬凑出末位 10%，收益不会逐年增加。"},
    {"q": "A meta-analysis cited in the lecture found financial incentives correlated about .34 with performance quantity but had no significant relationship with quality.", "a": true, "exp": "财务奖励与数量的相关约 .34，与质量无显著关系，所以更适合简单、可测量的数量型任务。"},
    {"q": "Research across 123 countries supported both Maslow's needs and the fixed order in which they must be satisfied.", "a": false, "exp": "研究支持这些需要能预测幸福感，但不支持固定顺序；人可以同时追求多种需要。"},
    {"q": "Verbal praise typically undermines intrinsic motivation in the same way as expected tangible rewards.", "a": false, "exp": "口头表扬通常不会削弱内在动机，有时反而能提高；会削弱的是可预期的有形奖励。"},
    {"q": "Goal-setting theory has the strongest empirical support of the motivation theories covered in the lecture.", "a": true, "exp": "在本周讲到的动机理论里，目标设定理论的实证支持是最强的。"},
    {"q": "Under goal-setting theory, the more difficult a goal is, the better performance will be, without limit.", "a": false, "exp": "目标适度困难时表现会上升，但超出能力或承诺的极限后，表现会快速下降。"},
    {"q": "In Expectancy Theory, if any one of expectancy, instrumentality or valence is very low, overall motivation will fall.", "a": true, "exp": "动机是期望、工具性和效价三者相乘的结果，任何一环很低，整体动机都会掉下来。"},
    {"q": "Job enlargement is a vertical change that increases an employee's decision-making authority.", "a": false, "exp": "工作扩大化是横向加任务，决策权基本不变；纵向增加责任和自主权的是工作丰富化。"},
    {"q": "The Job Characteristics Model works best for employees with high growth-need strength.", "a": true, "exp": "成长需要强度是调节变量：不是每个人都同样想要高复杂度和高责任的工作。"},
    {"q": "The lecture cited evidence that pay level explains only about 2% of the variance in job satisfaction.", "a": true, "exp": "工资水平只解释约 2% 的满意度差异，但工资不足或不公平仍会引起不满和安全感问题。"}
  ],

    {"q": "A sales representative says: \"No matter how well I perform, promotions always go to the boss's favourites.\" Which link is broken?",

  "essay": [
    {"q": "Case: A call centre has low effort and high absenteeism. Management responds by raising the monthly bonus, but nothing changes. Interviews reveal several issues: new staff say they were never trained on the complaints system and \"can't resolve calls however hard we try\"; experienced staff say bonuses seem to go to whoever the supervisor likes; and many staff say they only want more flexible shifts rather than money. Using motivation theories from this week, diagnose why the bonus failed and recommend what management should do.",
     "points": ["First check whether it is a motivation problem: ability and opportunity issues (lack of training) before motivation", "Apply Expectancy Theory: low expectancy (no training), low instrumentality (bonus allocation seen as favouritism), low valence (staff value flexible shifts not money)", "Explain that a bigger bonus cannot fix a broken E or I link, and rewards cannot fix underlying problems", "Recommend training and resources, transparent performance–reward links, and outcomes staff value (e.g. flexibility/autonomy)", "Optionally link to Herzberg or SDT: pay is not the only lever; autonomy and competence support motivation"],
     "model": "The bonus failed because management treated the problem as one of reward size, when the real problems lie elsewhere. Performance depends on ability, motivation and opportunity. New staff have not been trained on the complaints system, so part of the issue is ability and opportunity rather than motivation.\n\nExpectancy Theory pinpoints where the chain is broken. Motivation = Expectancy × Instrumentality × Valence, so if any link is weak, overall motivation falls. Expectancy is low for new staff because they believe effort will not lead to resolved calls. Instrumentality is low for experienced staff because they believe bonuses depend on the supervisor's favouritism rather than performance. Valence is low because many staff do not value money as much as flexible shifts. Raising the bonus only increases the size of a reward that is either unreachable, not credibly linked to performance, or not wanted.\n\nManagement should first provide training and resources to raise expectancy. Second, it should make the performance–reward link transparent and based on clear measures to restore instrumentality. Third, it should offer outcomes staff actually value, such as more control over shift scheduling, which also supports autonomy under SDT. Finally, managers should remember that rewards change what people do, not why, and cannot fix underlying problems in training, processes or supervision."},
    {"q": "Case: A design agency wants to boost output. The CEO proposes paying designers a bonus for each concept they submit, and ranking all designers every quarter, with the bottom 10% put on a performance plan and possibly dismissed. Senior designers warn this could hurt quality and teamwork. Using concepts from this week, evaluate the CEO's proposal and recommend a better approach.",
     "points": ["Rewards must match the task: incentives raise quantity (r ≈ .34) but not quality; creative work suffers when attention narrows to measured output", "Undermining effect: expected, contingent, controlling rewards may reduce intrinsic motivation; selection risk", "Forced ranking problems: punishment suppresses rather than teaches, diminishing returns, assumes accurate appraisal, reduces fairness, cooperation and information sharing", "Rewards and punishment produce compliance rather than commitment", "Recommend pay fairly, then use job design (enrichment, autonomy, feedback), well-designed goals and informational recognition"],
     "model": "The CEO's proposal relies on reward and punishment, which the lecture shows are poorly suited to this context. Design is a complex, creative task. Financial incentives correlate about .34 with performance quantity but have no significant relationship with quality. Paying per concept will narrow attention to the measured output, so designers may submit many weak concepts while neglecting exploration, refinement and collaboration. Because rewards are expected, contingent on task engagement and likely experienced as controlling, they may also undermine designers' intrinsic motivation, and an environment paying only for measurable output may attract reward-focused people and lose those who love the work.\n\nForced ranking adds further risks. Punishment suppresses behaviour but does not teach what good work looks like. Its gains diminish over time, it forces someone into the bottom 10% even if everyone performs well, and it assumes appraisals are perfectly accurate. Most importantly, competition for ranking reduces perceived fairness, cooperation and information sharing, which is damaging in team-based creative work. The result would be compliance, not commitment.\n\nA better approach is to pay fairly and then stop expecting pay to do all the work. The agency should design the job, not just the reward: enrich roles with autonomy, responsibility and client feedback, as the Job Characteristics Model suggests. It can set specific, challenging, accepted goals supported by feedback, while monitoring side effects, and use sincere recognition that signals competence rather than control."},
    {"q": "Case: In a hospital records department, administrative officers each perform one narrow task, such as scanning documents, all day. Turnover is high and staff describe the work as \"pointless\". The manager plans to rotate staff between scanning, filing and data entry every week, believing this will solve the problem. Using job design concepts, evaluate this plan and recommend improvements.",
     "points": ["Distinguish job rotation, enlargement and enrichment; rotation changes tasks but not the jobs themselves or decision authority", "Apply JCM: low skill variety, task identity, task significance, autonomy and feedback lead to low meaningfulness, responsibility and knowledge of results", "Explain expected outcomes of a better design: higher internal motivation, quality, satisfaction, lower absenteeism and turnover", "Recommend enrichment: whole pieces of work, contact with beneficiaries, discretion, feedback", "Note growth-need strength as moderator and social characteristics (interdependence, feedback from others, social support)"],
     "model": "The manager's plan is job rotation: moving employees between existing jobs. Rotation adds variety and reduces monotony, but each job itself remains unchanged, and staff still have no more decision-making authority. The lecture notes that rotation and enlargement often have limited effects for exactly this reason.\n\nThe Job Characteristics Model explains why staff find the work pointless. Their jobs score low on skill variety, task identity (they never complete a whole piece of work), task significance (they cannot see how records affect patients), autonomy and feedback. As a result, they lack experienced meaningfulness, experienced responsibility and knowledge of results, which leads to low motivation, low satisfaction and high turnover.\n\nThe manager should use job enrichment instead. Officers could take ownership of complete patient files or a specific ward's records from receipt to finalisation, increasing task identity and skill variety. Showing how accurate records support clinical staff and patients would raise task significance. Giving officers discretion over how they organise their work increases autonomy, and quality dashboards provide feedback. These changes should increase internal motivation, quality and satisfaction while reducing absenteeism and turnover.\n\nThe manager should also recognise that the model works best for employees with high growth-need strength, so preferences may vary. Social characteristics such as interdependence, feedback from others and social support also matter, so building team connections can further strengthen motivation."}
  ]
},

  "essay": [
    {"q": "Case: A national retail chain wants to speed up hiring. HR proposes that all applicants complete a free online personality-type test, and only those classified as 'Extraverted–Judging' types will be interviewed, because the regional manager believes \"those types make the best store staff.\" The manager also wants to hire people who \"fit in with the current team\". Using concepts from this week, evaluate this proposal and recommend a better selection approach.",
     "points": ["Criticise type-based instruments: unstable classification, false dichotomies, weak prediction; not suitable for selection", "Stress job analysis and evidence rather than stereotypes; only job-relevant attributes should be measured", "Explain modest validity (Conscientiousness r = .22, ES r = .14), Correlation ≠ Certainty, faking, short tools unsuitable for high-stakes decisions", "Mention legal and ethical risk and irrelevant measurement increasing discrimination risk", "Clarify fit: define person–job vs person–organisation fit explicitly, not 'similar to us'", "Recommend multiple sources: work samples, structured interviews, cognitive ability measures; personality as one weak signal"],
     "model": "The proposal is flawed in several ways. First, it relies on a type-based instrument. The lecture criticises such tools because classifications are unstable on retesting, they create false dichotomies by cutting continuous scores into opposite labels, and they have weak evidence linking type to job performance, so they should not be used for selection. Using a type as a single cut-off is especially risky.\n\nSecond, the manager's belief about which types make the best staff is a stereotype. The correct approach is job analysis: identify the outcomes the store role actually requires, decide which attributes are related to those outcomes, and then assess candidates with evidence. Measuring irrelevant attributes wastes resources and can increase legal and discrimination risk.\n\nThird, even valid trait measures predict only modestly. Conscientiousness correlates about .22 and emotional stability .14 with overall performance; these are group trends, not certainties for any individual. Applicants can also fake self-report answers, and short tests are unsuitable for high-stakes decisions. Personality should be one weak signal among several.\n\nFinally, 'fitting in with the current team' risks hiring people with similar backgrounds and reducing diversity. Fit should be defined explicitly, distinguishing person–job fit (linked to satisfaction and performance) from person–organisation fit (linked to commitment and intention to stay), in terms of values and work style.\n\nThe chain should use continuous-score Big Five measures, if any, alongside work samples, structured interviews and cognitive ability measures, with the criterion defined in advance."},
    {"q": "Case: Mark, a project manager, writes in an employee's performance review: \"Lena is lazy and unreliable.\" Over the past month Lena missed three deadlines. Mark did not know that Lena's workload doubled after a colleague resigned, that she received conflicting instructions from two senior managers, and that two other team members also missed deadlines. Mark rates himself as an above-average manager. Using concepts from this week, analyse Mark's judgement and recommend how he should evaluate Lena.",
     "points": ["Identify the fundamental attribution error: overestimating personality, underestimating the situation (workload, conflicting instructions)", "Use the consistency questions: frequency, other contexts, special events, whether others behave the same way under the same conditions", "Link to the better-than-average effect and limits of self-awareness in Mark's self-rating", "Apply 'Rate behaviour, not character': describe 'missed three deadlines' rather than 'lazy'", "Recommend multiple sources, checking situational factors first, and fixing system issues (workload, clear instructions)"],
     "model": "Mark's review shows the fundamental attribution error: when explaining others' behaviour, people overestimate internal factors such as personality and underestimate situational factors. He labelled Lena 'lazy and unreliable', yet strong situational explanations exist. Her workload doubled after a resignation, she received conflicting instructions from two senior managers, and other team members also missed deadlines under the same conditions, which suggests the cause is the situation rather than her personality.\n\nBefore inferring personality, Mark should ask whether the behaviour happens often, whether Lena behaves this way in other contexts, whether something unusual happened, and whether others behave the same way in the same conditions. Here, the answers point to the situation.\n\nMark's self-view also deserves scrutiny. His belief that he is an above-average manager may reflect the better-than-average effect, which is strongest for personally important traits such as leadership ability. Self-assessment is an incomplete source of self-awareness, so he should seek feedback from others.\n\nMark should rate behaviour, not character. A fair review would state, \"Missed three deadlines this month,\" which is verifiable and discussable, rather than a personality label. He should use multiple sources of information, including observed behaviour, colleague feedback and actual work outputs. Finally, he should address the system problems by rebalancing workload and clarifying instructions with the senior managers, rather than blaming Lena's personality."},
    {"q": "Case: In an investment team, Alex consistently meets his targets, but colleagues report that he takes credit for others' analysis, withholds key information to make himself indispensable, and manipulates meeting decisions in his favour. The team's decision rules are informal and few records are kept. Some colleagues are also reluctant to challenge the team leader, who prefers top-down decisions. Using concepts from this week, analyse the situation and recommend what the organisation should do.",
     "points": ["Identify Machiavellianism (manipulation for personal gain) and the Dark Triad; link to counterproductive work behaviour, near-zero link with job performance", "Explain that loosely structured situations allow High Machs to take control (weak situation)", "Note authoritarianism of the leader suppressing dissent and sharing of bad news", "Apply 'Adjust the mechanism, not the person' and 'Measure counterproductive behaviour, not personality'", "Recommend transparent decision rules, records of who decided what, clear accountability, fair credit allocation, strengthening the situation"],
     "model": "Alex's behaviour is consistent with high Machiavellianism, a tendency to direct behaviour toward gaining power and manipulating others for personal gain. Machiavellianism belongs to the Dark Triad with narcissism and psychopathy. The meta-analysis cited in the lecture found these traits are positively related to counterproductive work behaviour but have very weak, near-zero relationships with normal job performance. This explains why Alex meets his targets while damaging colleagues: the harm appears in how he treats others rather than in his output.\n\nThe situation also enables his behaviour. Informal decision rules and few records create a loosely structured, weak situation, in which High Machs more easily take control. In addition, the team leader's authoritarianism discourages employees from questioning superiors or sharing bad news, so manipulation goes unchallenged.\n\nThe lecture's principle is not to diagnose Alex and label him with a dangerous personality, but to adjust the mechanism, not the person. The organisation should introduce transparent decision rules, keep clear records of who made which decision and who contributed which analysis, define individual accountability, allocate credit fairly, and reduce ambiguous spaces that can be manipulated. These measures strengthen the situation by increasing clarity, consistency, constraints and consequences.\n\nFinally, managers should measure counterproductive behaviour, not personality. Taking credit and withholding information are observable, recordable behaviours that can be addressed directly. The team leader should also invite challenge in meetings so problems surface early."}
  ]

  "concepts": [
    {"term": "Group", "zh": "群体", "def": "Two or more individuals who interact and are interdependent, brought together to achieve particular objectives.", "defZh": "两人以上，彼此互动、相互依赖，并为共同目标聚集；缺一不可。", "one": "两人以上，彼此互动、相互依赖，并为共同目标走到一起。", "eg": "课堂讨论小组互相配合完成同一份作业，是群体；公交站并排站着的陌生人不是。", "like": "像龙舟队：同一条船、互相配合、奔着同一个终点。"},
    {"term": "Social norms", "zh": "社会规范", "def": "Shared standards of acceptable behaviour that are usually unwritten and socially enforced.", "defZh": "群体共享的可接受行为标准，大多未写明，靠不赞同、冷落、排斥执行；写成正式要求后更接近 rule/policy。", "one": "群体里大家默认遵守、通常没写下来的规矩，违反了会被冷落。", "eg": "新员工发现大家开会都提前五分钟到，没人规定，但迟到的人会被侧目。", "like": "像排队：没有法律管，插队却会招来所有人的白眼。"},
    {"term": "Descriptive norm", "zh": "描述性规范", "def": "What most people in the group actually do.", "defZh": "多数人实际做什么（do），告诉成员什么是正常、适应性行为，在新环境和不确定情境中尤其强。", "one": "指大多数人实际上在做什么，它告诉你在这里什么算正常。", "eg": "到了新公司，看到同事都加班到七点，你也不好意思六点就走。", "like": "像在陌生车站跟着人流走：不认路时，就照多数人的方向走。"},
    {"term": "Injunctive norm", "zh": "指令性规范", "def": "What most people in the group believe one should do; what is approved or disapproved.", "defZh": "多数人认为应该做什么（should），提供对/错的社会或道德标准，违反会被批评或排斥。", "one": "指大多数人认为应该怎么做，也就是群体赞成什么、反对什么。", "eg": "大家都认为抄作业不对，就算有人偷偷抄，被发现也会挨批评。", "like": "像裁判的哨子：不管多少人在做，它只管哪个动作算犯规。"},
    {"term": "Pluralistic ignorance", "zh": "多元无知", "def": "A mistaken perception of the group's norm: members believe the group is a certain way when it is not.", "defZh": "成员对规范形成错误认知；行为跟随感知规范（perceived norm）而非真实规范（actual norm）。", "one": "大家都看错了群体的真实规范，结果一起迎合一个没人真正认同的标准。", "eg": "学生以为同学周末都大量喝酒，于是跟着多喝，其实多数人喝得少得多。", "like": "像《皇帝的新衣》：人人心里怀疑，却都以为别人真看见了。"},
    {"term": "Conformity (Asch effect)", "zh": "从众（阿希效应）", "def": "Going along with a unanimous group's judgement even when it is clearly wrong, to avoid being disliked or rejected.", "defZh": "Asch 线段实验：37% 关键作答跟随错误多数，约 75% 至少从众一次；主要解释是避免被讨厌或排斥。", "one": "明知多数人的答案是错的，为了不被排斥，还是公开跟着说。", "eg": "Asch 线段实验里，其他人一致选错，约 75% 的被试至少跟着错了一次。", "like": "像合唱时大家都跑调：宁可跟着一起错，也不敢一个人唱对。"},
    {"term": "Social loafing", "zh": "社会性懈怠", "def": "Individuals exert less effort when working collectively than when working alone.", "defZh": "集体工作时个人努力下降（2 + 2 = 3）；原因是公平恢复（equity）与贡献不可识别，属结构性问题。", "one": "一起干活时每人出力比单干少，因为贡献看不出、怕别人搭便车。", "eg": "十个人合写一份没有分章署名的报告，人人都以为别人会补，最后没人认真写。", "like": "像吃大锅饭：干多干少一个样，自然没人拼命。"},
    {"term": "Ringelmann effect", "zh": "林格尔曼效应", "def": "As group size increases, total group output may rise but average contribution per member falls.", "defZh": "拔河实验：总力量随人数上升，但每人平均贡献持续下降。", "one": "群体越大，总产出可能还在增加，但平均每个人的贡献越来越少。", "eg": "拔河实验里，人数越多总拉力越大，但平均每人出的力却越来越小。", "like": "像众人推车：人多车是快了点，但每个人手上都松了劲。"},
    {"term": "Diversity", "zh": "多样性", "def": "The degree to which group members are similar to or different from one another.", "defZh": "群体层面的属性（不是个人属性）；成本先出现，收益后出现。", "one": "群体成员彼此有多不同；它是整个群体的属性，代价先来，好处后到。", "eg": "跨国团队一开始沟通慢、常误会，磨合之后面对新难题反而点子更多、决策更好。", "like": "像多种食材的炖菜：刚下锅各味打架，慢炖之后才有层次。"},
    {"term": "Multicultural experience", "zh": "多元文化经验", "def": "An individual's experience of living in another culture; linked to creativity through adaptation and openness to experience.", "defZh": "个体经历；在国外生活（非旅行）与创造力正相关，因为需要真正适应另一套规范。", "one": "真正在另一个国家生活并适应当地规矩的经历，与更高创造力相关。", "eg": "在国外留学、自己租房办事交朋友的人，比只去旅游两周的人真正经历了适应。", "like": "像学游泳：在岸上看再久也不算，下水扑腾过才真会。"},
    {"term": "Team", "zh": "团队", "def": "A group whose goals, roles, rules and coordination are made explicit.", "defZh": "每个团队都是群体，但并非每个群体都是团队；团队把目标、角色、规则与协调明确化。", "one": "把目标、角色、规则和协调方式都明确说清楚的群体。", "eg": "项目组定好负责人、分工表和截止日期后，就从松散的群体变成了团队。", "like": "像足球队：位置、战术、规则都定好，而不是一群人围着球乱跑。"},
    {"term": "Positive synergy", "zh": "正向协同", "def": "When a work team's coordinated efforts produce performance greater than the sum of individual inputs.", "defZh": "2 + 2 = 5；来自互补信息、工作衔接、相互检查与观点组合。", "one": "大家配合之后的整体表现，超过每个人单干加起来的总和。", "eg": "工程师懂技术、销售懂客户，一起讨论出的方案比两人各写一份都好。", "like": "像拼图：每块单看很普通，拼在一起才出现完整的画面。"},
    {"term": "Team cohesiveness", "zh": "团队凝聚力", "def": "The degree to which members are attracted to the team and motivated to remain in it.", "defZh": "来源：频繁互动、共同目标、个人吸引；提高士气，但对生产力的影响取决于团队规范。", "one": "成员有多喜欢这个团队、多想留下；它会放大团队原有的规范。", "eg": "设计公司同事都是好朋友，却默认「差不多就行」，越团结就越一起敷衍。", "like": "像扩音器：放大的是团队本来的声音，好坏一起放大。"},
    {"term": "Psychological safety", "zh": "心理安全", "def": "Members can be themselves, admit mistakes and ask obvious questions without fear of humiliation.", "defZh": "四种团队规范之首；让半成品想法敢于被提出。", "one": "在团队里敢认错、问傻问题、提不成熟的想法，不怕丢脸。", "eg": "开会时新人说「我可能想错了，但……」，大家认真听，而不是嘲笑。", "like": "像有安全网的空中飞人：敢做大胆动作，因为掉下来不会摔伤。"},
    {"term": "Social sensitivity", "zh": "社会敏感性", "def": "Members can read others' emotions and states and respond appropriately.", "defZh": "注意谁被打断、谁不安、何时需要停下澄清。", "one": "能读懂别人的情绪和状态，并做出合适的回应。", "eg": "主持人注意到某位同事两次被打断，主动说「我们先听她说完」。", "like": "像好司机看路况：留意别人的细微信号，及时减速让一让。"},
    {"term": "Equal participation", "zh": "平等参与", "def": "Speaking opportunities are roughly balanced rather than dominated by one voice.", "defZh": "Woolley et al. (2010)：人人有机会发言时 collective intelligence 更高。", "one": "团队里每个人的发言机会大致均衡，而不是一个人包场。", "eg": "创意会上资深员工一个人讲了 40 分钟，其他人只点头，团队等于只用了一颗脑袋。", "like": "像聚餐每人点一道菜：菜才丰富，不会全是一个人的口味。"},
    {"term": "Team creativity", "zh": "团队创造力", "def": "A team developing novel and useful ideas.", "defZh": "终点是想法（idea）；创意必须同时新（novel/original）和有用（appropriate/feasible）。", "one": "团队想出既新颖又有用的点子，但只停在想法这一步。", "eg": "公司的「点子墙」收集了 80 条员工建议，但没有一条被拿去试验落地。", "like": "像画好的建筑设计图：有创意，但房子还没盖。"},
    {"term": "Team innovation", "zh": "团队创新", "def": "A team developing and implementing novel and useful ideas, products or solutions.", "defZh": "终点是投入使用（something in use）；需要预算、负责人和实施路径。", "one": "团队不但想出新颖有用的点子，还真的把它做出来、用起来。", "eg": "公司从员工建议里挑出一条，指定负责人、拨一点预算，试点上线并公布结果。", "like": "像把设计图真的盖成能住人的房子。"},
    {"term": "Collective information processing", "zh": "集体信息加工", "def": "Members share, challenge, extend and combine one another's information rather than simply listing ideas.", "defZh": "分享只是把信息放上桌；elaboration 与 deep consideration 才把信息转化为高质量创意。", "one": "成员互相分享、质疑、延伸并组合彼此的信息，而不只是轮流列点子。", "eg": "A 提出一个想法，B 指出风险，C 在此基础上改进，最后合成更强的方案。", "like": "像接力改稿：每人在前一人的稿子上再改，而不是各写各的。"},
    {"term": "Perspective taking", "zh": "观点采择", "def": "Understanding others' viewpoints so that diverse teams can process differences rather than be derailed by them.", "defZh": "让多样化团队在差异上继续加工，而不是只发生冲突。", "one": "主动站到别人的角度去理解对方，让差异变成可用的信息而不是冲突。", "eg": "跨文化团队有分歧时，先问对方「你为什么这样看」，再把双方的考虑合起来。", "like": "像换到对面的座位看风景：坐过去，才看见他眼里的那一面。"}
  ],
  "tf": [
    {"q": "Strangers standing close together at a bus stop usually constitute a group in the management sense.", "a": false, "exp": "公交站的陌生人既不相互依赖，也没有共同目标，所以不算群体。"},
    {"q": "In Asch's line experiment, about 75% of participants conformed to the incorrect majority at least once.", "a": true, "exp": "约 75% 的人至少从众了一次；37% 是关键作答跟随错误多数的比例。"},
    {"q": "In Asch's experiment, 37% of all participants conformed on every critical trial.", "a": false, "exp": "37% 指的是所有关键作答里跟着错误多数的比例，不是 37% 的人每次都从众。"},
    {"q": "A descriptive norm tells group members what most people actually do, while an injunctive norm tells them what most people think they should do.", "a": true, "exp": "描述性规范看大家实际在做什么，指令性规范看大家认为应该做什么。"},
    {"q": "According to the lecture, the objective (actual) norm usually drives behaviour more strongly than the perceived norm.", "a": false, "exp": "推动行为更强的是人们感知到的规范，而不是客观规范，所以多元无知才有害。"},
    {"q": "Social loafing requires that individual members are personally lazy.", "a": false, "exp": "社会性懈怠来自贡献看不出和想恢复公平这两个结构原因，不需要成员真的懒。"},
    {"q": "In Ringelmann's tug-of-war study, total group force increased as group size increased, even though average individual effort fell.", "a": true, "exp": "人越多总拉力越大，但平均每人出的力越来越小，两个趋势同时出现。"},
    {"q": "Diversity is a property of the group as a whole, not of any single individual.", "a": true, "exp": "一个人可以很独特，但多样性要把多个人放在一起比较才谈得上。"},
    {"q": "The benefits of diversity, such as greater creativity, typically appear before its costs, such as conflict.", "a": false, "exp": "顺序正好相反：冲突这类成本先出现，创造力这类收益后出现。"},
    {"q": "Research summarised in the lecture found that travelling abroad was associated with creativity just as strongly as living abroad.", "a": false, "exp": "只有在国外生活与创造力相关，因为要真正适应当地规矩；旅行可以一直做旁观者。"},
    {"q": "High team cohesiveness always increases team productivity.", "a": false, "exp": "凝聚力只是放大团队已有的规范，如果规范是少出力，越团结越一起偷懒。"},
    {"q": "Every team is a group, but not every group is a team.", "a": true, "exp": "团队把目标、角色、规则和协调都明确了，普通群体不一定做到这些。"},
    {"q": "An idea that is highly novel but cannot be applied counts as a creative product.", "a": false, "exp": "创意产品必须既新又有用，只新奇却做不出来，只能算稀奇。"},
    {"q": "Team innovation, unlike team creativity, includes the implementation of novel and useful ideas.", "a": true, "exp": "创造力停在想法这一步，创新还要把想法实施并投入使用。"},
    {"q": "The lecture's main explanation for conformity in Asch's experiment is that following the group reduces the risk of being disliked or rejected.", "a": true, "exp": "跟着群体是为了不被讨厌或排斥；哪怕只是判断线段长短，人们也怕偏离群体。"}
  ],
  "mcq": [
    {"q": "A lecturer announces: \"Half of you submitted late last week, so I'll be flexible again.\" Which problem does this create?", "options": ["It weakens an injunctive norm by threatening punishment", "It publicises a bad descriptive norm, signalling that lateness is normal", "It causes social loafing by making contributions unidentifiable", "It creates positive synergy among students"], "answer": 1, "exp": "老师公开说「半数人迟交」，等于宣传了一个坏的描述性规范，让大家觉得迟交很正常；应该宣传准时的好规范。"},
    {"q": "A manager opens a meeting by saying \"I think Option A is clearly best — any objections?\" Everyone nods. Which concept best explains the silence?", "options": ["Social loafing", "Pluralistic ignorance about workload", "Conformity pressure as in Asch's experiment", "Positive synergy"], "answer": 2, "exp": "经理先说了自己的答案，别人为了不被排斥只好附和，这就是 Asch 式的从众压力。正确做法是先私下收集意见、最后发言。"},
    {"q": "Students drink heavily on weekends because they believe most peers do so, although most peers actually drink far less. This is an example of:", "options": ["Injunctive norm enforcement", "Social loafing", "Positive synergy", "Pluralistic ignorance"], "answer": 3, "exp": "学生误以为同学都喝很多，于是跟着多喝，其实多数人喝得少；大家都在迎合一个没人真正持有的规范，这就是多元无知。"},
    {"q": "Ten employees co-write a report with no named sections; each assumes someone else will finish it. What is the most appropriate structural fix?", "options": ["Assign named, measurable responsibilities for each section", "Increase team cohesiveness through social events", "Add more members to cover missing skills", "Label the low contributors as lazy"], "answer": 0, "exp": "没人署名，贡献看不出来，责任也被摊薄，所以才有社会性懈怠；解决办法是给每一部分指定署名、可追踪的责任。"},
    {"q": "A manager concludes that members of a loafing team are simply lazy people. Based on the lecture, what is the best response?", "options": ["Agree, because social loafing reflects low conscientiousness", "Increase team size so lazy members are diluted", "Raise cohesiveness, which always fixes effort problems", "First check whether contributions are identifiable and whether members feel others are free-riding"], "answer": 3, "exp": "社会性懈怠的两个主因是贡献看不出和想恢复公平，都是结构问题，所以先别贴「懒」的标签，先检查任务结构。"},
    {"q": "According to the lecture, what is the recommended working range for team size?", "options": ["2–4 members", "3–6 members", "5–9 members", "8–12 members"], "answer": 1, "exp": "3 到 6 人：大到能覆盖所需技能，小到每个人的贡献都看得见、沟通顺畅；超过 6 人努力会下降，协调问题增多。"},
    {"q": "A cross-cultural team has had frequent conflict and slow discussions during its first two months. The director wants to disband it immediately. Based on the lecture, the best advice is:", "options": ["Disband it, because diversity reduces decision quality", "Replace members with more similar people to raise morale", "Keep it, invest in communication and psychological safety, and allow time for benefits to emerge", "Let the most senior member make all decisions to avoid conflict"], "answer": 2, "exp": "多样性的代价先来、好处后到，现在解散只尝到了代价；应该把磨合算进预算，建立心理安全和观点采择，等好处出现。"},
    {"q": "Which statement best describes the relationship between team cohesiveness and productivity?", "options": ["Cohesion amplifies whatever norms the team already holds", "Cohesion always lowers productivity because of groupthink", "Cohesion has no relationship with morale", "Cohesion increases productivity regardless of norms"], "answer": 0, "exp": "凝聚力是放大器，放大的是团队已有的规范：高绩效规范下生产力提高，少出力的规范下大家更团结地一起摸鱼。"},
    {"q": "Members of a team get along very well, but their shared norm is \"do the minimum and don't take it too seriously\". What outcome is most likely?", "options": ["High productivity due to high morale", "Positive synergy", "Low productivity reinforced by high cohesion", "Increased social sensitivity"], "answer": 2, "exp": "团队很团结，但共同的规范是少做点，凝聚力只会把这条规范放大，结果是大家一起低产出。"},
    {"q": "In a creativity session, a senior employee talks for 40 minutes while others simply agree. Which problem is most directly illustrated?", "options": ["Pluralistic ignorance", "Unequal participation reducing collective intelligence", "Excessive diversity costs", "Lack of an injunctive norm"], "answer": 1, "exp": "一个人讲 40 分钟、其他人只点头，团队等于只用了一个人的脑袋，信息没法组合，集体智力随之下降。"},
    {"q": "A company collects 100 employee ideas but assigns no owner, budget or trial process. Over time employees stop suggesting ideas. This best illustrates:", "options": ["Creativity without innovation, leading to cynicism", "Innovation without creativity", "Social loafing caused by large group size", "A strong injunctive norm against ideas"], "answer": 0, "exp": "公司只收集点子却不实施，这是有创造力而没有创新；想法总是被封存，员工就会变得愤世嫉俗，不再提建议。"},
    {"q": "Which of the following is NOT one of the four team norms worth establishing according to the lecture?", "options": ["Psychological safety", "Emotional expression", "Social sensitivity", "Strict hierarchy"], "answer": 3, "exp": "四种值得建立的规范是心理安全、情绪表达、社会敏感性和平等参与；严格的等级制度不在其中。"},
    {"q": "What distinguishes a team from a group in the lecture?", "options": ["A team must have more than six members", "A team has explicit goals, defined roles, explicit rules and coordination", "A team's members must like one another", "A team has no conflict"], "answer": 1, "exp": "团队把目标、角色、规则和协调都明确说清楚；成员互相喜欢是凝聚力的事，不是团队的定义。"},
    {"q": "A remote team rarely interacts informally, and members feel less attached to the team. Which source of cohesiveness is weakest?", "options": ["Shared goals", "Equal participation", "Team interaction", "Perspective taking"], "answer": 2, "exp": "频繁互动是凝聚力的来源之一，远程团队很少非正式交流，这一来源最弱，所以要有意安排互动。"},
    {"q": "Participants primed to imagine living abroad solved more Remote Association Task items than other groups. What mechanism did the lecture use to explain this?", "options": ["Adaptation to another culture's norms", "Social loafing among the control group", "Higher conscientiousness", "Conformity to the experimenter"], "answer": 0, "exp": "在国外生活必须真正按另一套规矩运作，这种适应（adaptation）带来创造力；旅行可以一直当旁观者。"},
    {"q": "Team B has two members debating while the other three watch. Compared with Team C, where members take roughly equal turns, Team B is likely to:", "options": ["Outperform Team C because debate deepens elaboration", "Perform equally, since information is still shared", "Draw on fewer members' information and perform worse than Team C", "Suffer from too much psychological safety"], "answer": 2, "exp": "Team B 只有两个人在说，用到的信息比全员轮流发言的 Team C 少，所以表现更差；辩论热闹不等于信息齐全。"},
    {"q": "Which sequence best reflects the creativity process chain described in the lecture?", "options": ["Implementation → Combination → Information sharing → Psychological safety", "Psychological safety → Information sharing → Elaboration → Combination → Creative idea → Implementation path", "Cohesion → Conformity → Creative idea → Implementation", "Diversity → Conflict → Disbanding → Innovation"], "answer": 1, "exp": "心理安全让人敢开口，平等参与把信息带进来，延伸（elaboration）和组合产生创意，实施路径再把创造力变成创新。"}
  ],
  "match": [
    {"title": "Match each concept to its description",

  "essay": [
    {"q": "Case: Mei leads a new 11-person product team drawn from five countries. In meetings, Mei usually opens by stating her preferred solution and then asks for comments; most members nod. Two months in, the team reports frequent misunderstandings and slow progress, and several members privately say that others are \"not pulling their weight\" on the shared report, which has no named sections. Senior management is considering disbanding the team. Using concepts from Week 4, diagnose the problems and recommend what Mei should do.",
     "points": ["Identify conformity pressure (Asch): leader speaking first sets the answer; silence is not agreement", "Identify social loafing caused by team size above 3–6 and unidentifiable contributions; explain equity and measurability causes", "Explain that diversity costs arrive early and benefits later; disbanding now forfeits the benefits", "Recommend converting the group into a team: clear goals, defined roles, explicit rules, coordination", "Recommend process changes: collect views privately, speak last, equal participation, psychological safety"],
     "model": "Diagnosis: Mei's team shows three Week 4 problems. First, conformity pressure: by stating her preference first, Mei effectively sets the group answer. As Asch showed, people often publicly follow a unanimous view to avoid rejection, so nodding should not be read as agreement. Second, social loafing: with 11 members and no named sections, individual contributions are unidentifiable and members restore equity by reducing effort when they believe others free-ride. The team is also well above the 3–6 working range, increasing coordination costs. Third, the misunderstandings and slow progress reflect the early costs of diversity — conflict, slower communication and lower morale — which typically appear before benefits such as creativity and better decisions on complex, novel problems.\n\nRecommendations: Management should not disband the team now; it should budget for diversity costs. Mei should split the work into sub-teams of 3–6, assign named, measurable responsibilities, and turn the group into a team by writing down goals, roles, rules and coordination. In meetings she should collect views privately beforehand, speak last, track who is talking, and invite minority views. Building psychological safety and perspective taking will help members elaborate on one another's information, enabling positive synergy rather than mere friction."},
    {"q": "Case: A design agency's staff are very close friends who socialise every weekend. Their informal motto is \"good enough is good enough\". Client satisfaction is falling. Meanwhile, the CEO launched an \"ideas wall\" that has gathered 80 suggestions, but none has been tested, and staff now joke that the wall is \"where ideas go to die\". Using Week 4 concepts, explain what is going wrong and how the CEO should respond.",
     "points": ["Explain that cohesion amplifies existing norms; high cohesion + low-performance norm lowers productivity", "Distinguish creativity (ideas) from innovation (implementation); ideas wall lacks implementation path", "Identify cynicism resulting from ideas with no route to implementation", "Recommend stating and publicising high-performance norms; injunctive and descriptive norms", "Recommend owners, budgets and trial processes; reward elaboration; collective information processing"],
     "model": "Diagnosis: The agency has high cohesiveness — members are attracted to the team through frequent interaction and personal attraction — but cohesion is an amplifier, not a guarantee of performance. Because the shared norm is \"good enough\", cohesion makes members more united in low effort, so productivity and client satisfaction fall. Second, the ideas wall generates creativity (novel and useful ideas) but not innovation, which requires ideas to be implemented and put into use. With no owner, budget or testing process, ideas are praised and shelved, producing cynicism; employees learn that suggesting ideas is pointless.\n\nRecommendations: The CEO should state the desired norm out loud and publicise good descriptive norms, for example highlighting projects that exceeded client expectations, rather than assuming staff know the standard. Because the team is cohesive, shifting its norm toward high quality will let cohesion amplify effort. For innovation, the CEO should create a route to implementation: screen ideas, assign owners, fund small trials and report outcomes. Idea sessions should emphasise collective information processing — equal participation, psychological safety and rewarding people who elaborate on others' ideas — so that ideas are combined into stronger proposals rather than merely collected."}
  ]
